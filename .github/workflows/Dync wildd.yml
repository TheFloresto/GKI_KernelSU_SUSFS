name: Sync from WildKernels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GOOO
        uses: actions/checkout@v5
        with:
          ref: GOOO
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}   # без лишней "l"

      - name: Sync from ahmed-alnassif dev → GOOO
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Источник (публичный репозиторий)
          git remote add wild https://github.com/ahmed-alnassif/GKI_KernelSU_SUSFS.git || true
          git fetch wild dev

          # Полностью заменить GOOO содержимым dev
          git reset --hard wild/dev

          # Запушить в твой репозиторий
          git push origin GOOO --force
