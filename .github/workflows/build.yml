          echo "Initializing kernel configuration..."
          echo "DEFCONFIG=./common/arch/arm64/configs/gki_defconfig" >> $GITHUB_ENV
          
          # Remove check_defconfig
          sed -i '2s/check_defconfig//' ./common/build.config.gki

      - name: Configure KernelSU Core
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # KernelSU Configuration
          echo "# KernelSU Configuration" >> "${{ env.DEFCONFIG }}"     
          echo "CONFIG_KSU=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "${{ env.DEFCONFIG }}"
          # BBG Support
          echo "CONFIG_KSU_DEBUG=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_ALLOWLIST_WORKAROUND=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "${{ env.DEFCONFIG }}"   
          
      - name: Configure SukiSU
        if: ${{ inputs.kernelsu_variant == 'SukiSU' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          # SukiSU Support
          echo "# SukiSU Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KPM=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KALLSYMS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_MANUAL_SU=n" >> "${{ env.DEFCONFIG }}"
          
          # SukiSU ZRAM and KPM Configuration
          echo "# SukiSU ZRAM Configuration" >> "${{ env.DEFCONFIG }}"
          
          # Для kernel 5.10
          if [[ "${{ inputs.kernel_version }}" == "5.10" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ZRAM=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_MODULE_SIG=n" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_CRYPTO_LZO=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          # Для kernel 5.15, 6.1 (не 5.10 и не 6.6)
          if [[ "${{ inputs.kernel_version }}" != "6.6" ]] && [[ "${{ inputs.kernel_version }}" != "5.10" ]]; then
            if grep -q "CONFIG_ZSMALLOC" "${{ env.DEFCONFIG }}"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "${{ env.DEFCONFIG }}"
            else
              echo "CONFIG_ZSMALLOC=y" >> "${{ env.DEFCONFIG }}"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "${{ env.DEFCONFIG }}"
          fi
          
          # Для kernel 6.6
          if [[ "${{ inputs.kernel_version }}" == "6.6" ]]; then
            echo "CONFIG_ZSMALLOC=y" >> "${{ env.DEFCONFIG }}"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "${{ env.DEFCONFIG }}"
          fi
          
          # Для Android 14/15 - отключаем принудительную подпись модулей
          if [[ "${{ inputs.android_version }}" == "android14" ]] || [[ "${{ inputs.android_version }}" == "android15" ]]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' ./common/modules.bzl
            echo "CONFIG_MODULE_SIG_FORCE=n" >> "${{ env.DEFCONFIG }}"
          fi
          
          # Добавляем дополнительные компрессоры если ZRAM включен
          if grep -q "CONFIG_ZSMALLOC=y" "${{ env.DEFCONFIG }}" && grep -q "CONFIG_ZRAM=y" "${{ env.DEFCONFIG }}"; then
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_CRYPTO_842=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "${{ env.DEFCONFIG }}"
          fi

