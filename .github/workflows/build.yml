name: Kernel Build Process
permissions:
  contents: write
  actions: write 

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string

jobs:
  build-gki:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        apply_bypass: ["normal", "bypass"]

    steps:
      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing build dependencies..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 bc cpio kmod \
            zip xz-utils
          sudo apt-get clean

      - name: Check Initial Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Initial Total Disk Space in GB ====="
          df -BG
          
      - name: Download Apache Arrow's util_free_space.sh
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh
          
      - name: Check Disk Space After Cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Total Disk Space After Cleanup in GB ====="
          df -BG
          
      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          # Set CONFIG dynamically based on inputs values
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Setup Build Environment
        shell: bash
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2025
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools &
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg &
          wait
          
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH" >> $GITHUB_ENV
          
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/./git-repo/repo" >> $GITHUB_ENV

      - name: Set boot sign key
        shell: bash
        run: |
          set -euo pipefail
          BOOT_SIGN_KEY="${{ secrets.BOOT_SIGN_KEY }}"
          if [ ! -z "$BOOT_SIGN_KEY" ]; then
            echo "$BOOT_SIGN_KEY" > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          fi

      - name: Clone AnyKernel3 and Other Dependencies
        shell: bash
        run: |
          set -euo pipefail
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          
          git clone https://github.com/TheFloresto/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/TheFloresto/kernel_patches.git -b main
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"

      - name: Initialize and Sync Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CONFIG"
          cd "$CONFIG"
          
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          
          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
          
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
          
      - name: Check Directory Space Usage
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Total Disk Space After Kernel Download in GB ====="
          df -BG
          
          echo "===== Directory Space Usage in GB ====="
          du -BG -d 1 | sort -nr
          
          echo "===== $CONFIG Directory Space Usage in GB ====="
          cd "$CONFIG"
          du -BG -d 2 | sort -nr

      - name: Extract Actual Sublevel for LTS Builds
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.sub_level }}" != "X" ]; then
            exit 0
          fi
          
          cd "$CONFIG/common"
          
          if [ -f "Makefile" ]; then
            ACTUAL_SUBLEVEL=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
            
            if [ -n "$ACTUAL_SUBLEVEL" ]; then
              OLD_CONFIG="$CONFIG"
              NEW_CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-$ACTUAL_SUBLEVEL"
              
              echo "CONFIG=$NEW_CONFIG" >> $GITHUB_ENV
              echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
              
              cd ../..
              if [ -d "$OLD_CONFIG" ]; then
                echo "Renaming directory from $OLD_CONFIG to $NEW_CONFIG"
                mv "$OLD_CONFIG" "$NEW_CONFIG"
                if [ ! -d "$NEW_CONFIG" ]; then
                  echo "Error: Directory rename failed, $NEW_CONFIG does not exist"
                  exit 1
                fi
                echo "Directory successfully renamed to $NEW_CONFIG"
              else
                echo "Error: Source directory $OLD_CONFIG does not exist"
                exit 1
              fi
            fi
          fi

      - name: Apply glibc 2.38 Compatibility Fix
        shell: bash
        run: |
          set -euo pipefail
          # Use ACTUAL_SUBLEVEL for LTS builds, otherwise use the input sub_level
          SUBLEVEL_TO_CHECK="${ACTUAL_SUBLEVEL:-${{ inputs.sub_level }}}"
          
          if ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $SUBLEVEL_TO_CHECK <= 186 ))) || 
              ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $SUBLEVEL_TO_CHECK <= 119 ))) || 
              ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $SUBLEVEL_TO_CHECK <= 110 ))) || 
              ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "6.1" ]] && (( $SUBLEVEL_TO_CHECK <= 43 ))); then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}') 
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then 
              cd $CONFIG/common/
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
              if ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $SUBLEVEL_TO_CHECK <= 186 ))) || 
                  ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $SUBLEVEL_TO_CHECK <= 119 ))) || 
                  ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $SUBLEVEL_TO_CHECK <= 110 ))); then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi 

      - name: Fix Less Then 6.6.50 Builds
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.android_version }}" != "android15" ] || [ "${{ inputs.kernel_version }}" != "6.6" ]; then
            exit 0
          fi
          
          cd "$CONFIG/common"
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
              sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi

      - name: Apply ptrace patch for older kernels
        shell: bash
        run: |
          set -euo pipefail
          if (( $(echo "${{ inputs.kernel_version }} >= 5.16" | bc -l) )); then
            exit 0
          fi
          
          cd "$CONFIG/common"
          patch -p1 -F 3 < "../../kernel_patches/gki_ptrace.patch"

      - name: Determine the branch for KernelSU
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.kernelsu_branch }}" in
            "Stable")
              if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
                echo "BRANCH=-s susfs-main" >> $GITHUB_ENV
              else
                echo "BRANCH=-" >> $GITHUB_ENV
              fi
              ;;
            "Dev")
              if [[ "${{ inputs.kernelsu_variant }}" =~ ^(KSU|MKSU)$ ]]; then
                echo "BRANCH=-s main" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "NEXT" ]]; then
                echo "BRANCH=-s next" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "WKSU" ]]; then
                echo "BRANCH=-s wild" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
                echo "BRANCH=-s susfs-test" >> $GITHUB_ENV
              fi
              ;;
            "Other")
              if [[ -n "${{ inputs.kernelsu_branch_other }}" ]]; then
                echo "BRANCH=-s ${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
              else
                echo "Error: Custom branch not provided for 'Other'" >&2
                exit 1
              fi
              ;;
          esac

      - name: Add KernelSU
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
      
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Adding WKSU..."
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "KSU")
              echo "Adding KernelSU Official..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "NEXT")
              echo "Adding KernelSU Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "SukiSU")
              echo "Adding KernelSU SukiSU..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash ${{ env.BRANCH }}       
              ;;
            "MKSU")
              echo "Adding KernelSU MKSU..."
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
          esac
          
      - name: Getting KernelSU Version
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Getting WKSU version..."
              cd ./Wild_KSU
              BASE_VERSION=10200
              ;;
            "KSU")
              echo "Getting Official KernelSU version..."
              cd ./KernelSU
              BASE_VERSION=10200
              ;;
            "NEXT")
              echo "Getting NEXT version..."
              cd ./KernelSU-Next
              BASE_VERSION=10200
              ;;
            "SukiSU")
              echo "Getting SukiSU version... "
              git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
              cd SukiSU-Ultra
              BASE_VERSION=10700  
              ;;
            "MKSU")
              echo "Getting MKSU version..."   
              cd ./KernelSU
              BASE_VERSION=10200           
              ;;
          esac
          COMMIT_COUNT=$(/usr/bin/git rev-list --count HEAD)
          echo "Commits: $COMMIT_COUNT"
          KSU_VERSION=$(expr $COMMIT_COUNT "+" $BASE_VERSION)
          echo "KSUVER=$KSU_VERSION"
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

      - name: Apply SUSFS Patches for KernelSU Variants
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          # Apply compatibility fixes
          SUSFS_VERSION="1.5.12"

          cp -rfv ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp -rfv ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          # Apply core SUSFS patches
          cp -fv ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cd common
          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true

          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Applying SUSFS patches for WKSU..."
              cd ../Wild_KSU
              cp -v ../../kernel_patches/next/0001-Susfs-1.5.9.patch ./
              patch -p1 --forward < 0001-Susfs-1.5.9.patch      

              cp -v ../../kernel_patches/next/0001-james.patch ./
              patch -p1 --forward < 0001-james.patch 
              ;;
            "KSU")
              echo "Applying SUSFS patches for Official KernelSU..."
              cd ../KernelSU
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true          
              ;;
            "NEXT")
              echo "Applying SUSFS patches for KernelSU Next..."           
              # Apply additional SUSFS patches for Android 13 5.15 compatibility
              if [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( ${{ inputs.sub_level }} <= 41 )); then
               cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_fdinfo.c.patch ./
               patch -p1 < fix_fdinfo.c.patch || true
               cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_namespace.c.patch ./
               patch -p1 < fix_namespace.c.patch || true
               cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_open.c.patch ./
               patch -p1 < fix_open.c.patch || true
               sed -i 's/i_uid_into_mnt(i_user_ns(inode), inode)/i_uid_into_mnt(inode->i_sb->s_user_ns, inode)/g' fs/susfs.c
              fi

               # Use ACTUAL_SUBLEVEL for LTS or actual kernel sublevel if available
               SUBLEVEL_TO_CHECK="${ACTUAL_SUBLEVEL:-${{ inputs.sub_level }}}"
               if ( [[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "6.1" ]] && { [[ "$SUBLEVEL_TO_CHECK" =~ ^[0-9]+$ ]] && (( SUBLEVEL_TO_CHECK >= 145 )); } ) \
                || ( [[ "${{ inputs.android_version }}" == "android15" ]] && [[ "${{ inputs.kernel_version }}" == "6.6" ]] && { [[ "$SUBLEVEL_TO_CHECK" =~ ^[0-9]+$ ]] && (( SUBLEVEL_TO_CHECK >= 98 )); } ); then
                cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_base.c.patch ./
                patch -p1 < fix_base.c.patch || true
               fi

               if ( [[ "${{ inputs.android_version }}" == "android15" ]] && [[ "${{ inputs.kernel_version }}" == "6.6" ]] && (( SUBLEVEL_TO_CHECK <= 58 )); } ); then
                cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_task_mmu.c.patch ./
                patch -p1 < fix_task_mmu.c.patch || true
               fi

                # Apply KSU integration patches
                cd ../KernelSU-Next
                cp -fv ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch .
                patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
                cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_core_hook.c.patch ./
                patch -p1 < fix_core_hook.c.patch

                cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_sucompat.c.patch ./
                patch -p1 < fix_sucompat.c.patch

                cp -fv ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_kernel_compat.c.patch ./
                patch -p1 < fix_kernel_compat.c.patch

               cp -v ../../kernel_patches/next/0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch ./
               patch -p1 --forward < 0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch     
              ;;
             "SukiSU")
              echo "Applying SUSFS patches for SukiSU..."
              cd ../KernelSU              
              ;;
            "MKSU")
              echo "Applying SUSFS patches for MKSU..."
              cd ../KernelSU
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true       
              
              cp -v ../../kernel_patches/next/0001-Susfs-1.5.9.patch ./
              patch -p1 --forward < 0001-Susfs-1.5.9.patch             
              ;;
          esac


      - name: Apply Hooks Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Applying hooks for WKSU..."
              cp -fv ../../kernel_patches/next/60_scope-minimized_manual_hooks.patch ./
              patch -p1 --forward -F 3 < 60_scope-minimized_manual_hooks.patch
              ;;
            "KSU")
              echo "Applying hooks for Official KernelSU..."
              cp -fv ../../kernel_patches/sultan/ksu_hooks.patch ./
              patch -p1 --forward -F 3 < ksu_hooks.patch
              ;;
            "NEXT")
              echo "Applying hooks for KernelSU-Next..."
              cp -fv ../../kernel_patches/next/scope_min_manual_hooks_v1.4.patch ./
              patch -p1 --forward -F 3 < scope_min_manual_hooks_v1.4.patch
              ;;
            "SukiSU")
              echo "Applying hooks for SukiSU..."          
              cp -fv ../../SukiSU_patch/hooks/syscall_hooks.patch ./
              patch -p1 --forward -F 3 < syscall_hooks.patch
              ;;
            "MKSU")
              echo "Applying hooks for MKSU..."
              cp -fv ../../kernel_patches/sultan/ksu_hooks.patch ./
              patch -p1 --forward -F 3 < ksu_hooks.patch             
              ;;
          esac 

      - name: Scan and collect patch rejects
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_DIR="$CONFIG"
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          # Find all .rej files under the configuration directory
          mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              # Relative path from $CONFIG
              REL="${REJ#"$CONFIG_DIR"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              # Copy the associated original file alongside the .rej
              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
                mkdir -p "$(dirname "$ORIG_DEST")"
                cp "$ORIG" "$ORIG_DEST"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Add BBG
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' common/security/Kconfig

      - name: Apply Module Check Bypass
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.apply_bypass }}" != "bypass" ]; then
            exit 0
          fi
          
          if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" ]]; then
            cd "$CONFIG/common/kernel/module"
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' version.c
          else
            cd "$CONFIG/common/kernel"
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' module.c
          fi

      - name: Fix WiFi and Bluetooth on Samsung 6.6 GKI devices
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.kernel_version }}" != "6.6" ]; then
            exit 0
          fi
          
          SYMBOL_LIST=$CONFIG/common/android/abi_gki_aarch64_galaxy
          echo "kdp_set_cred_non_rcu" >> $SYMBOL_LIST
          echo "kdp_usecount_dec_and_test" >> $SYMBOL_LIST
          echo "kdp_usecount_inc" >> $SYMBOL_LIST
          
          cd $CONFIG/common
          PATCH="../../kernel_patches/samsung/min_kdp/add-min_kdp-symbols.patch"
          if patch -p1 --dry-run < $PATCH; then
            patch -p1 --no-backup-if-mismatch < $PATCH
          fi
          
          cd drivers
          cp "../../../kernel_patches/samsung/min_kdp/min_kdp.c" min_kdp.c
          echo "obj-y += min_kdp.o" >> Makefile

      - name: Set Kernel Configuration Variables
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          echo "Initializing kernel configuration..."
          echo "DEFCONFIG=./common/arch/arm64/configs/gki_defconfig" >> $GITHUB_ENV
          
          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Configure KernelSU Core
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # KernelSU Configuration
          echo "# KernelSU Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "${{ env.DEFCONFIG }}"
          # BBG Support
          echo "CONFIG_KSU_DEBUG=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_ALLOWLIST_WORKAROUND=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure SukiSU
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.kernelsu_variant }}" != "SukiSU" ]; then
            exit 0
          fi
          
          cd "$CONFIG"
          # SukiSU Support
          echo "# SukiSU Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KPM=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure SUSFS
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # SUSFS Configuration
          echo "# SUSFS Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS=y" >> "${{ env.DEFCONFIG }}"
          echo "#CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "${{ env.DEFCONFIG }}"

          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "${{ env.DEFCONFIG }}"

          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "${{ env.DEFCONFIG }}"

          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "${{ env.DEFCONFIG }}"

      - name: Configure Mountify Support
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # Mountify Support
          echo "# Mountify Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TMPFS_XATTR=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure Networking
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # Networking Configuration
          echo "# Networking Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure TCP Congestion Control
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # BBR TCP Congestion Control
          echo "# BBR TCP Congestion Control" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_BBR=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_NET_SCH_FQ=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_BIC=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "${{ env.DEFCONFIG }}"

      - name: Configure IPSet Support
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # IPSet support
          echo "# IPSet Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_MAX=65534" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IP=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_MAC=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_LIST_SET=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure Build Optimization
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          # Build Optimization Configuration with O3
          echo "# Build Optimization Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_OPTIMIZE_INLINING=y" >> "${{ env.DEFCONFIG }}"

      - name: Change Kernel Name
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          #Add Custom name to Kernel Version
          sed -i '$s|echo "\$res"|echo "\$res-@NoFloresto"|' ./common/scripts/setlocalversion
          #Set Custom Hostname and Username
          perl -pi -e 's/LINUX_COMPILE_BY=.*/LINUX_COMPILE_BY="thefloresto"/' ./common/scripts/mkcompile_h
          perl -pi -e 's/LINUX_COMPILE_HOST=.*/LINUX_COMPILE_HOST="thefloresto-labs"/' ./common/scripts/mkcompile_h
          #Set Kernel Timestamp
          perl -pi -e 's{UTS_VERSION="\$\(echo \$UTS_VERSION \$CONFIG_FLAGS \$TIMESTAMP \| cut -b -\$UTS_LEN\)"}{UTS_VERSION="#1 SMP PREEMPT Mon Apr 20 08:09:31 UTC 2025"}' ./common/scripts/mkcompile_h
          #Remove Dirty Flag
          sed -i 's/-dirty//' ./common/scripts/setlocalversion
          #Remove Abi Exports and Error
          rm -rf ./common/android/abi_gki_protected_exports_*
          if [ -f "./common/BUILD.bazel" ]; then
            perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./common/BUILD.bazel
          fi

      - name: Set file name
        shell: bash
        run: |
          set -euo pipefail
          # Set artifact name base for consistent naming
          # Prepare sublevel for naming
          SUBLEVEL_FOR_NAME="${{ inputs.sub_level }}"
          if [ -n "${ACTUAL_SUBLEVEL:-}" ]; then
            SUBLEVEL_FOR_NAME="$ACTUAL_SUBLEVEL"
          fi
          # Set artifact name base for consistent naming
          ARTIFACT_BASE="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${SUBLEVEL_FOR_NAME}-${{ inputs.os_patch_level }}-${{ matrix.apply_bypass == 'bypass' && 'Bypass' || 'Normal' }}"
          echo "ARTIFACT_BASE=$ARTIFACT_BASE" >> $GITHUB_ENV
          echo "FILE_NAME=$ARTIFACT_BASE" >> $GITHUB_ENV

      - name: Detect Clang Toolchain
        shell: bash
        run: |
          set -euo pipefail
          KP="$GITHUB_WORKSPACE/$CONFIG"
          CLANG_FOUND=false
          
          # Search for prebuilt clang
          for base in "$KP/prebuilts" "$KP/prebuilts-master"; do
            [ -d "$base/clang/host/linux-x86" ] || continue
            latest=$(ls -d "$base"/clang/host/linux-x86/clang-r*/ 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
              CLANG_BIN="$latest/bin"
              CLANG_FOUND=true
              break
            fi
          done
          
          # Fallback to system clang
          if ! $CLANG_FOUND && command -v clang >/dev/null 2>&1; then
            CLANG_BIN="$(dirname "$(command -v clang)")"
            CLANG_FOUND=true
            echo "Using system clang."
          fi
          
          $CLANG_FOUND || { echo "No clang toolchain found"; exit 1; }
          
          echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
          CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
          echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
          echo "Detected Clang: $CLANG_VERSION"

      - name: Build Kernel with Clang
        shell: bash
        run: |
          set -euo pipefail
          echo "Building the kernel with Clang..."
          cd "$CONFIG/common"
          
          # Set up build environment
          export PATH="${CLANG_BIN_PATH}:$PATH"
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          # Use LLVM tools
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTLD=ld.lld
          
          OUT=out
          mkdir -p "$OUT"
          
          # Configure
          make O="$OUT" gki_defconfig
          
          # Apply O3 optimization
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          make O="$OUT" olddefconfig
          
          # Build with O3 optimization flags
          KCFLAGS="-O3 -Wno-error -pipe -fno-stack-protector"
          KCPPFLAGS="-DCONFIG_OPTIMIZE_INLINING"
          make -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" 2>&1 | tee build.log
          
          IMG="$OUT/arch/arm64/boot/Image"
          if [ ! -f "$IMG" ]; then
            echo "Kernel Image missing"
            exit 1
          fi

      - name: Create Bootimgs Folder and Copy Images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootimgs

          IMAGE_PATH="$CONFIG/common/out/arch/arm64/boot/Image"
          
          echo "Creating bootimgs folder and copying images..."
          cp "$IMAGE_PATH" ./bootimgs/Image
          cp "$IMAGE_PATH" ./Image
          
          # Create lz4 compressed image
          lz4 -9 -f "$IMAGE_PATH" ./bootimgs/Image.lz4
          lz4 -9 -f "$IMAGE_PATH" ./Image.lz4

          # Create gzip of the Image file
          gzip -n -k -f -9 ./Image > ./Image.gz
          gzip -n -k -f -9 ./bootimgs/Image > ./bootimgs/Image.gz

      - name: Android 12 boot image build script
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.android_version }}" != "android12" ]; then
            exit 0
          fi
          
          echo "Changing to configuration directory: $CONFIG..."
          cd bootimgs
          
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-"${{ inputs.os_patch_level }}"_r1.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip
          
          # Check if the GKI URL is available
          echo "Checking if GKI kernel URL is reachable: $GKI_URL"
          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          
          if [ "$status" = "200" ]; then
              echo "[+] Downloading from GKI_URL"
              curl -Lo gki-kernel.zip "$GKI_URL"
          else
              echo "[+] $GKI_URL not found, using $FALLBACK_URL"
              curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi
          
          # Unzip the downloaded kernel and remove the zip
          echo "Unzipping the downloaded kernel..."
          unzip gki-kernel.zip && rm gki-kernel.zip
          
          echo "Unpacking boot.img..."
          FULL_PATH=$(pwd)/boot-5.10.img
          echo "Unpacking using: $FULL_PATH"
          
          echo "Running unpack_bootimg.py..."
          $UNPACK_BOOTIMG --boot_img="$FULL_PATH"
          
          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img

      - name: Android 13/14/15 boot image build script
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.android_version }}" != "android13" ]] && [[ "${{ inputs.android_version }}" != "android14" ]] && [[ "${{ inputs.android_version }}" != "android15" ]]; then
            exit 0
          fi
          
          cd bootimgs
          
          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img

      - name: Upload AnyKernel3 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-AK3
          path: |
            ./AnyKernel3/**
          compression-level: 9

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-boot.img
          path: |
            *-boot.img
          compression-level: 9
          
      - name: Upload Boot Image (GZ)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-boot-gz.img
          path: |
            *-boot-gz.img
          compression-level: 9
          
      - name: Upload Boot Image (LZ4)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-boot-lz4.img
          path: |
            *-boot-lz4.img
          compression-level: 9
          
      - name: Upload Raw Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Image
          path: |
            Image
          compression-level: 9
          
      - name: Upload Raw Image (GZ)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Image.gz
          path: |
            Image.gz
          compression-level: 9
          
      - name: Upload Raw Image (LZ4)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Image.lz4
          path: |
            Image.lz4
          compression-level: 9

      - name: Upload Build Diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Rejected-Patches
          path: patch-rejects
          compression-level: 9
          
      - name: Initialize Kernel Summary
        shell: bash
        run: |
          set -euo pipefail
          echo "# Kernel Build Summary" >> $GITHUB_STEP_SUMMARY
          
          # Add build variant header
          echo "## ${{ env.FILE_NAME }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Add Build Information
        shell: bash
        run: |
          set -euo pipefail
          # Add build info
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Version**: ${{ inputs.android_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Version**: ${{ inputs.kernel_version }}.${{ inputs.sub_level }}" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU Variant**: ${{ inputs.kernelsu_variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- **BBG**: Installed" >> $GITHUB_STEP_SUMMARY
          echo "- **Bypass Mode**: ${{ matrix.apply_bypass }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Add KSU Version
        shell: bash
        run: |
          set -euo pipefail
          # Get KSU directory name based on variant
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              KSU_DIR="Wild_KSU"
              KSU_REPO="https://github.com/WildKernels/Wild_KSU"
              ;;
            "KSU")
              KSU_DIR="KernelSU"
              KSU_REPO="https://github.com/tiann/KernelSU"
              ;;
            "NEXT")
              KSU_DIR="KernelSU-Next"
              KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next"
              ;;
            "SukiSU")
              KSU_DIR="SukiSU-Ultra"
              KSU_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra"
              ;;
            "MKSU")
              KSU_DIR="KernelSU"
              KSU_REPO="https://github.com/5ec1cff/KernelSU"
              ;;
          esac
          
          cd "$CONFIG/$KSU_DIR"
          KSU_COMMIT=$(git rev-parse HEAD)
          KSU_URL="$KSU_REPO/commit/$KSU_COMMIT"
          echo "- **${{ inputs.kernelsu_variant }} (v${KSUVER})**: [$KSU_COMMIT]($KSU_URL)" >> $GITHUB_STEP_SUMMARY
          
      - name: Add BBG Version
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/Baseband-guard"
          BBG_COMMIT=$(git rev-parse HEAD)
          BBG_URL="https://github.com/vc-teahouse/Baseband-guard/commit/$BBG_COMMIT"
          echo "- **Baseband-guard**: [$BBG_COMMIT]($BBG_URL)" >> $GITHUB_STEP_SUMMARY
          
      - name: Add SUSFS Version
        shell: bash
        run: |
          set -euo pipefail
          # Get SUSFS4KSU commit
          cd "$GITHUB_WORKSPACE/susfs4ksu"
          SUSFS_COMMIT=$(git rev-parse HEAD)
          SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_COMMIT"
          echo "- **SUSFS4KSU (v1.5.12)**: [$SUSFS_COMMIT]($SUSFS_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
      
      - name: Add Build Artifacts
        shell: bash
        run: |
          set -euo pipefail
          # Add links to the artifacts for this build
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **AnyKernel3**: [${{ env.FILE_NAME }}-AnyKernel3](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          
          echo "### Boot Images" >> $GITHUB_STEP_SUMMARY
          echo "- **Boot Image (RAW)**: [${{ env.FILE_NAME }}-boot.img](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          echo "- **Boot Image (GZ)**: [${{ env.FILE_NAME }}-boot-gz.img](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          echo "- **Boot Image (LZ4)**: [${{ env.FILE_NAME }}-boot-lz4.img](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          
          echo "### Kernel Images" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Image (RAW)**: [${{ env.FILE_NAME }}-Image](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Image (GZ)**: [${{ env.FILE_NAME }}-Image.gz](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Image (LZ4)**: [${{ env.FILE_NAME }}-Image.lz4](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
          
          echo "### Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "- **Rejected Patches**: [${{ env.FILE_NAME }}-Rejected-Patches](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> $GITHUB_STEP_SUMMARY
