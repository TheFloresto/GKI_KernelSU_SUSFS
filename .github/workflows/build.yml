name: Kernel Build Process
permissions:
  contents: write
  actions: write 

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_variant:
        required: true
        type: string
        description: 'KernelSU variant (WKSU, KSU, NEXT, SukiSU, MKSU, KowXU)'
      ksu_commit:
        required: false
        type: string

jobs:
  build-gki:
    name: "${{ inputs.ksu_variant }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ matrix.build_type }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: ["normal", "bypass"]

    steps:
      - name: Check Initial Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Initial Total Disk Space in GB ====="
          df -BG
          
      - name: Download Apache Arrow's util_free_space.sh
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh | bash
          
      - name: Check Disk Space After Cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Total Disk Space After Cleanup in GB ====="
          df -BG
          
      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Set Path Environment Variables
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          KERNEL_ROOT="$ROOT/$CONFIG"
          SUSFS4KSU="$ROOT/susfs4ksu"
          KERNEL_PATCHES="$ROOT/kernel_patches"
          ANYKERNEL3="$ROOT/AnyKernel3"

          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV
          echo "SUSFS4KSU=$SUSFS4KSU" >> $GITHUB_ENV
          echo "KERNEL_PATCHES=$KERNEL_PATCHES" >> $GITHUB_ENV
          echo "ANYKERNEL3=$ANYKERNEL3" >> $GITHUB_ENV

      - name: Install Minimal Dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix llvm
          sudo apt-get clean
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: Setup Build Environment
        shell: bash
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2025
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools &
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg &
          wait
          
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH" >> $GITHUB_ENV
          
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/./git-repo/repo" >> $GITHUB_ENV

      - name: Set boot sign key
        shell: bash
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          set -euo pipefail
          if [ ! -z "$BOOT_SIGN_KEY" ]; then
            echo "$BOOT_SIGN_KEY" > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          fi

      - name: Clone AnyKernel3 and Other Dependencies
        shell: bash
        run: |
          set -euo pipefail
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          
          git clone https://github.com/TheFloresto/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/TheFloresto/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          
          cd susfs4ksu
          TARGET="${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          COMMIT=""
          case "${{ inputs.ksu_variant }}" in
            WKSU)
              case "$TARGET" in
                android12-5.10) COMMIT="8a76ba240d1f7315352b49d97d854a4b166e5b47" ;;
                android13-5.10) COMMIT="e5c9eabfc6dcfc677d11f46ce1d5ff786de60a92" ;;
                android13-5.15) COMMIT="babf6be195576f09aae79650d47abf6a76e8a21b" ;;
                android14-5.15) COMMIT="19f339e804ba9aebd9c6d735b965e2b9396c73ae" ;;
                android14-6.1) COMMIT="a162e2469d0b472545e5e46457eee171c0975fb0" ;;
                android15-6.6) COMMIT="f450ec00bf592d080f59b01ff6f9242456c9a427" ;;
              esac
              if [ -n "$COMMIT" ]; then
                git checkout "$COMMIT"
              fi
              ;;
          esac

      - name: Initialize and Sync Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$KERNEL_ROOT"
          cd "$KERNEL_ROOT"
          
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          
          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
          
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast
          
      - name: Check Directory Space Usage
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Total Disk Space After Kernel Download in GB ====="
          df -BG
          
          echo "===== Directory Space Usage in GB ====="
          du -BG -d 1 | sort -nr
          
          echo "===== $KERNEL_ROOT Directory Space Usage in GB ====="
          cd "$KERNEL_ROOT"
          du -BG -d 2 | sort -nr

      - name: Extract Actual Sublevel
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT/common"
          
          if [ -f "Makefile" ]; then
            ACTUAL_SUBLEVEL=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
            
            if [ -n "$ACTUAL_SUBLEVEL" ]; then
              echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
              echo "Extracted ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL"
            else
              echo "Warning: SUBLEVEL not found in Makefile; continuing with inputs.sub_level."
              echo "ACTUAL_SUBLEVEL=${{ inputs.sub_level }}" >> $GITHUB_ENV
            fi
          fi

      - name: Apply glibc 2.38 Compatibility Fix
        shell: bash
        run: |
          set -euo pipefail
          
          if ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $ACTUAL_SUBLEVEL <= 186 ))) || 
              ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 119 ))) || 
              ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 110 ))) || 
              ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "6.1" ]] && (( $ACTUAL_SUBLEVEL <= 43 ))); then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}') 
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then 
              cd "$KERNEL_ROOT/common"
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
              if ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $ACTUAL_SUBLEVEL <= 186 ))) || 
                  ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 119 ))) || 
                  ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 110 ))); then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi 

      - name: Fix Less Then 6.6.50 Builds
        if: inputs.android_version == 'android15' && inputs.kernel_version == '6.6'
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT/common"
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
              sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi

      - name: Apply ptrace patch for older kernels
        if: fromJSON(inputs.kernel_version) < 5.16
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT/common"
          patch -p1 -F 3 < "$KERNEL_PATCHES/gki_ptrace.patch"

      - name: Add KernelSU
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          case "${{ inputs.ksu_variant }}" in
            WKSU)
              if [ -n "${{ inputs.ksu_commit }}" ]; then
                curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
              else
                curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
              fi
              ;;
            KSU)
              if [ -n "${{ inputs.ksu_commit }}" ]; then
                curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
              else
                curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
              fi
              ;;
            NEXT)
              if [ -n "${{ inputs.ksu_commit }}" ]; then
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
              else
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              fi
              ;;
            SukiSU)
              if [ -n "${{ inputs.ksu_commit }}" ]; then
                curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
              else
                curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
              fi
              ;;
            MKSU)
              if [ -n "${{ inputs.ksu_commit }}" ]; then
                curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
              else
                curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main
              fi
              ;;
            KowXU)
              if [ -n "${{ inputs.ksu_commit }}" ]; then
                curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
              else
                curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s main
              fi
              ;;
          esac

      - name: Getting KernelSU Version
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"

          case "${{ inputs.ksu_variant }}" in
            WKSU)
              cd "$KERNEL_ROOT/Wild_KSU"
              BASE_VERSION=10200
              ;;
            KSU)
              cd "$KERNEL_ROOT/KernelSU"
              BASE_VERSION=20000
              ;;
            NEXT)
              cd "$KERNEL_ROOT/KernelSU-Next"
              BASE_VERSION=10200
              ;;
            SukiSU)
              cd "$KERNEL_ROOT/KernelSU"
              BASE_VERSION=37233
              ;;
            MKSU)
              cd "$KERNEL_ROOT/KernelSU"
              BASE_VERSION=20000
              ;;
            KowXU)
              cd "$KERNEL_ROOT/KernelSU"
              BASE_VERSION=20000
              ;;
          esac
          
          COMMIT_COUNT=$(git rev-list --count HEAD)
          KSU_VERSION=$(expr $BASE_VERSION + $COMMIT_COUNT)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          
          KSU_COMMIT_SHA=$(git rev-parse HEAD)
          echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
          echo "KSU commit: ${KSU_COMMIT_SHA:0:8}"
          
      - name: Apply SUSFS Patches for KernelSU Variants
        shell: bash
        run: |
          set -eo pipefail
          cd "$KERNEL_ROOT"
          
          SUSFS_VERSION="1.5.12"

          cp -v "$SUSFS4KSU/kernel_patches/fs/"* "$KERNEL_ROOT/common/fs/"
          cp -v "$SUSFS4KSU/kernel_patches/include/linux/"* "$KERNEL_ROOT/common/include/linux/"

          # Apply core SUSFS patches
          cd "$KERNEL_ROOT/common"
          cp -v "$SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch" ./
          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true
          cd "$KERNEL_ROOT"
          
          # Get SUSFS version — всегда от корня ядра
          susfs_version=$(grep '#define SUSFS_VERSION' "$KERNEL_ROOT/common/include/linux/susfs.h" | awk -F'"' '{print $2}')
          echo "SUSVER=$susfs_version" >> $GITHUB_ENV
          echo "SusFS Version: $susfs_version"
          
          cd "$KERNEL_ROOT"

          case "${{ inputs.ksu_variant }}" in
            WKSU)
              cd "$KERNEL_ROOT/Wild_KSU"
              cp -v "$SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" .
              patch -p1 < 10_enable_susfs_for_ksu.patch || true
              
              cp -v "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_core_hook.c.patch" ./
              patch -p1 < fix_core_hook.c.patch
              
              cp -v "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_sucompat.c.patch" ./
              patch -p1 < fix_sucompat.c.patch
              
              cp -v "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_kernel_compat.c.patch" ./
              patch -p1 < fix_kernel_compat.c.patch
              ;;
            KSU)
              cd "$KERNEL_ROOT/KernelSU"
              cp -v "$SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ./
              patch -p1 < 10_enable_susfs_for_ksu.patch || true
              ;;
            NEXT)
              cd "$KERNEL_ROOT/KernelSU-Next"
              cp -v "$KERNEL_PATCHES/next/0001-KSU-kernel-side.patch" ./
              patch -p1 < 0001-KSU-kernel-side.patch || true
              
              cp -v "$KERNEL_PATCHES/next/0001-add-SuSFS-v2.0.0.patch" ./
              patch -p1 < 0001-add-SuSFS-v2.0.0.patch || true
              
              cp -v "$KERNEL_PATCHES/next/0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch" ./
              patch -p1 < 0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch || true
              ;;
            SukiSU)
              cd "$KERNEL_ROOT/KernelSU"
              # SukiSU already has SUSFS built-in – ничего не патчим
              ;;
            MKSU)
              cd "$KERNEL_ROOT/KernelSU"
              cp -v $SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              patch -p1 < 10_enable_susfs_for_ksu.patch || true       

              # Apply fix_proc_base from kernel root since it patches fs/proc/base.c
              cd "$KERNEL_ROOT/common"
              cp -v $KERNEL_PATCHES/mksu/fix_proc_base.patch ./
              patch -p1 < fix_proc_base.patch || true
              ;;
            KowXU)
              cd "$KERNEL_ROOT/KernelSU"
              cp -v $KERNEL_PATCHES/mksu/10_enable_susfs_for_ksu.patch ./
              patch -p1 < 10_enable_susfs_for_ksu.patch || true

              cp -v $KERNEL_PATCHES/mksu/fix_proc_base.patch ./
              patch -p1 -F 3 --forward < fix_proc_base.patch || true
              ;;
          esac
          
          cd "$KERNEL_ROOT/common"
          # Post-SUSFS sed safeguards и дополнительные фиксы только для WKSU
          case "${{ inputs.ksu_variant }}" in
            WKSU)
              if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 209 ]] ||
                 [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 209 ]] ||
                 [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 148 ]] ||
                 [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "5.15" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 148 ]] ||
                 [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 75 ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi

              # Apply additional SUSFS patches for Android 13 5.15 compatibility
              if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" ]] && [[ ${{ inputs.sub_level }} -le 41 ]]; then
                cp ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_fdinfo.c.patch ./
                patch -p1 < fix_fdinfo.c.patch || true
                cp ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_namespace.c.patch ./
                patch -p1 < fix_namespace.c.patch || true
                cp ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_open.c.patch ./
                patch -p1 < fix_open.c.patch || true
                sed -i 's/i_uid_into_mnt(i_user_ns(inode), inode)/i_uid_into_mnt(inode->i_sb->s_user_ns, inode)/g' fs/susfs.c
              fi

              # Use ACTUAL_SUBLEVEL for LTS or actual kernel sublevel if available
              if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 43 ]] ||
                 [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $ACTUAL_SUBLEVEL -ge 145 ]] ||
                 [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" && $ACTUAL_SUBLEVEL -ge 98 ]]; then
                cp ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/1_fix_base.c.patch ./
                patch -p1 < 1_fix_base.c.patch || true
              fi

              if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 43 ]]; then
                cp ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/2_fix_base.c.patch ./
                patch -p1 < 2_fix_base.c.patch || true
              fi

              if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" && $ACTUAL_SUBLEVEL -le 58 ]]; then
                cp ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_task_mmu.c.patch ./
                patch -p1 < fix_task_mmu.c.patch || true
              fi
              ;;
            KSU)
              ;;
            NEXT)
              ;;
            SukiSU)
              ;;
            MKSU)
              ;;
            KowXU)
              ;;
          esac

      - name: Apply Hooks Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT/common"
          
          case "${{ inputs.ksu_variant }}" in
            WKSU)
              echo "Applying hooks for WKSU..."
              cp -v "$KERNEL_PATCHES/next/60_scope-minimized_manual_hooks.patch" ./
              patch -p1 --forward -F 3 < 60_scope-minimized_manual_hooks.patch
              ;;
            KSU)
              echo "Applying hooks for Official KernelSU..."
              ;;
            NEXT)
              echo "Applying hooks for KernelSU-Next..."
              cp -v "$KERNEL_PATCHES/next/scope_min_manual_hooks_v1.4.patch" ./
              patch -p1 --forward -F 3 < scope_min_manual_hooks_v1.4.patch
              ;;
            SukSU)
              echo "Applying hooks for SukiSU..."
              ;;
            MKSU)
              echo "Applying hooks for MKSU..."
              ;;
            KowXU)
              echo "Applying hooks for KowXU..."
              ;;
          esac

      - name: Apply Performance Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT/common"
          MIN_VERSION="5.16"
          cp "$KERNEL_PATCHES/common/optimized_mem_operations.patch" ./
          patch -p1 --forward < optimized_mem_operations.patch || true
          cp "$KERNEL_PATCHES/common/file_struct_8bytes_align.patch" ./
          patch -p1 --forward < file_struct_8bytes_align.patch || true
          cp "$KERNEL_PATCHES/common/reduce_cache_pressure.patch" ./
          patch -p1 --forward < reduce_cache_pressure.patch || true
          if [ "$(printf '%s\n' "${{ inputs.kernel_version }}" "$MIN_VERSION" | sort -V | head -n1)" = "${{ inputs.kernel_version }}" ]; then
            cp "$KERNEL_PATCHES/common/clear_page_16bytes_align.patch" ./
            patch -p1 --forward < clear_page_16bytes_align.patch || true
          else
            cp "$KERNEL_PATCHES/common/clear_page_16bytes_align.patch" ./
            sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' clear_page_16bytes_align.patch > clear_page_16bytes_align__pi.patch
            patch -p1 -F3 --forward < clear_page_16bytes_align__pi.patch || true
          fi

      - name: Add BBG
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' common/security/Kconfig

      - name: Apply Module Check Bypass
        if: ${{ matrix.build_type == 'bypass' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" ]]; then
            cd "$KERNEL_ROOT/common/kernel/module"
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' version.c
          else
            cd "$KERNEL_ROOT/common/kernel"
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' module.c
          fi

      - name: Fix WiFi and Bluetooth on Samsung 6.6 GKI devices
        if: ${{ inputs.kernel_version == '6.6' }}
        shell: bash
        run: |
          set -euo pipefail
          SYMBOL_LIST=$KERNEL_ROOT/common/android/abi_gki_aarch64_galaxy
          echo "kdp_set_cred_non_rcu" >> $SYMBOL_LIST
          echo "kdp_usecount_dec_and_test" >> $SYMBOL_LIST
          echo "kdp_usecount_inc" >> $SYMBOL_LIST
          
          cd "$KERNEL_ROOT/common"
          PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          if patch -p1 --dry-run < "$PATCH"; then
            patch -p1 --no-backup-if-mismatch < $PATCH
          fi
          
          cd drivers
          cp "../../../kernel_patches/samsung/min_kdp/min_kdp.c" min_kdp.c
          echo "obj-y += min_kdp.o" >> Makefile

      - name: Apply FIX 22 clang Patches
        run: |
          cd "$KERNEL_ROOT/common"
          
          # Получаем версию ядра
          KERNEL_VERSION=$(make kernelversion | cut -d. -f1,2)
          ANDROID_VERSION="${{ inputs.android_version }}"
          FUSS_VERSION="${{ inputs.fuss_version }}"
          
          # Проверяем условие: НЕ применяем патч для Android 15 с ядром 6.6
          if [ "$KERNEL_VERSION" == "6.6" ]; then
            echo "Skipping fix 22 clang patch for Android 15 with kernel 6.6"
          else
            echo "Applying fix 22 clang..."
            cp -v ../../kernel_patches/fix-clidr-uninitialized.patch ./
            patch -p1 --forward --fuzz=3 < fix-clidr-uninitialized.patch
          fi

      - name: Set Kernel Configuration Variables
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          cd "$KERNEL_ROOT"
          echo "Initializing kernel configuration..."
          echo "DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig" >> $GITHUB_ENV
          
          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki
          sed -i '/^CONFIG_KSU_SUSFS/d' "common/arch/arm64/configs/gki_defconfig" 2>/dev/null || true          
          
          # ========================================
          # CLEAN UP LOCALVERSION - ВАЖНО!
          # ========================================
          echo "🧹 Cleaning up existing LOCALVERSION entries..."
          
          # Remove ALL existing LOCALVERSION entries
          sed -i '/^CONFIG_LOCALVERSION=/d' "common/arch/arm64/configs/gki_defconfig" 2>/dev/null || true
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "common/arch/arm64/configs/gki_defconfig" 2>/dev/null || true
          
          # Verify cleanup
          REMAINING_ENTRIES=$(grep -c '^CONFIG_LOCALVERSION' "common/arch/arm64/configs/gki_defconfig" 2>/dev/null || echo "0")
          
          if [ "$REMAINING_ENTRIES" -eq 0 ]; then
            echo "✅ All LOCALVERSION entries removed successfully"
          else
            echo "⚠️ Warning: $REMAINING_ENTRIES LOCALVERSION entries still present"
            grep '^CONFIG_LOCALVERSION' "common/arch/arm64/configs/gki_defconfig" || true
          fi

      - name: Configure KernelSU Core
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          echo "# KernelSU Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LOCALVERSION=\"-@NoFloresto\"" >> "${{ env.DEFCONFIG }}"
          
          echo "CONFIG_KSU=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> "${{ env.DEFCONFIG }}"
          # BBG Support
          echo "CONFIG_KSU_DEBUG=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_ALLOWLIST_WORKAROUND=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure SukiSU
        if: ${{ inputs.ksu_variant == 'SukiSU' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          
          # SukiSU Support
          echo "# SukiSU Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KPM=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KALLSYMS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_MANUAL_SU=n" >> "${{ env.DEFCONFIG }}"

      - name: Configure SUSFS
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          # SUSFS Configuration
          echo "# SUSFS Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS=y" >> "${{ env.DEFCONFIG }}"
          echo "#CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "${{ env.DEFCONFIG }}"

          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "${{ env.DEFCONFIG }}"

          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "${{ env.DEFCONFIG }}"

          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure Mountify Support
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          # Mountify Support
          echo "# Mountify Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TMPFS_XATTR=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure Networking
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          # Networking Configuration
          echo "# Networking Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure TCP Congestion Control
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          # BBR TCP Congestion Control
          echo "# BBR TCP Congestion Control" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_BBR=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_NET_SCH_FQ=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_BIC=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "${{ env.DEFCONFIG }}"

      - name: Configure IPSet Support
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          # IPSet support
          echo "# IPSet Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_MAX=65534" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IP=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_MAC=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_IP_SET_LIST_SET=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure Build Options
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"
          echo "# Build Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CCACHE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_OPTIMIZE_INLINING=y" >> "${{ env.DEFCONFIG }}"

      - name: Verify Kernel Version Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          echo "::group::Verify Kernel Version Configuration"
          echo "🔍 Verifying kernel version configuration..."
          
          # Check current LOCALVERSION settings
          DEFCONFIG_PATH="common/arch/arm64/configs/gki_defconfig"
          VERSION_COUNT=$(grep -c '^CONFIG_LOCALVERSION' "$DEFCONFIG_PATH" 2>/dev/null || echo "0")
          AUTO_VERSION=$(grep '^CONFIG_LOCALVERSION_AUTO' "$DEFCONFIG_PATH" 2>/dev/null || echo "not set")
          LOCAL_VERSION=$(grep '^CONFIG_LOCALVERSION=' "$DEFCONFIG_PATH" 2>/dev/null || echo "not set")
          
          echo "📊 Current configuration:"
          echo "  LOCALVERSION entries found: $VERSION_COUNT"
          echo "  LOCALVERSION_AUTO: $AUTO_VERSION"
          echo "  LOCALVERSION: $LOCAL_VERSION"
          
          # Verify we have exactly the configuration we want
          if [ "$VERSION_COUNT" -ne 2 ]; then
            echo "⚠️ Warning: Expected 2 LOCALVERSION entries, found $VERSION_COUNT"
            echo "Current entries:"
            grep '^CONFIG_LOCALVERSION' "$DEFCONFIG_PATH" || echo "  (none)"
          fi
          
          # Check that LOCALVERSION_AUTO is disabled
          if ! grep -q '^CONFIG_LOCALVERSION_AUTO=n' "$DEFCONFIG_PATH" 2>/dev/null; then
            echo "❌ Error: LOCALVERSION_AUTO is not properly disabled"
            exit 1
          fi
          
          # Check that our custom LOCALVERSION is set
          if ! grep -q '^CONFIG_LOCALVERSION="-@NoFloresto"' "$DEFCONFIG_PATH" 2>/dev/null; then
            echo "❌ Error: Custom LOCALVERSION not found or incorrect"
            exit 1
          fi
          
          echo "✅ Kernel version configuration verified successfully"
          echo "::endgroup::"

      - name: Set Build Identity
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Set build user/host"

          # Set static build date for reproducible builds
          STATIC_DATE="Sun Jun 15 14:56:02 UTC 2025"
          echo "STATIC_DATE=$STATIC_DATE" >> "$GITHUB_ENV"

          BUILD_USER="TheFloresto"
          BUILD_HOST="ubuntu-build"
          
          echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
          echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"
          
          echo ""
          echo "✅ Build identity configured:"
          echo "   User: $BUILD_USER"
          echo "   Host: $BUILD_HOST"
          echo "::endgroup::"

      - name: Setup ZyCromerZ Clang Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching latest ZyCromerZ Clang release..."
          LATEST_CLANG_TAG=$(gh api repos/ZyCromerZ/Clang/releases/latest --jq '.tag_name')
          if [ -z "$LATEST_CLANG_TAG" ]; then
            echo "Error: Could not fetch latest ZyCromerZ Clang tag"
            exit 1
          fi
          echo "Latest ZyCromerZ Clang tag: $LATEST_CLANG_TAG"
          
          # Extract version info
          CLANG_VERSION=$(echo "$LATEST_CLANG_TAG" | sed 's/-release$//')
          
          echo "Downloading ZyCromerZ Clang $LATEST_CLANG_TAG..."
          mkdir -p clang-zyc
          cd clang-zyc
          
          DOWNLOAD_URL="https://github.com/ZyCromerZ/Clang/releases/download/$LATEST_CLANG_TAG/Clang-$CLANG_VERSION.tar.gz"
          echo "Download URL: $DOWNLOAD_URL"
          
          curl -LO "$DOWNLOAD_URL"
          tar -xzf "Clang-$CLANG_VERSION.tar.gz"
          cd ..
          
          # Set environment variables
          CLANG_BIN="$GITHUB_WORKSPACE/clang-zyc/bin"
          echo "LATEST_CLANG_TAG=$LATEST_CLANG_TAG" >> $GITHUB_ENV
          echo "CLANG_SOURCE=zyc" >> $GITHUB_ENV
          echo "CLANG_BIN_PATH=$CLANG_BIN" >> $GITHUB_ENV
          echo "CLANG_VERSION=ZyCromerZ-$CLANG_VERSION" >> $GITHUB_ENV
          
          # Verify installation
          echo "Verifying ZyCromerZ Clang installation..."
          "$CLANG_BIN/clang" --version
          echo "✅ ZyCromerZ Clang installed successfully at: $CLANG_BIN"

      - name: Derive ZyCromerZ Clang Version
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Extract ZyCromerZ version info"
          
          # Extract version from ZyCromerZ clang
          FULL_VERSION=$("${CLANG_BIN_PATH}/clang" --version | head -n1)
          echo "Full version: $FULL_VERSION"
          
          # Try to extract clang version number
          SHORT_VERSION=$(echo "$FULL_VERSION" | grep -oP 'clang version \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          
          if [ -z "$SHORT_VERSION" ]; then
            # Fallback: use tag name
            SHORT_VERSION="${LATEST_CLANG_TAG}"
          fi
          
          echo "CLANG_VERSION_SHORT=$SHORT_VERSION" >> "$GITHUB_ENV"
          echo "✅ ZyCromerZ Clang version: $SHORT_VERSION"
          echo "::endgroup::"

      - name: Set Cache Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Configure ccache environment"
          
          CACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          
          mkdir -p "$CACHE_DIR"
          
          echo "Cache configuration:"
          echo "  Directory: $CACHE_DIR"
          echo "  Max size: 2G"
          echo "  Android: ${{ inputs.android_version }}"
          echo "  Kernel: ${{ inputs.kernel_version }}"
          echo "  Clang: ${CLANG_VERSION_SHORT:-unknown}"
          echo "  KSU: ${{ inputs.ksu_variant }}"
          echo "::endgroup::"
    
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gki-v1-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ env.CLANG_VERSION_SHORT }}-${{ inputs.ksu_variant }}
          restore-keys: |
            ccache-gki-v1-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ env.CLANG_VERSION_SHORT }}-
            ccache-gki-v1-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
   
      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Configure ccache for maximum performance"
          
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="2G"
          
          ccache -M "$CCACHE_MAXSIZE"
          
          export CCACHE_COMPILERCHECK="content"
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          export CCACHE_NOHASHDIR="true"
          
          ccache -o compression=true
          ccache -o compression_level=3
          ccache -o direct_mode=true
          ccache -o hash_dir=false
          ccache -o file_clone=true
          ccache -o inode_cache=true
          ccache -o umask=002
          
          if ccache --help 2>&1 | grep -q 'depend_mode'; then
            ccache -o depend_mode=true
          fi
          
          ccache -o sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          
          export CCACHE_IGNOREOPTIONS="--sysroot*"
          
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_IGNOREOPTIONS=$CCACHE_IGNOREOPTIONS" >> "$GITHUB_ENV"
          
          echo "✅ ccache configured for production"
          echo ""
          echo "Configuration applied:"
          echo "  Max size: 2G"
          echo "  Base dir: ${GITHUB_WORKSPACE}"
          echo "  Compression: zstd level 3"
          echo "  Direct mode: enabled"
          echo "  File cloning: enabled"
          echo "  Inode cache: enabled"
          echo ""
          
          if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "✅ Restored cache found"
            echo ""
            echo "Pre-build cache statistics:"
            ccache -s | head -n 20
          else
            echo "⚠️ No existing cache - building from scratch"
            echo "Cache will be populated for future builds"
          fi
          
          echo "::endgroup::"

      - name: Customize Kernel Branding
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Customize Kernel Branding"
          cd "$KERNEL_ROOT/common"
          mkdir -p out
          
          CUSTOM_LOCALVERSION="-@NoFloresto"
          echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"
          
          echo "✅ Custom localversion set: $CUSTOM_LOCALVERSION"
          echo "::endgroup::"

      - name: Set file name
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_BASE="${{ inputs.ksu_variant }}-${{ inputs.kernel_version }}.$ACTUAL_SUBLEVEL-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ matrix.build_type == 'bypass' && 'Bypass' || 'Normal' }}"
          echo "ARTIFACT_BASE=$ARTIFACT_BASE" >> $GITHUB_ENV
          echo "FILE_NAME=$ARTIFACT_BASE" >> $GITHUB_ENV

      - name: Build Kernel with Clang
        shell: bash
        env:
          PYTHONWARNINGS: "ignore:invalid escape sequence"
        run: |
          set -euo pipefail
          echo "::group::Build kernel with ccache optimization"
          
          KERNEL_PATH="$GITHUB_WORKSPACE/$CONFIG"
          COMMON="$KERNEL_PATH/common"
          cd "$COMMON"
          
          : > "$COMMON/.scmversion"
          
          export PYTHONWARNINGS="${PYTHONWARNINGS}"
          
          echo "Getting last commit timestamp from kernel source..."
          COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u '+%Y-%m-%d %H:%M:%S')
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          
          KERNEL_BUILD_DATE=$(date -u)
          export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
          export KBUILD_BUILD_TIMESTAMP="$STATIC_DATE"
          export KBUILD_BUILD_USER="${BUILD_USER}"
          export KBUILD_BUILD_HOST="${BUILD_HOST}"
          export KBUILD_BUILD_VERSION=1
          
          echo "📅 Build timestamp: $KBUILD_BUILD_TIMESTAMP (from commit $COMMIT_HASH)"
          echo "🔢 SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
          echo "👤 Build user: $KBUILD_BUILD_USER"
          echo "🖥️  Build host: $KBUILD_BUILD_HOST"
          
          export PATH="/usr/lib/ccache:${CLANG_BIN_PATH}:${KERNEL_PATH}/prebuilts/kernel-build-tools/linux-x86/bin/:${KERNEL_PATH}/prebuilts/rust/linux-x86/1.73.0b/bin/:${PATH}"
          
          WORKSPACE="${GITHUB_WORKSPACE}"
          MAP="-fdebug-prefix-map=${WORKSPACE}=."
          MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
          FPMAP="-ffile-prefix-map=${WORKSPACE}=."
          
          export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument"
          export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"
          
          export CC="ccache clang"
          export CXX="ccache clang++"
          export HOSTCC="ccache clang"
          export HOSTCXX="ccache clang++"
          
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export RUSTC="$KERNEL_PATH/prebuilts/rust/linux-x86/1.73.0b/bin/rustc"
          export PAHOLE="$KERNEL_PATH/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
          
          # LLVM утилиты с полными путями
          export LD="${CLANG_BIN_PATH}/ld.lld"
          export HOSTLD="${CLANG_BIN_PATH}/ld.lld"
          export AR="${CLANG_BIN_PATH}/llvm-ar"
          export NM="${CLANG_BIN_PATH}/llvm-nm"
          export OBJCOPY="${CLANG_BIN_PATH}/llvm-objcopy"
          export OBJDUMP="${CLANG_BIN_PATH}/llvm-objdump"
          export STRIP="${CLANG_BIN_PATH}/llvm-strip"
          
          OUT=out
          mkdir -p "$OUT"
          
          echo "============================================"
          echo "🔍 Compiler & ccache Verification"
          echo "============================================"
          echo "PATH: ${PATH:0:200}..."
          echo "which clang: $(which clang)"
          echo "CC: $CC"
          echo "LLVM: $LLVM"
          echo "CLANG_VERSION: $CLANG_VERSION"
          echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
          echo ""
          
          echo "ccache wrapper test:"
          clang --version 2>&1 | head -n1 || true
          echo ""
          echo "ccache configuration:"
          ccache -p | grep -E "(compression|direct_mode|readonly_direct|depend|sloppiness)" || true
          echo ""
          echo "ccache pre-build status:"
          ccache -s | head -n 20
          echo "============================================"
          
          make O="$OUT" gki_defconfig
          
          # Apply custom localversion
          if [ -n "${CUSTOM_LOCALVERSION:-}" ]; then
            scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}"
            scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
            sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
          fi
          
          # Always use O3 optimization
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O3"
          
          scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN
          scripts/config --file "$OUT/.config" -e LTO_CLANG
          
          make O="$OUT" olddefconfig
          
          KCFLAGS="$KCFLAGS -Wno-error -pipe -fno-stack-protector ${KCFLAGS_EXTRA}"
          KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"
          
          echo "============================================"
          echo "🔧 Build Configuration"
          echo "============================================"
          echo "Android: ${{ inputs.android_version }}"
          echo "Kernel: ${{ inputs.kernel_version }}.$ACTUAL_SUBLEVEL"
          echo "KSU Variant: ${{ inputs.ksu_variant }}"
          echo "Threads: $(nproc --all)"
          echo "Optimization: O3 (Always) + LTO=thin"
          echo "KCFLAGS: ${KCFLAGS:0:150}..."
          echo "KCPPFLAGS: ${KCPPFLAGS:0:150}..."
          echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"
          echo "Workspace: $WORKSPACE"
          echo "ccache: ENABLED (Always)"
          echo "  Dir: $CCACHE_DIR"
          echo "  Base: $CCACHE_BASEDIR"
          echo "  Max size: $CCACHE_MAXSIZE"
          echo "============================================"
          
          if [ ! -d "$CCACHE_DIR" ] || [ -z "$(find "$CCACHE_DIR" -type f 2>/dev/null | head -n1)" ]; then
            echo "🔥 Priming cache with header preprocessing..."
            make -C "$COMMON" O="$OUT" headers_install prepare 2>&1 | head -n 20 || true
            echo ""
          fi
          
          BUILD_START=$(date +%s)
          set -o pipefail
          
          make -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" 2>&1 | tee build.log
          
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          
          echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"
          echo "BUILD_END=$BUILD_END" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          
          IMG="$OUT/arch/arm64/boot/Image"
          if [ ! -f "$IMG" ]; then
            echo "::error::Kernel Image missing"
            echo "::group::Last 444 lines of build log"
            tail -n 444 build.log || echo "Build log not available"
            echo "::endgroup::"
            exit 1
          fi
          
          IMG_SIZE=$(stat -c%s "$IMG")
          
          echo "============================================"
          echo "✅ Build Completed Successfully"
          echo "============================================"
          echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
          echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
          echo ""
          echo "📊 ccache Post-Build Statistics"
          echo "============================================"
          ccache -s
          echo "============================================"
          echo "::endgroup::"

      - name: ccache Post-Build Statistics
        id: ccache_stats
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::ccache final statistics"
          
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          
          echo "ccache Statistics"
          ccache -s
          
          STATS="$(ccache -s)"
          
          CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ {
            match($0, /[0-9]+/); 
            print substr($0, RSTART, RLENGTH)
          }' | head -n1)
          
          HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ {
            match($0, /[0-9]+/); 
            print substr($0, RSTART, RLENGTH)
          }' | head -n1)
          
          DIRECT=$(echo "$STATS" | awk '/Direct:/ {
            match($0, /[0-9]+/); 
            print substr($0, RSTART, RLENGTH)
          }' | head -n1)
          
          if [ "${CACHEABLE:-0}" -gt 0 ]; then
            HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
            DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
          else
            HIT_RATE="0.0"
            DIRECT_RATE="0.0"
          fi
          
          echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
          echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"
          
          echo "::endgroup::"

      - name: Collect Build Stats / Validate Image
        id: collect_stats
        shell: bash
        run: |
          set -euo pipefail
          OUT="$KERNEL_ROOT/common/out"
          IMG="$OUT/arch/arm64/boot/Image"
          
          if [ -f "$KERNEL_ROOT/common/build.log" ]; then
            WARNINGS_COUNT="$(grep -ciE '\bwarning:' "$KERNEL_ROOT/common/build.log" || true)"
            [ -n "$WARNINGS_COUNT" ] || WARNINGS_COUNT="0"
          else
            WARNINGS_COUNT="0"
          fi
          
          if [ ! -f "$IMG" ]; then
            echo "::error::Kernel Image not found at: $IMG"
            exit 1
          fi
          
          if ! file "$IMG" | grep -qi 'ARM64'; then
            echo "::error::Image is not ARM64 format"
            file "$IMG"
            exit 1
          fi
          
          IMG_SIZE=$(stat -c %s "$IMG")
          MIN_SIZE=6102400
          if [ "$IMG_SIZE" -lt "$MIN_SIZE" ]; then
            echo "::error::Image size too small: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
            exit 1
          fi
          
          IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
          BUILD_TIME="${BUILD_TIME:-0}"
          
          KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1)
          echo "Kernel Uname: $KERNEL_UNAME"
          echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
          
          printf 'warnings_count=%s\n' "$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"
          printf 'image_sha256=%s\n' "$IMG_SHA256" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$BUILD_TIME" >> "$GITHUB_OUTPUT"
          
          echo "✅ Validation passed:"
          echo "   - Warnings: $WARNINGS_COUNT"
          echo "   - Image size: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
          echo "   - SHA256: $IMG_SHA256"
          echo "   - Build time: ${BUILD_TIME}s"

      - name: Patch KPM for SukiSU-Ultra
        if: ${{ inputs.ksu_variant == 'SukiSU' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Patching Image file..."
          cd "$KERNEL_ROOT/common/out/arch/arm64/boot"
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
          chmod +x patch
          ./patch
          rm -f Image
          mv oImage Image

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          
          # For make builds (primary)
          if [ -f "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" ]; then
            cp "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" "$ANYKERNEL3/Image"
          else
            echo "Error: Image file not found"
            exit 1
          fi

      - name: Create Bootimgs Folder and Copy Images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootimgs
          
          # For make builds
          cp "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" ./bootimgs/
          
          # Create lz4
          lz4 -f -l -9 ./bootimgs/Image ./bootimgs/Image.lz4
          
          cp ./bootimgs/Image ./${{ env.FILE_NAME }}-Image
          cp ./bootimgs/Image.lz4 ./${{ env.FILE_NAME }}-Image.lz4
          
          # Create gzip
          gzip -n -k -f -9 ./${{ env.FILE_NAME }}-Image
          gzip -n -k -f -9 ./bootimgs/Image

      - name: Android 12 boot image build script
        if: ${{ inputs.android_version == 'android12' }}
        shell: bash
        run: |
          set -euo pipefail
          cd bootimgs
          
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-"${{ inputs.os_patch_level }}"_r1.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip
          
          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          
          if [ "$status" = "200" ]; then
              curl -Lo gki-kernel.zip "$GKI_URL"
          else
              curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi
          
          unzip gki-kernel.zip && rm gki-kernel.zip
          
          FULL_PATH=$(pwd)/boot-5.10.img
          $UNPACK_BOOTIMG --boot_img="$FULL_PATH"
          
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img

      - name: Android 13/14/15 boot image build script
        if: ${{ inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' }}
        shell: bash
        run: |
          set -euo pipefail
          cd bootimgs
          
          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img

      - name: Upload build log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-build-log
          path: |
            ${{ env.KERNEL_ROOT }}/common/build.log
            ${{ env.KERNEL_ROOT }}/common/out/.config
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Upload AnyKernel3 Artifacts
        id: upload_ak3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-AK3
          path: |
            ./AnyKernel3/**
          compression-level: 9

      - name: Scan and collect patch rejects
        if: ${{ always() }}
        shell: bash
        run: |
          set -e
          CONFIG_DIR="$KERNEL_ROOT"
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          
          mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$CONFIG_DIR"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              
              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
                mkdir -p "$(dirname "$ORIG_DEST")"
                cp "$ORIG" "$ORIG_DEST"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Extra Artifacts
        if: ${{ always() }}
        id: upload_misc
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Misc
          path: |
            ${{ env.FILE_NAME }}-Image
            ${{ env.FILE_NAME }}-Image.gz
            ${{ env.FILE_NAME }}-Image.lz4
            ${{ env.FILE_NAME }}-boot.img
            ${{ env.FILE_NAME }}-boot-gz.img
            ${{ env.FILE_NAME }}-boot-lz4.img
            patch-rejects/**
            build_summary.md
          if-no-files-found: ignore
          compression-level: 9
          
      - name: Generate Build Summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          
          KSU_SHA="${KSU_COMMIT_SHA:-unknown}"
          
          echo "# Kernel Build Summary" > build_summary.md
          echo "## ${{ env.FILE_NAME }}" >> build_summary.md
          echo "" >> build_summary.md
          echo "## Build Information" >> build_summary.md
          echo "- **Android Version**: ${{ inputs.android_version }}" >> build_summary.md
          echo "- **Kernel Version**: ${{ inputs.kernel_version }}.$ACTUAL_SUBLEVEL" >> build_summary.md
          echo "- **KSU Variant**: ${{ inputs.ksu_variant }}" >> build_summary.md
          echo "- **KSU Version**: ${KSUVER:-unknown}" >> build_summary.md
          echo "- **SUSFS Version**: ${SUSVER:-unknown}" >> build_summary.md
          echo "- **Build Type**: ${{ matrix.build_type }}" >> build_summary.md
          echo "- **BBG**: Installed" >> build_summary.md
          echo "" >> build_summary.md

          # KSU commit info
          case "${{ inputs.ksu_variant }}" in
            WKSU)
              if [ "$KSU_SHA" != "unknown" ]; then
                echo "- **Wild KSU Commit**: [\`${KSU_SHA:0:8}\`](https://github.com/WildKernels/Wild_KSU/commit/$KSU_SHA)" >> build_summary.md
              fi
              ;;
            KSU)
              if [ "$KSU_SHA" != "unknown" ]; then
                echo "- **KernelSU Commit**: [\`${KSU_SHA:0:8}\`](https://github.com/tiann/KernelSU/commit/$KSU_SHA)" >> build_summary.md
              fi
              ;;
            NEXT)
              if [ "$KSU_SHA" != "unknown" ]; then
                echo "- **KernelSU-Next Commit**: [\`${KSU_SHA:0:8}\`](https://github.com/KernelSU-Next/KernelSU-Next/commit/$KSU_SHA)" >> build_summary.md
              fi
              ;;
            SukiSU)
              if [ "$KSU_SHA" != "unknown" ]; then
                echo "- **SukiSU Commit**: [\`${KSU_SHA:0:8}\`](https://github.com/SukiSU-Ultra/SukiSU-Ultra/commit/$KSU_SHA)" >> build_summary.md
              fi
              ;;
            MKSU)
              if [ "$KSU_SHA" != "unknown" ]; then
                echo "- **MKSU Commit**: [\`${KSU_SHA:0:8}\`](https://github.com/5ec1cff/KernelSU/commit/$KSU_SHA)" >> build_summary.md
              fi
              ;;
            KowXU)
              if [ "$KSU_SHA" != "unknown" ]; then
                echo "- **KowXU Commit**: [\`${KSU_SHA:0:8}\`](https://github.com/KOWX712/KernelSU/commit/$KSU_SHA)" >> build_summary.md
              fi
              ;;
          esac
          
          # Get BBG commit
          if [ -d "$KERNEL_ROOT/Baseband-guard" ]; then
            cd "$KERNEL_ROOT/Baseband-guard"
            BBG_COMMIT=$(git rev-parse HEAD)
            BBG_URL="https://github.com/vc-teahouse/Baseband-guard/commit/$BBG_COMMIT"
            echo "- **Baseband-guard**: [\`${BBG_COMMIT:0:8}\`]($BBG_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
            cd "$GITHUB_WORKSPACE"
          fi
          
          # Get SUSFS4KSU commit
          if [ -d "$SUSFS4KSU" ]; then
            cd "$SUSFS4KSU"
            SUSFS_COMMIT=$(git rev-parse HEAD)
            SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_COMMIT"
            echo "- **SUSFS4KSU**: [\`${SUSFS_COMMIT:0:8}\`]($SUSFS_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
            cd "$GITHUB_WORKSPACE"
          fi
          echo "" >> build_summary.md
          
          echo "## Build Artifacts" >> build_summary.md

          if [ -d "AnyKernel3" ] && [ -f "AnyKernel3/Image" ]; then
            AK3_STATUS="✅"
          else
            AK3_STATUS="❌"
          fi
          echo "- **AnyKernel3**: $AK3_STATUS ${{ env.FILE_NAME }}-AnyKernel3" >> build_summary.md

          echo "### Misc (uploaded files)" >> build_summary.md
          FILES_PRESENT=0
          for f in "${{ env.FILE_NAME }}-Image" "${{ env.FILE_NAME }}-Image.gz" "${{ env.FILE_NAME }}-Image.lz4" "${{ env.FILE_NAME }}-boot.img" "${{ env.FILE_NAME }}-boot-gz.img" "${{ env.FILE_NAME }}-boot-lz4.img"; do
            if [ -f "$f" ]; then FILES_PRESENT=$((FILES_PRESENT+1)); fi
          done
          if [ "$FILES_PRESENT" -gt 0 ]; then
            MISC_STATUS="✅"
          else
            MISC_STATUS="❌"
          fi
          echo "- **Set**: $MISC_STATUS ${{ env.FILE_NAME }}-Misc" >> build_summary.md
          if [ "$MISC_STATUS" = "✅" ]; then
            echo "  Included:" >> build_summary.md
            for f in "${{ env.FILE_NAME }}-Image" "${{ env.FILE_NAME }}-Image.gz" "${{ env.FILE_NAME }}-Image.lz4" "${{ env.FILE_NAME }}-boot.img" "${{ env.FILE_NAME }}-boot-gz.img" "${{ env.FILE_NAME }}-boot-lz4.img"; do
              if [ -f "$f" ]; then
                echo "  - $f" >> build_summary.md
              fi
            done
          fi

          echo "### Diagnostics" >> build_summary.md
          if [ -f patch-rejects/index.txt ]; then
            if [ -s patch-rejects/index.txt ]; then
              echo "  Rejected files:" >> build_summary.md
              while IFS= read -r line; do
                echo "    - $line" >> build_summary.md
              done < patch-rejects/index.txt
            else
              echo "  No rejected patches found." >> build_summary.md
            fi
          else
            echo "  No rejected patches found." >> build_summary.md
          fi
          
          echo "" >> build_summary.md
          echo "## Build Stats" >> build_summary.md
          echo "- **Build Time**: ${{ steps.collect_stats.outputs.build_time }}s" >> build_summary.md
          echo "- **Warnings Count**: ${{ steps.collect_stats.outputs.warnings_count }}" >> build_summary.md
          echo "- **Image SHA256**: \`${{ steps.collect_stats.outputs.image_sha256 }}\`" >> build_summary.md
          echo "- **ccache Hit Rate**: ${{ steps.ccache_stats.outputs.hit_rate }}" >> build_summary.md
          echo "- **ccache Direct Rate**: ${{ steps.ccache_stats.outputs.direct_rate }}" >> build_summary.md
