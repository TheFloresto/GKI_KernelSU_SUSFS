          echo "# Build Optimization Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CCACHE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_OPTIMIZE_INLINING=y" >> "${{ env.DEFCONFIG }}"

      - name: Build kernel with ccache optimization
        shell: bash
        id: build_kernel
        env:
          PYTHONWARNINGS: ignore:invalid escape sequence
        run: |
          set -euo pipefail
          echo "::group::Build kernel with ccache optimization"

          cd "$CONFIG/common"

          # Clear .scmversion to prevent dirty flag
          : > .scmversion

          export PYTHONWARNINGS="${PYTHONWARNINGS}"

          # Build timestamp setup (static as per branding)
          export SOURCE_DATE_EPOCH=$(date -d "$STATIC_DATE" +%s 2>/dev/null || date +%s)
          export KBUILD_BUILD_TIMESTAMP="$STATIC_DATE"
          export KBUILD_BUILD_USER="thefloresto"
          export KBUILD_BUILD_HOST="thefloresto-labs"
          export KBUILD_BUILD_VERSION=1

          echo "📅 Build timestamp: $KBUILD_BUILD_TIMESTAMP"
          echo "👤 Build user: $KBUILD_BUILD_USER"
          echo "🖥️  Build host: $KBUILD_BUILD_HOST"

          # Setup ccache in PATH
          export PATH="/usr/lib/ccache:${CLANG_BIN_PATH}:${PATH}"

          # Setup build environment variables
          export CC="ccache clang"
          export CXX="ccache clang++"
          export HOSTCC="ccache clang"
          export HOSTCXX="ccache clang++"
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          # ========== ОБНОВИТЕ ЭТОТ БЛОК ==========
          # Правильные пути для BTF
          export RESOLVE_BTFIDS="${PWD}/tools/bpf/resolve_btfids/resolve_btfids"
          export PAHOLE=/usr/bin/pahole

          # Для старых ядер - используем флаги совместимости и абсолютный путь
          if [[ "${{ inputs.kernel_version }}" == "5.10" ]] || [[ "${{ inputs.kernel_version }}" == "5.15" ]]; then
            export BTF_VMLINUX="${PWD}/out/vmlinux"
            # Используем флаги совместимости pahole если они установлены
            if [ -n "${PAHOLE_FLAGS:-}" ]; then
              export PAHOLE_FLAGS="${PAHOLE_FLAGS}"
              echo "Using PAHOLE_FLAGS: $PAHOLE_FLAGS"
            fi
          fi
          # =========================================

          # Create output directory
          OUT=out
          mkdir -p "$OUT"
          
          echo "============================================"
          echo "🔍 Compiler & ccache Verification"
          echo "============================================"
          echo "PATH: ${PATH:0:200}..."
          echo "which clang: $(which clang)"
          echo "CC: $CC"
          echo "CXX: $CXX"
          echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
          echo ""
          
          echo "ccache wrapper test:"
          clang --version 2>&1 | head -n1 || true
          echo ""
          echo "ccache configuration:"
          ccache -p | grep -E "(compression|direct_mode|readonly_direct|depend|sloppiness)" || true
          echo ""
          echo "ccache pre-build status:"
          ccache -s | head -n 20
          echo "============================================"
          
          make O="$OUT" gki_defconfig
          
          # Force O3 optimization (adjusted from original)
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          
          # Enable LTO Thin
          scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN
          scripts/config --file "$OUT/.config" -e LTO_CLANG
          make O="$OUT" olddefconfig

          # MOVED: Set LOCALVERSION AFTER olddefconfig
          if [ -n "${CUSTOM_LOCALVERSION:-}" ]; then
            scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}"
            scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
          fi
          
          KCFLAGS_EXTRA="-O3"
          
          KCFLAGS="$KCFLAGS -Wno-error -pipe -fno-stack-protector ${KCFLAGS_EXTRA}"
          KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"
          
          echo "============================================"
          echo "🔧 Build Configuration"
          echo "============================================"
          echo "Device: GKI ${{ inputs.android_version }}"
          echo "Kernel: ${{ inputs.kernel_version }}.$ACTUAL_SUBLEVEL"
          echo "Threads: $(nproc --all)"
          echo "Optimization: O3"
          echo "KCFLAGS: ${KCFLAGS:0:150}..."
          echo "KCPPFLAGS: ${KCPPFLAGS:0:150}..."
          echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"
          echo "Workspace: $WORKSPACE"
          echo "ccache: ENABLED"
          echo "  Dir: $CCACHE_DIR"
          echo "  Base: $CCACHE_BASEDIR"
          echo "  Max size: $CCACHE_MAXSIZE"
          echo "============================================"
          
          if [ ! -d "$CCACHE_DIR" ] || [ -z "$(find "$CCACHE_DIR" -type f 2>/dev/null | head -n1)" ]; then
            echo "🔥 Priming cache with header preprocessing..."
            make -C "$CONFIG/common" O="$OUT" headers_install prepare 2>&1 | head -n 20 || true
            echo ""
          fi
          
          BUILD_START=$(date +%s)
          set -o pipefail
          
          make -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" 2>&1 | tee build.log
          
          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          
          echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"
          echo "BUILD_END=$BUILD_END" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          
          IMG="$OUT/arch/arm64/boot/Image"
          if [ ! -f "$IMG" ]; then
            echo "::error::Kernel Image missing"
            echo "::group::Last 100 lines of build log"
            tail -n 100 build.log || echo "Build log not available"
            echo "::endgroup::"
            exit 1
          fi
          
          # Create Image.lz4
          lz4 -f -12 --favor-decSpeed "$IMG" "$OUT/arch/arm64/boot/Image.lz4"
          
          # Copy snd-aloop module if it exists
          if [ -f "$OUT/sound/drivers/snd-aloop.ko" ]; then
            echo "Found snd-aloop.ko module"
            cp "$OUT/sound/drivers/snd-aloop.ko" "$OUT/"
          fi
          
          IMG_SIZE=$(stat -c%s "$IMG")
          
          echo "============================================"
          echo "✅ Build Completed Successfully"
          echo "============================================"
          echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
          echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
          
          echo ""
          echo "📊 ccache Post-Build Statistics"
          echo "============================================"
          ccache -s
          echo "============================================"
          echo "::endgroup::"

      - name: 📊 ccache Post-Build Statistics
        id: ccache_stats
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::ccache final statistics"
          
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          
          echo "ccache Statistics"
          ccache -s
          
          STATS="$(ccache -s)"
          
          CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ {
            match($0, /[0-9]+/); 
            print substr($0, RSTART, RLENGTH)
          }' | head -n1)
          
          HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ {
            match($0, /[0-9]+/); 
            print substr($0, RSTART, RLENGTH)
          }' | head -n1)
          
          DIRECT=$(echo "$STATS" | awk '/Direct:/ {
            match($0, /[0-9]+/); 
            print substr($0, RSTART, RLENGTH)
          }' | head -n1)
          
          if [ "${CACHEABLE:-0}" -gt 0 ]; then
            HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
            DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
          else
            HIT_RATE="0.0"
            DIRECT_RATE="0.0"
          fi
          
          echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
          echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"
          
          echo "::endgroup::"

      - name: Patch KPM for SukiSU-Ultra
        if: ${{ inputs.kernelsu_variant == 'SukiSU' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Patching Image file..."
          cd "$CONFIG/common/out"
          curl -LSs "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch
          chmod +x patch
          ./patch arch/arm64/boot/Image
          rm -f arch/arm64/boot/Image
          mv arch/arm64/boot/oImage arch/arm64/boot/Image

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          # Copy Image from clang build location
          cp ./$CONFIG/common/out/arch/arm64/boot/Image AnyKernel3/Image
          sed -i 's|^do\.modules=.*|do.modules=1|' ./AnyKernel3/anykernel.sh

      - name: Copy snd-aloop module
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./$CONFIG/common/out/snd-aloop.ko" ]; then
            mkdir -p AnyKernel3/modules/data/adb/lkm
            cp "./$CONFIG/common/out/snd-aloop.ko" AnyKernel3/modules/data/adb/lkm/
          fi

      - name: Create Bootimgs Folder and Copy Images
        shell: bash
        run: |
          set -euo pipefail
          mkdir bootimgs
          cp ./$CONFIG/common/out/arch/arm64/boot/Image ./bootimgs
          cp ./$CONFIG/common/out/arch/arm64/boot/Image.lz4 ./bootimgs
          cp ./$CONFIG/common/out/arch/arm64/boot/Image ./${{ env.FILE_NAME }}-Image
          cp ./$CONFIG/common/out/arch/arm64/boot/Image.lz4 ./${{ env.FILE_NAME }}-Image.lz4

          # Create gzip of the Image file
          gzip -n -k -f -9 ./${{ env.FILE_NAME }}-Image > ./${{ env.FILE_NAME }}-Image.gz
          gzip -n -k -f -9 ./bootimgs/Image > ./bootimgs/Image.gz

      - name: Android 12 boot image build script
        if: ${{ inputs.android_version == 'android12' }}
        shell: bash
        run: |
          set -euo pipefail
          cd bootimgs
          
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-"${{ inputs.os_patch_level }}"_r1.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip
          
          # Check if the GKI URL is available
          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          
          if [ "$status" = "200" ]; then
              curl -Lo gki-kernel.zip "$GKI_URL"
          else
              curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi
          
          # Unzip the downloaded kernel and remove the zip
          unzip gki-kernel.zip && rm gki-kernel.zip
          
          FULL_PATH=$(pwd)/boot-5.10.img
          $UNPACK_BOOTIMG --boot_img="$FULL_PATH"
          
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img

      - name: Android 13/14/15 boot image build script
        if: ${{ inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' }}
        shell: bash
        run: |
          set -euo pipefail
          cd bootimgs
          
          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img

      - name: Upload AnyKernel3 Artifacts
        id: upload_ak3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-AK3
          path: |
            ./AnyKernel3/**
          compression-level: 9

      - name: Extra Artifacts
        if: ${{ always() }}
        id: upload_misc
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Misc
          path: |
            ${{ env.FILE_NAME }}-Image
            ${{ env.FILE_NAME }}-Image.gz
            ${{ env.FILE_NAME }}-Image.lz4
            ${{ env.FILE_NAME }}-boot.img
            ${{ env.FILE_NAME }}-boot-gz.img
            ${{ env.FILE_NAME }}-boot-lz4.img
            build_summary.md
          compression-level: 9

      - name: Generate Build Summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          # Create build summary file for inclusion in Misc artifact
          echo "# Kernel Build Summary" > build_summary.md
          
          # Add build variant header
          echo "## ${{ env.FILE_NAME }}" >> build_summary.md
          
          # Add build info
          echo "## Build Information" >> build_summary.md
          echo "- **Android Version**: ${{ inputs.android_version }}" >> build_summary.md
          echo "- **Kernel Version**: ${{ inputs.kernel_version }}.${{ env.ACTUAL_SUBLEVEL }}" >> build_summary.md
          echo "- **BBG**: Installed" >> build_summary.md
          echo "- **Bypass Mode**: ${{ matrix.apply_bypass }}" >> build_summary.md
          echo "- **Build Time**: ${BUILD_TIME}s" >> build_summary.md
          echo "- **ccache Hit Rate**: ${{ steps.ccache_stats.outputs.hit_rate }}" >> build_summary.md
          echo "- **ccache Direct Rate**: ${{ steps.ccache_stats.outputs.direct_rate }}" >> build_summary.md
          echo "" >> build_summary.md

          # Get KSU directory name based on variant
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              KSU_DIR="Wild_KSU"
              KSU_REPO="https://github.com/WildKernels/Wild_KSU"
              ;;
            "KSU")
              KSU_DIR="KernelSU"
              KSU_REPO="https://github.com/tiann/KernelSU"
              ;;
            "NEXT")
              KSU_DIR="KernelSU-Next"
              KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next"
              ;;
            "SukiSU")
              KSU_DIR="SukiSU-Ultra"
              KSU_REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra"
              ;;
            "MKSU")
              KSU_DIR="KernelSU"
              KSU_REPO="https://github.com/5ec1cff/KernelSU"
              ;;
          esac

          # Get KSU commit
          if [ -d "$CONFIG/$KSU_DIR" ]; then
            cd "$CONFIG/$KSU_DIR"
            KSU_COMMIT=$(git rev-parse HEAD)
            KSU_URL="$KSU_REPO/commit/$KSU_COMMIT"
            echo "- **${{ inputs.kernelsu_variant }} (v${KSUVER})**: [$KSU_COMMIT]($KSU_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
            cd "$GITHUB_WORKSPACE"
          else
            echo "- **${{ inputs.kernelsu_variant }} (v${KSUVER})**: not present" >> build_summary.md
          fi
          
          # Get Baseband-guard commit
          if [ -d "$CONFIG/Baseband-guard" ]; then
            cd "$CONFIG/Baseband-guard"
            BBG_COMMIT=$(git rev-parse HEAD)
            BBG_URL="https://github.com/vc-teahouse/Baseband-guard/commit/$BBG_COMMIT"
            echo "- **Baseband-guard**: [$BBG_COMMIT]($BBG_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
            cd "$GITHUB_WORKSPACE"
          else
            echo "- **Baseband-guard**: not present" >> build_summary.md
          fi
          
          # Get SUSFS4KSU commit
          if [ -d "$GITHUB_WORKSPACE/susfs4ksu" ]; then
            cd "$GITHUB_WORKSPACE/susfs4ksu"
            SUSFS_COMMIT=$(git rev-parse HEAD)
            SUSFS_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_COMMIT"
            echo "- **SUSFS4KSU (v1.5.12)**: [$SUSFS_COMMIT]($SUSFS_URL)" >> "$GITHUB_WORKSPACE/build_summary.md"
            cd "$GITHUB_WORKSPACE"
          else
            echo "- **SUSFS4KSU (v1.5.12)**: not present" >> build_summary.md
          fi
          echo "" >> build_summary.md

            # Add artifact summary with presence verification
          echo "## Build Artifacts" >> build_summary.md

          # Verify AnyKernel3 contents - check if kernel Image was actually copied (indicates successful build)
          if [ -d "AnyKernel3" ] && [ -f "AnyKernel3/Image" ]; then
            AK3_STATUS="✅"
          else
            AK3_STATUS="❌"
          fi
          echo "- **AnyKernel3**: $AK3_STATUS ${{ env.FILE_NAME }}-AnyKernel3" >> build_summary.md

          echo "### Misc (uploaded files)" >> build_summary.md
          FILES_PRESENT=0
          for f in "${{ env.FILE_NAME }}-Image" "${{ env.FILE_NAME }}-Image.gz" "${{ env.FILE_NAME }}-Image.lz4" "${{ env.FILE_NAME }}-boot.img" "${{ env.FILE_NAME }}-boot-gz.img" "${{ env.FILE_NAME }}-boot-lz4.img"; do
            if [ -f "$f" ]; then FILES_PRESENT=$((FILES_PRESENT+1)); fi
          done
          if [ "$FILES_PRESENT" -gt 0 ]; then
            MISC_STATUS="✅"
          else
            MISC_STATUS="❌"
          fi
          echo "- **Set**: $MISC_STATUS ${{ env.FILE_NAME }}-Misc" >> build_summary.md
          if [ "$MISC_STATUS" = "✅" ]; then
            echo "  Included:" >> build_summary.md
            for f in "${{ env.FILE_NAME }}-Image" "${{ env.FILE_NAME }}-Image.gz" "${{ env.FILE_NAME }}-Image.lz4" "${{ env.FILE_NAME }}-boot.img" "${{ env.FILE_NAME }}-boot-gz.img" "${{ env.FILE_NAME }}-boot-lz4.img"; do
              if [ -f "$f" ]; then
                echo "  - $f" >> build_summary.md
              fi
            done
          fi

          echo "### Diagnostics" >> build_summary.md
          echo "- **Rejected Patches**: ${{ env.FILE_NAME }}-Rejected-Patches" >> build_summary.md
          if [ -f patch-rejects/index.txt ]; then
            if [ -s patch-rejects/index.txt ]; then
              echo "  Rejected files:" >> build_summary.md
              while IFS= read -r line; do
                echo "    - $line" >> build_summary.md
              done < patch-rejects/index.txt
            else
              echo "  Rejected file list is empty." >> build_summary.md
            fi
          else
            echo "  No rejected patches found." >> build_summary.md
          fi
          
