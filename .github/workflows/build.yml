name: Kernel Build Process
permissions:
  contents: write
  actions: write 

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string        
      # revision input removed; A12 boot image download uses fixed r1

jobs:
  build-gki:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        apply_module_check_bypass: ["normal", "bypass"]
        apply_susfs_v1_5_9: ["v1.5.9", "v1.5.12"]

    steps:
      - name: Maximize Build Space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'          # Frees ~2 GB
          remove-android: 'true'         # Frees ~9 GB
          remove-haskell: 'true'         # Frees ~5.2 GB
          remove-codeql: 'true'          # Frees ~5.4 GB
          remove-docker-images: 'true'   # Frees ~3.2 GB
          remove-large-packages: 'true'  # Frees ~3.1 GB
          remove-swapfile: 'true'        # Frees ~4 GB
          remove-cached-tools: 'false'   # Avoid unless confirmed safe
          verbose: 'true'                # Enable detailed logging

      - name: Setup SWAP
        shell: bash
        run: |
         set -euo pipefail
         sudo swapoff -a
         sudo fallocate -l 20G /swapfile
         sudo chmod 600 /swapfile
         sudo mkswap /swapfile
         sudo swapon -p 1 /swapfile
         echo 'vm.swappiness=1' | sudo tee -a /etc/sysctl.conf
         echo 'vm.vfs_cache_pressure=50' | sudo tee -a /etc/sysctl.conf
         echo 'vm.overcommit_memory=1' | sudo tee -a /etc/sysctl.conf
         sudo sysctl -p
         free -h
          
      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          # Set CONFIG dynamically based on inputs values
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Install Minimal Dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Install deps"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils ccache rsync unzip dwarves file python3 bc cpio kmod
          sudo apt-get clean
          echo "::endgroup::"

      - name: Setup Build Environment
        shell: bash
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2025
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools &
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg &
          wait
          
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH" >> $GITHUB_ENV
          
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/./git-repo/repo" >> $GITHUB_ENV

      - name: Set boot sign key
        shell: bash
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          set -euo pipefail
          if [ ! -z "$BOOT_SIGN_KEY" ]; then
            echo "$BOOT_SIGN_KEY" > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          fi

      - name: Setup ZyCromerZ Clang Toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}        
        run: |
          set -euo pipefail
          echo "Fetching latest ZyCromerZ Clang release..."
          LATEST_CLANG_TAG=$(gh api repos/ZyCromerZ/Clang/releases/latest --jq '.tag_name')
          if [ -z "$LATEST_CLANG_TAG" ]; then
            echo "Error: Could not fetch latest ZyCromerZ Clang tag"
            exit 1
          fi
          echo "Latest ZyCromerZ Clang tag: $LATEST_CLANG_TAG"
          
          # Extract version info for environment variables
          CLANG_VERSION=$(echo "$LATEST_CLANG_TAG" | sed 's/-release$//')
          
          echo "Downloading ZyCromerZ Clang $LATEST_CLANG_TAG..."
          mkdir -p clang-zyc
          cd clang-zyc
          
          # Download the latest release asset (assuming the naming pattern is consistent)
          DOWNLOAD_URL="https://github.com/ZyCromerZ/Clang/releases/download/$LATEST_CLANG_TAG/Clang-$CLANG_VERSION.tar.gz"
          echo "Download URL: $DOWNLOAD_URL"
          
          curl -LO "$DOWNLOAD_URL"
          tar -xzf "Clang-$CLANG_VERSION.tar.gz"
          cd ..
          
          # Set environment variables
          echo "LATEST_CLANG_TAG=$LATEST_CLANG_TAG" >> $GITHUB_ENV
          echo "CLANG_SOURCE=zyc" >> $GITHUB_ENV
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang-zyc/bin" >> $GITHUB_ENV
          echo "CLANG_VERSION=zyc-$CLANG_VERSION" >> $GITHUB_ENV
          echo "CLANG_BIN_PATH=$GITHUB_WORKSPACE/clang-zyc/bin" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/clang-zyc/bin" >> $GITHUB_PATH
          
      - name: Clone AnyKernel3 and Other Dependencies
        shell: bash
        run: |
          set -euo pipefail
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          
          git clone https://github.com/TheFloresto/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/WildKernels/kernel_patches.git -b main
          git clone https://github.com/ShirkNeko/SukiSU_patch.git -b main       
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          
          # Checkout specific commits for SUSFS v1.5.9 if enabled
          if [ "${{ matrix.apply_susfs_v1_5_9 }}" = "v1.5.9" ]; then
            cd susfs4ksu
            case "${{ inputs.android_version }}-${{ inputs.kernel_version }}" in
              "android15-6.6")
                git checkout 2598fee8963adab11c255bf28521df32912e027f
                ;;
              "android14-6.1")
                git checkout 646cfabce9d5dba5b806e9cbe2c198128ebd0e69
                ;;
              "android14-5.15")
                git checkout ab4d9570a9494a67c290002f3b28e69dd370a0f5
                ;;
              "android13-5.15")
                git checkout a21f265695f2869a6f3fc71a70328aa6d0f4a3ae
                ;;
              "android13-5.10")
                git checkout 8acbd10775a447f546b14c6bded6f476a7f4733f
                ;;
              "android12-5.10")
                git checkout 6f42c0e24e35a6fa0fc43051a5f1e7dfe568e8c2
                ;;
            esac
            cd ..
          fi         

      - name: Initialize and Sync Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CONFIG"
          cd "$CONFIG"
          
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          
          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
          
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast --optimized-fetch --prune

      - name: Extract Actual Sublevel for LTS Builds
        if: inputs.sub_level == 'X'
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          
          if [ -f "Makefile" ]; then
            ACTUAL_SUBLEVEL=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
            
            if [ -n "$ACTUAL_SUBLEVEL" ]; then
              OLD_CONFIG="$CONFIG"
              NEW_CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-$ACTUAL_SUBLEVEL"
              
              echo "CONFIG=$NEW_CONFIG" >> $GITHUB_ENV
              echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
              
              cd ../..
              if [ -d "$OLD_CONFIG" ]; then
                mv "$OLD_CONFIG" "$NEW_CONFIG"
              fi
            fi
          fi

      - name: Apply glibc 2.38 Compatibility Fix
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( ${{ inputs.sub_level }} <= 186 )) || [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( ${{ inputs.sub_level }} <= 119 )); then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}') 
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then 
              cd $CONFIG/common/
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
              if [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( ${{ inputs.sub_level }} <= 186 )) || [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( ${{ inputs.sub_level }} <= 119 )); then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi 

      - name: Fix Less Then 6.6.50 Builds
        if: inputs.android_version == 'android15' && inputs.kernel_version == '6.6'
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
              sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi

      - name: Apply ptrace patch for older kernels
        if: fromJSON(inputs.kernel_version) < 5.16
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          patch -p1 -F 3 < "../../kernel_patches/gki_ptrace.patch"

      - name: Determine the branch for KernelSU
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.kernelsu_branch }}" in
            "Stable")
              if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
                echo "BRANCH=-s susfs-main" >> $GITHUB_ENV
              else
                echo "BRANCH=-" >> $GITHUB_ENV
              fi
              ;;
            "Dev")
              if [[ "${{ inputs.kernelsu_variant }}" =~ ^(KSU|MKSU)$ ]]; then
                echo "BRANCH=-s main" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "NEXT" ]]; then
                echo "BRANCH=-s next" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "WKSU" ]]; then
                echo "BRANCH=-s wild" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
                echo "BRANCH=-s susfs-test" >> $GITHUB_ENV
              fi
              ;;
            "Other")
              if [[ -n "${{ inputs.kernelsu_branch_other }}" ]]; then
                echo "BRANCH=-s ${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
              else
                echo "Error: Custom branch not provided for 'Other'" >&2
                exit 1
              fi
              ;;
          esac

      - name: Add KernelSU
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
      
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Adding WKSU..."
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "KSU")
              echo "Adding KernelSU Official..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "NEXT")
              echo "Adding KernelSU Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "SukiSU")
              echo "Adding KernelSU SukiSU..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash ${{ env.BRANCH }}       
              ;;
            "MKSU")
              echo "Adding KernelSU MKSU..."
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
          esac
          
      - name: Getting KernelSU Version
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Getting WKSU version..."
              cd ./Wild_KSU
              BASE_VERSION=10200
              ;;
            "KSU")
              echo "Getting Official KernelSU version..."
              cd ./KernelSU
              BASE_VERSION=10200
              ;;
            "NEXT")
              echo "Getting NEXT version..."
              cd ./KernelSU-Next
              BASE_VERSION=10200
              ;;
            "SukiSU")
              echo "Getting SukiSU version... "
              git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
              cd SukiSU-Ultra
              BASE_VERSION=10700  
              ;;
            "MKSU")
              echo "Getting MKSU version..."   
              cd ./KernelSU
              BASE_VERSION=10200           
              ;;
          esac
          COMMIT_COUNT=$(/usr/bin/git rev-list --count HEAD)
          echo "Commits: $COMMIT_COUNT"
          KSU_VERSION=$(expr $COMMIT_COUNT "+" $BASE_VERSION)
          echo "KSUVER=$KSU_VERSION"
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

      - name: Apply SUSFS Patches for KernelSU Variants
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          cp -v ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cd common
          patch -p1 --forward < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch
          cd ..
          cp -v ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp -v ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Applying SUSFS patches for WKSU..."
              cd ./Wild_KSU
              cp -v ../../kernel_patches/next/0001-Susfs-1.5.9.patch ./
              patch -p1 --forward < 0001-Susfs-1.5.9.patch      

              cp -v ../../kernel_patches/next/0001-james.patch ./
              patch -p1 --forward < 0001-james.patch 
              ;;
            "KSU")
              echo "Applying SUSFS patches for Official KernelSU..."
              cd ./KernelSU
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true          
              ;;
            "NEXT")
              echo "Applying SUSFS patches for KernelSU Next..."
              cd ./KernelSU-Next
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch .
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true
          
              # Apply compatibility fixes
              if [ "${{ matrix.apply_susfs_v1_5_9 }}" = "v1.5.9" ]; then
               SUSFS_VERSION="1.5.9"
              else
               SUSFS_VERSION="1.5.12"
              fi
          
               cp -v ../../kernel_patches/next/susfs_fix_patches/v${SUSFS_VERSION}/fix_core_hook.c.patch ./
               patch -p1 --forward --fuzz=3 < fix_core_hook.c.patch
          
               ## Skip fix_rules.c.patch for Android 14 with kernel 6.1
               #if [ "${{ inputs.android_version }}" != "android14" ] && [ "${{ inputs.kernel_version }}" != "6.1" ]; then
               #  cp -v ../../kernel_patches/next/susfs_fix_patches/v${SUSFS_VERSION}/fix_rules.c.patch ./
               #  patch -p1 --forward < fix_rules.c.patch
               #fi

               cp -v ../../kernel_patches/next/susfs_fix_patches/v${SUSFS_VERSION}/fix_sucompat.c.patch ./
               patch -p1 --forward < fix_sucompat.c.patch

               cp -v ../../kernel_patches/next/susfs_fix_patches/v${SUSFS_VERSION}/fix_kernel_compat.c.patch ./
               patch -p1 --forward < fix_kernel_compat.c.patch              

               cp -v ../../kernel_patches/next/0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch ./
               patch -p1 --forward < 0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch     
              ;;
             "SukiSU")
              echo "Applying SUSFS patches for SukiSU..."
              cd ./KernelSU              
              ;;
            "MKSU")
              echo "Applying SUSFS patches for MKSU..."
              cd ./KernelSU
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true       
              
              cp -v ../../kernel_patches/next/0001-Susfs-1.5.9.patch ./
              patch -p1 --forward < 0001-Susfs-1.5.9.patch             
              ;;
          esac
          
      - name: Apply Hooks Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Applying hooks for WKSU..."
              cp -v ../../kernel_patches/next/60_scope-minimized_manual_hooks.patch ./
              patch -p1 --forward -F 3 < 60_scope-minimized_manual_hooks.patch
              ;;
            "KSU")
              echo "Applying hooks for Official KernelSU..."
              cp ../../kernel_patches/sultan/ksu_hooks.patch ./
              patch -p1 --forward -F 3 < ksu_hooks.patch
              ;;
            "NEXT")
              echo "Applying hooks for KernelSU-Next..."
              cp ../../kernel_patches/next/scope_min_manual_hooks_v1.4.patch ./
              patch -p1 --forward -F 3 < scope_min_manual_hooks_v1.4.patch
              ;;
            "SukiSU")
              echo "Applying hooks for SukiSU..."          
              cp ../../SukiSU_patch/hooks/syscall_hooks.patch ./
              patch -p1 --forward -F 3 < syscall_hooks.patch
              ;;
            "MKSU")
              echo "Applying hooks for MKSU..."
              cp ../../kernel_patches/sultan/ksu_hooks.patch ./
              patch -p1 --forward -F 3 < ksu_hooks.patch             
              ;;
          esac 

      - name: Add BBG
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/landlock/landlock,baseband_guard/ } }' common/security/Kconfig

      - name: Apply Module Check Bypass
        if: ${{ matrix.apply_module_check_bypass == 'bypass' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" ]]; then
            cd "$CONFIG/common/kernel/module"
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' version.c
          else
            cd "$CONFIG/common/kernel"
            sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' module.c
          fi

      - name: Fix WiFi and Bluetooth on Samsung 6.6 GKI devices
        if: ${{ ( inputs.kernel_version == '6.6' ) }}
        shell: bash
        run: |
          set -euo pipefail
          SYMBOL_LIST=$CONFIG/common/android/abi_gki_aarch64_galaxy
          echo "kdp_set_cred_non_rcu" >> $SYMBOL_LIST
          echo "kdp_usecount_dec_and_test" >> $SYMBOL_LIST
          echo "kdp_usecount_inc" >> $SYMBOL_LIST
          
          cd $CONFIG/common
          PATCH="../../kernel_patches/samsung/min_kdp/add-min_kdp-symbols.patch"
          if patch -p1 --dry-run < $PATCH; then
            patch -p1 --no-backup-if-mismatch < $PATCH
          fi
          
          cd drivers
          cp "../../../kernel_patches/samsung/min_kdp/min_kdp.c" min_kdp.c
          echo "obj-y += min_kdp.o" >> Makefile

      - name: Apply Kernel Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          defconfig="./common/arch/arm64/configs/gki_defconfig"
          
          echo "Applying kernel configurations one by one..."
          
          # KernelSU Core Configuration
          echo "CONFIG_KSU=y" >> "$defconfig"
          
          if [ "${{ inputs.kernelsu_variant }}" == "NEXT" ] || [ "${{ inputs.kernelsu_variant }}" == "WKSU" ]; then
            echo "CONFIG_KSU_SWITCH_MANAGER=y" >> "$defconfig"        
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$defconfig"        
            echo "CONFIG_KPM=y" >> "$defconfig"
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "NEXT" ] || [ "${{ inputs.kernelsu_variant }}" == "WKSU" ] || [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then               
            echo "CONFIG_KSU_KPROBES_HOOK=n" >> "$defconfig"
          fi

          # BBG Support
          echo "CONFIG_KSU_DEBUG=n" >> "$defconfig"
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$defconfig"
          echo "CONFIG_KSU_ALLOWLIST_WORKAROUND=n" >> "$defconfig"
          echo "CONFIG_KSU_LSM_SECURITY_HOOKS=y" >> "$defconfig"          
          
          # Mountify Support
          echo "CONFIG_TMPFS_XATTR=y" >> "$defconfig"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$defconfig"
          
          # Networking Configuration
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> "$defconfig"
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> "$defconfig"
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> "$defconfig"
          
          # BBR TCP Congestion Control
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$defconfig"
          echo "CONFIG_TCP_CONG_BBR=y" >> "$defconfig"
          echo "CONFIG_NET_SCH_FQ=y" >> "$defconfig"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$defconfig"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$defconfig"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$defconfig"
          
          # IPSet support
          echo "CONFIG_IP_SET=y" >> "$defconfig"
          echo "CONFIG_IP_SET_MAX=256" >> "$defconfig"
          echo "CONFIG_IP_SET_BITMAP_IP=y" >> "$defconfig"
          echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "$defconfig"
          echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_IP=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_NET=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_NETNET=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "$defconfig"
          echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "$defconfig"

          # SUSFS Configuration
          echo "CONFIG_KSU_SUSFS=y" >> "$defconfig"
          #echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$defconfig"
          
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$defconfig"
          
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$defconfig"
          
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$defconfig"
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$defconfig"
          
          # Build Optimization Configuration
          echo "CONFIG_LTO_CLANG_THIN=y" >> "$defconfig"
          echo "CONFIG_LTO_CLANG=y" >> "$defconfig"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$defconfig"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n" >> "$defconfig"
          echo "CONFIG_CCACHE=y" >> "$defconfig"          
          echo "CONFIG_OPTIMIZE_INLINING=y" >> "$defconfig"           
          
          # Remove check_defconfig
          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Change Kernel Name
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          #Set Custom Hostname and Username
          perl -pi -e 's/LINUX_COMPILE_BY=.*/LINUX_COMPILE_BY="thefloresto"/' ./common/scripts/mkcompile_h
          perl -pi -e 's/LINUX_COMPILE_HOST=.*/LINUX_COMPILE_HOST="thefloresto-labs"/' ./common/scripts/mkcompile_h                  
          #Set Kernel Timestamp
          perl -pi -e 's{UTS_VERSION="\$\(echo \$UTS_VERSION \$CONFIG_FLAGS \$TIMESTAMP \| cut -b -\$UTS_LEN\)"}{UTS_VERSION="#1 SMP PREEMPT Mon Apr 20 08:09:31 UTC 2025"}' ./common/scripts/mkcompile_h
          if [ -f "build/build.sh" ]; then
            #Remove Dirty Flag
            sed -i 's/-dirty//' ./common/scripts/setlocalversion
          else
            #Remove Dirty Flag
            sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
            #Remove Abi Exports and Error
            rm -rf ./common/android/abi_gki_protected_exports_*
            perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./common/BUILD.bazel
          fi

      - name: Set file name
        shell: bash
        run: |
          set -euo pipefail
          # Set artifact name base for consistent naming
          # Prepare sublevel for naming
          SUBLEVEL_FOR_NAME="${{ inputs.sub_level }}"
          if [ -n "${ACTUAL_SUBLEVEL:-}" ]; then
            SUBLEVEL_FOR_NAME="$ACTUAL_SUBLEVEL"
          fi
          # Set artifact name base for consistent naming
          ARTIFACT_BASE="${{ inputs.kernelsu_variant }}-${{ env.KSUVER }}-SUSFS_${{ matrix.apply_susfs_v1_5_9 }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${SUBLEVEL_FOR_NAME}-${{ inputs.os_patch_level }}-${{ matrix.apply_module_check_bypass == 'bypass' && 'Module_Check_Bypass' || 'Normal' }}"        
          echo "ARTIFACT_BASE=$ARTIFACT_BASE" >> $GITHUB_ENV
          echo "FILE_NAME=$ARTIFACT_BASE" >> $GITHUB_ENV

      - name: Customize Kernel Branding
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_PATH="$GITHUB_WORKSPACE/$CONFIG"
          cd "$KERNEL_PATH/common"
          mkdir -p out
          CUSTOM_LOCALVERSION="-${{ inputs.android_version }}-@NoFloresto"
          echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"

      - name: Build Kernel with ZyCromerZ Clang
        shell: bash
        env:
          PYTHONWARNINGS: "ignore:invalid escape sequence"
        run: |
          set -euo pipefail
          echo "::group::Build kernel"
          KERNEL_PATH="$GITHUB_WORKSPACE/$CONFIG"
          COMMON="$KERNEL_PATH/common"
          cd "$COMMON"
          : > "$COMMON/.scmversion"

          # Ensure Python warnings are suppressed for scripts invoked by make
          export PYTHONWARNINGS="${PYTHONWARNINGS}"
          
          # ВАЖНО: Используем ZyCromerZ Clang из установленного пути
          echo "Using ZyCromerZ Clang from: ${CLANG_BIN_PATH}"
          export PATH="${CLANG_BIN_PATH}:$PATH"
          
          # Проверяем версию Clang
          which clang
          clang --version
          
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=clang HOSTCXX=clang++
          export CC=clang
          OUT=out
          mkdir -p "$OUT"
          make O="$OUT" gki_defconfig

           # LOCALVERSION branding
          if [ -n "${CUSTOM_LOCALVERSION:-}" ]; then
            scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}"
            scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
            sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
          fi

          # Optimize level config and flags (default O3)
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O3"

          # Consistent flags; include -pipe and disable stack protector
          KCFLAGS="-Wno-error -pipe -fno-stack-protector ${KCFLAGS_EXTRA}"
          KCPPFLAGS="-DCONFIG_OPTIMIZE_INLINING"

          # Regenerate defaults after config edits
          make O="$OUT" olddefconfig
          
          echo "Starting build with $(nproc --all) threads using ZyCromerZ Clang ${CLANG_VERSION}..."
          set -o pipefail
          make -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" 2>&1 | tee build.log
          
          IMG="$OUT/arch/arm64/boot/Image"
          if [ ! -f "$IMG" ]; then
            echo "Kernel Image missing"
            exit 1
          fi
          sha256sum "$IMG" | tee "$OUT/Image.sha256"
          echo "Build completed successfully with ZyCromerZ Clang!"
          echo "::endgroup::"

      - name: Create AnyKernel3 ZIP
        shell: bash
        run: |
          set -euo pipefail
          
          # Try different Image locations based on build type
          if [ -f "$CONFIG/common/out/arch/arm64/boot/Image" ]; then
            cp $CONFIG/common/out/arch/arm64/boot/Image AnyKernel3/Image
          elif [ -f "./$CONFIG/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image" ]; then
            cp ./$CONFIG/out/${{ inputs.android_version }}-${{ inputs.kernel_version }}/dist/Image AnyKernel3/Image
          elif [ -f "./$CONFIG/bazel-bin/common/kernel_aarch64/Image" ]; then
            cp ./$CONFIG/bazel-bin/common/kernel_aarch64/Image AnyKernel3/Image
          else
            echo "Error: Image file not found in any expected location"
            exit 1
          fi

          cd AnyKernel3
          
          # Use actual sublevel for LTS builds if available
          SUBLEVEL_FOR_NAME="${{ inputs.sub_level }}"
          if [ -n "${ACTUAL_SUBLEVEL:-}" ]; then
            SUBLEVEL_FOR_NAME="$ACTUAL_SUBLEVEL"
          fi
          
          ZIP_NAME="${{ inputs.kernelsu_variant }}-${{ env.KSUVER }}-SUSFS_${{ matrix.apply_susfs_v1_5_9 }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${SUBLEVEL_FOR_NAME}-${{ inputs.os_patch_level }}-${{ matrix.apply_module_check_bypass == 'bypass' && 'Module_Check_Bypass' || 'Normal' }}-AK3.zip"
          echo "Creating flashable zip: $ZIP_NAME"
          zip -r "../$ZIP_NAME" ./* >/dev/null
          echo "AnyKernel3 ZIP created successfully"

      - name: Create Bootimgs Folder and Copy Images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootimgs
          
          KERNEL_PATH="$GITHUB_WORKSPACE/$CONFIG"
          COMMON="$KERNEL_PATH/common"
          OUT="$COMMON/out"
          
          echo "Creating bootimgs folder and copying images..."
          cp "$OUT/arch/arm64/boot/Image" ./bootimgs/
          cp "$OUT/arch/arm64/boot/Image" ./
          
          # Create Image.lz4
          lz4 -f -12 --favor-decSpeed "$OUT/arch/arm64/boot/Image" ./bootimgs/Image.lz4
          lz4 -f -12 --favor-decSpeed "$OUT/arch/arm64/boot/Image" ./Image.lz4
          
          # Create gzip of the Image file
          gzip -n -k -f -9 ./Image > ./Image.gz
          cp ./Image.gz ./bootimgs/Image.gz

      - name: Android 12 boot image build script
        if: ${{ inputs.android_version == 'android12' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd bootimgs
          
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-"${{ inputs.os_patch_level }}"_r1.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip
          
          # Check if the GKI URL is available
          echo "Checking if GKI kernel URL is reachable: $GKI_URL"
          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          
          if [ "$status" = "200" ]; then
              echo "[+] Downloading from GKI_URL"
              curl -Lo gki-kernel.zip "$GKI_URL"
          else
              echo "[+] $GKI_URL not found, using $FALLBACK_URL"
              curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi
          
          # Unzip the downloaded kernel and remove the zip
          echo "Unzipping the downloaded kernel..."
          unzip gki-kernel.zip && rm gki-kernel.zip
          
          echo "Unpacking boot.img..."
          FULL_PATH=$(pwd)/boot-5.10.img
          echo "Unpacking using: $FULL_PATH"
          
          echo "Running unpack_bootimg.py..."
          $UNPACK_BOOTIMG --boot_img="$FULL_PATH"
          
          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img

      - name: Android 13/14/15 boot image build script
        if: ${{ inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15' }}
        shell: bash
        run: |
          set -euo pipefail
          cd bootimgs
          
          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.FILE_NAME }}-boot.img
          
          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.FILE_NAME }}-boot-gz.img
          
          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.FILE_NAME }}-boot-lz4.img
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-Complete-Build
          path: |
            *-AK3.zip
            *-boot.img
            *-boot-gz.img
            *-boot-lz4.img
          compression-level: 9    
