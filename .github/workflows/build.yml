          echo "# Build Optimization Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG_THIN=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_LTO_CLANG=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=n" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CCACHE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_OPTIMIZE_INLINING=y" >> "${{ env.DEFCONFIG }}"

      - name: Configure Universal Kernel Optimizations
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          
          # ============================================================================
          # БАЗОВЫЕ ARM64 ОПЦИИ (обязательны для всех GKI)
          # ============================================================================
          echo "# Universal ARM64 Configuration" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64_VA_BITS=48" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64_PA_BITS=48" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64_TAGGED_ADDR_ABI=y" >> "${{ env.DEFCONFIG }}"
          
          # Современные ARM64 фичи (безопасны для ядер 5.10+)
          if [[ "${{ inputs.kernel_version }}" != "5.10" ]] || (( ${ACTUAL_SUBLEVEL:-999} >= 100 )); then
            echo "CONFIG_ARM64_BTI=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ARM64_PTR_AUTH=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          if [[ "${{ inputs.kernel_version }}" == "5.15" ]] || [[ "${{ inputs.kernel_version }}" == "6.1" ]] || [[ "${{ inputs.kernel_version }}" == "6.6" ]]; then
            echo "CONFIG_ARM64_SVE=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          if [[ "${{ inputs.kernel_version }}" == "6.1" ]] || [[ "${{ inputs.kernel_version }}" == "6.6" ]]; then
            echo "CONFIG_ARM64_SME=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          # ============================================================================
          # УНИВЕРСАЛЬНЫЕ CORTEX CORES (работают на ВСЕХ устройствах)
          # ============================================================================
          echo "# Generic Cortex Cores Support" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64_CORTEX_A53=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64_CORTEX_A55=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64_CORTEX_A76=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM64_CORTEX_A78=y" >> "${{ env.DEFCONFIG }}"
          
          # Более новые cores для современных SoC
          if [[ "${{ inputs.kernel_version }}" == "6.1" ]] || [[ "${{ inputs.kernel_version }}" == "6.6" ]]; then
            echo "CONFIG_ARM64_CORTEX_X1=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ARM64_CORTEX_X2=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ARM64_CORTEX_X3=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ARM64_CORTEX_A710=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ARM64_CORTEX_A715=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ARM64_CORTEX_A510=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          if [[ "${{ inputs.kernel_version }}" == "6.6" ]]; then
            echo "CONFIG_ARM64_CORTEX_A720=y" >> "${{ env.DEFCONFIG }}"
            echo "CONFIG_ARM64_CORTEX_A520=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          # ============================================================================
          # CPU SCHEDULER - универсальные оптимизации
          # ============================================================================
          echo "# CPU Scheduler Optimization" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_SCHED_MC=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ENERGY_MODEL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_UCLAMP_TASK=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_UCLAMP_TASK_GROUP=y" >> "${{ env.DEFCONFIG }}"
          
          if [[ "${{ inputs.kernel_version }}" != "5.10" ]]; then
            echo "CONFIG_SCHED_CORE=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          # ============================================================================
          # CPU FREQUENCY & POWER MANAGEMENT
          # ============================================================================
          echo "# CPU Frequency & Power Management" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CPU_FREQ=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CPU_FREQ_STAT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CPUFREQ_DT=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_OPP=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CPU_IDLE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_ARM_PSCI_CPUIDLE=y" >> "${{ env.DEFCONFIG }}"
          
          # ============================================================================
          # THERMAL MANAGEMENT (важно для производительности)
          # ============================================================================
          echo "# Thermal Management" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_THERMAL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CPU_THERMAL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_DEVFREQ_THERMAL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_THERMAL_GOV_POWER_ALLOCATOR=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_THERMAL_GOV_STEP_WISE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_THERMAL_GOV_FAIR_SHARE=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_THERMAL_EMULATION=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_THERMAL_WRITABLE_TRIPS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_POWER_CAP=y" >> "${{ env.DEFCONFIG }}"
          
          # ============================================================================
          # MEMORY MANAGEMENT
          # ============================================================================
          echo "# Memory Management" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CMA=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_CMA_AREAS=7" >> "${{ env.DEFCONFIG }}"
          
          if [[ "${{ inputs.kernel_version }}" != "5.10" ]]; then
            echo "CONFIG_NUMA_BALANCING=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          # ============================================================================
          # FILE SYSTEMS (важно для Android)
          # ============================================================================
          echo "# File Systems" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_F2FS_FS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_F2FS_FS_XATTR=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_F2FS_FS_POSIX_ACL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_F2FS_FS_SECURITY=y" >> "${{ env.DEFCONFIG }}"
          
          if [[ "${{ inputs.kernel_version }}" != "5.10" ]] || (( ${ACTUAL_SUBLEVEL:-999} >= 50 )); then
            echo "CONFIG_F2FS_FS_COMPRESSION=y" >> "${{ env.DEFCONFIG }}"
          fi
          
          echo "CONFIG_EXT4_FS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_EXT4_FS_POSIX_ACL=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_EXT4_FS_SECURITY=y" >> "${{ env.DEFCONFIG }}"
          
          # ============================================================================
          # PERFORMANCE & DEBUG
          # ============================================================================
          echo "# Performance Events" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_PERF_EVENTS=y" >> "${{ env.DEFCONFIG }}"
          echo "CONFIG_HW_PERF_EVENTS=y" >> "${{ env.DEFCONFIG }}"

      - name: Remove Dirty Flag
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          if [ -f "build/build.sh" ]; then
            # Remove Dirty Flag
            sed -i 's/-dirty//g' ./common/scripts/setlocalversion
          else
