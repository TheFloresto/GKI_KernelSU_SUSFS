name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_variant:
        required: true
        type: string
      ksu_commit:
        required: false
        type: string
      build_bypass:
        required: true
        type: boolean
      variant:
        required: false
        type: string

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ matrix.build_type }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: >-
          ${{
            fromJSON(
              inputs.build_bypass && '["Normal","Bypass"]' || '["Normal"]'
            )
          }}

    steps:
    - name: Build Summary
      shell: bash
      run: |
        set -euo pipefail
        echo "========================================"
        echo "       Kernel Build Summary"
        echo "========================================"
        echo "Android Version : ${{ inputs.android_version }}"
        echo "Kernel Version  : ${{ inputs.kernel_version }}"
        echo "Sub Level       : ${{ inputs.sub_level }}"
        echo "Patch Level     : ${{ inputs.os_patch_level }}"
        echo "Build Type      : ${{ matrix.build_type }}"
        echo "KSU Variant     : ${{ inputs.ksu_variant }}"
        echo "KSU Commit      : ${{ inputs.ksu_commit || 'Default' }}"
        echo "========================================"

    - name: Build Space Before
      shell: bash
      run: |
        set -euo pipefail
        echo "Disk space before:"
        df -h

    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"
        testing: false

    - name: Build Space After
      shell: bash
      run: |
        set -euo pipefail
        echo "Disk space after:"
        df -h

    - name: Setup Build Environment
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
        KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
        mkdir -p "$KERNEL_ROOT"

        cat >> $GITHUB_ENV << EOF
        DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
        CONFIG=$CONFIG
        KERNEL_ROOT=$KERNEL_ROOT
        SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
        KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
        ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
        REPO=$GITHUB_WORKSPACE/git-repo/repo
        EOF
        
        mkdir -p "$GITHUB_WORKSPACE/git-repo"
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
        chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
        echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

    - name: Install Minimal Dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Install dependencies"
        sudo apt-get -o Acquire::Retries=3 update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          git curl ca-certificates build-essential clang lld flex bison \
          libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
          libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix llvm
        sudo apt-get clean
        echo "✅ Dependencies installed"
        echo "::endgroup::"

    - name: 🏷️ Set Build Identity
      shell: bash
      run: |
        set -euo pipefail
        echo "BUILD_USER=TheFloresto" >> "$GITHUB_ENV"
        echo "BUILD_HOST=ubuntu-build" >> "$GITHUB_ENV"
        echo "BUILD_TIMESTAMP=Sun Jun 15 14:56:02 UTC 2025" >> "$GITHUB_ENV"

    - name: Clone AnyKernel3 and Other Dependencies
      shell: bash
      run: |
        set -euo pipefail
        ANYKERNEL_BRANCH="gki-2.0"
        git clone https://github.com/TheFloresto/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
        rm -rf AnyKernel3/.git
        git clone https://github.com/TheFloresto/kernel_patches.git

    - name: Initialize and Sync Kernel Source
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"

        repo init -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16 --depth=1

        REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
        DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
        if grep -q deprecated <<< $REMOTE_BRANCH; then
          sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
        fi

        repo --trace sync -c -j$(nproc --all) --fail-fast --no-tags --force-sync --no-clone-bundle

    - name: Extract Sublevel and Set File Name
      shell: bash
      run: |
        set -euo pipefail
        ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
        if [ -f "$KERNEL_ROOT/common/Makefile" ]; then
          EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
          [ -n "$EXTRACTED" ] && ACTUAL_SUBLEVEL="$EXTRACTED"
        fi
        
        echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV

    - name: Detect Clang
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Detect Clang"
        
        CLANG_FOUND=false
        
        # Search for prebuilt clang
        for base in "$KERNEL_ROOT/prebuilts" "$KERNEL_ROOT/prebuilts-master"; do
          [ -d "$base/clang/host/linux-x86" ] || continue
          latest=$(ls -d "$base"/clang/host/linux-x86/clang-r*/ 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
            CLANG_BIN="$latest/bin"
            CLANG_FOUND=true
            break
          fi
        done
        
        # Fallback to system clang
        if ! $CLANG_FOUND && command -v clang >/dev/null 2>&1; then
          CLANG_BIN="$(dirname "$(command -v clang)")"
          CLANG_FOUND=true
          echo "Using system clang."
        fi
        
        $CLANG_FOUND || { echo "::error::No clang toolchain found"; exit 1; }
        
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
        
        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
        echo "✅ Detected Clang: $CLANG_VERSION"
        echo "::endgroup::"

    - name: Derive Clang Short Version
      shell: bash
      run: |
        set -euo pipefail
        short="$("${CLANG_BIN_PATH}/clang" --version | sed -n '1s/.*clang-r\([0-9.]\+\).*/\1/p')"
        
        if [ -z "$short" ]; then
          short="$("${CLANG_BIN_PATH}/clang" --version | sha256sum | cut -c1-8)"
          echo "⚠️ Could not extract clang-r version, using hash: $short"
        else
          echo "✅ Clang version fingerprint: $short"
        fi
        
        echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"

    - name: Set Cache Environment
      shell: bash
      run: |
        set -euo pipefail
        CACHE_DIR="$HOME/.ccache"
        echo "CCACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
        echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
        mkdir -p "$CACHE_DIR"

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-floresto-v1-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ env.CLANG_VERSION_SHORT }}
        restore-keys: |
          ccache-floresto-v1-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
          ccache-floresto-v1-${{ inputs.android_version }}-

    - name: Configure ccache
      shell: bash
      run: |
        set -euo pipefail
        export CCACHE_DIR="$HOME/.ccache"
        export CCACHE_MAXSIZE="1G"
        
        ccache -M "$CCACHE_MAXSIZE"
        ccache -o compression=true
        ccache -o compression_level=3
        ccache -o direct_mode=true
        ccache -o hash_dir=false
        ccache -o file_clone=true
        ccache -o inode_cache=true
        
        export CCACHE_COMPILERCHECK="content"
        export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
        export CCACHE_NOHASHDIR="true"
        
        {
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          echo "CCACHE_NOHASHDIR=true"
        } >> "$GITHUB_ENV"

    - name: Apply glibc 2.38 Compatibility Fix
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 186 ]] || 
           [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 119 ]] || 
           [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 110 ]] || 
           [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $ACTUAL_SUBLEVEL -le 43 ]]; then
          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}') 
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then 
            cd "$KERNEL_ROOT/common"
            sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
            if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 186 ]] || 
               [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 119 ]] || 
               [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 110 ]]; then
              sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
            fi
          fi
        fi

    - name: Fix Less Than 6.6.50 Builds
      if: inputs.android_version == 'android15' && inputs.kernel_version == '6.6'
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
        fi

    - name: Apply ptrace patch for older kernels
      if: fromJSON(inputs.kernel_version) < 5.16
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        set -euo pipefail
        patch -p1 -F 3 < "$KERNEL_PATCHES/gki_ptrace.patch"

    - name: Add KernelSU
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        case "${{ inputs.ksu_variant }}" in
          WKSU)
            echo "Adding WKSU..."
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
            fi
            ;;
          KSU)
            echo "Adding KernelSU Official..."
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            fi
            ;;
          Next)
            echo "Adding KernelSU Next..."
            if [ "${{ inputs.ksu_commit }}" == "wild" ]; then
              curl -LSs "https://raw.githubusercontent.com/WildKernels/KernelSU-Next/wild/kernel/setup.sh" | bash -s wild
            elif [ "${{ inputs.ksu_commit }}" == "pershoot" ]; then
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              cd KernelSU-Next
              git restore --source=5aad87b3c6319330d6991ba4c937e44e50fe16f5^ -- kernel/Kbuild
            elif [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -
            fi
            ;;
          SukiSU)
            echo "Adding KernelSU SukiSU..."
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
            fi
            ;;
          MKSU)
            echo "Adding KernelSU MKSU..."
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main
            fi
            ;;
          RKSU)
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main
            fi              
            ;;
          KowXU)
            echo "Adding KowXU..."
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s master
            fi
            ;;
        esac

    - name: Getting KernelSU Version
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        
        # Determine KSU directory and base version based on variant
        case "${{ inputs.ksu_variant }}" in
          WKSU)
            echo "Getting WKSU version..."
            KSU_DIR="./Wild_KSU"
            BASE_VERSION=10200
            ;;
          KSU)
            echo "Getting Official KernelSU version..."
            KSU_DIR="./KernelSU"
            BASE_VERSION=30000
            ;;
          Next)
            echo "Getting Next version..."
            KSU_DIR="./KernelSU-Next"
            BASE_VERSION=30000
            ;;
          Sukisu)
            echo "Getting SukiSU version..."
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git -b main SukiSU-Ultra
            KSU_DIR="./SukiSU-Ultra"
            BASE_VERSION=37185           
            ;;
          MKSU)
            echo "Getting MKSU version..."
            KSU_DIR="./KernelSU"
            BASE_VERSION=30000
            ;;
          RKSU)
            echo "Getting RKSU version..."
            KSU_DIR="./KernelSU"
            BASE_VERSION=30000
            ;;            
          KowXU)
            echo "Getting KowXU version..."
            KSU_DIR="./KernelSU"
            BASE_VERSION=30000       
            ;;
          *)
            echo "ERROR: Unknown KSU variant: ${{ inputs.ksu_variant }}"
            exit 1
            ;;
        esac
        
        # Verify directory exists
        if [ ! -d "$KSU_DIR" ]; then
          echo "ERROR: KSU directory not found: $KSU_DIR"
          echo "Available directories:"
          ls -la
          exit 1
        fi
        
        # Change to KSU directory
        cd "$KSU_DIR"
        
        # Verify it's a git repository
        if [ ! -d ".git" ]; then
          echo "ERROR: Not a git repository: $KSU_DIR"
          exit 1
        fi
        
        # Get commit count and calculate version
        COMMIT_COUNT=$(git rev-list --count HEAD)
        echo "Commits: $COMMIT_COUNT"
        KSU_VERSION=$(expr $COMMIT_COUNT + $BASE_VERSION)
        echo "KSUVER=$KSU_VERSION"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        
        # Get commit SHA
        KSU_COMMIT_SHA=$(git rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV
        echo "KSU commit: ${KSU_COMMIT_SHA:0:8}"
        
        # Return to parent directory
        cd ..

    - name: Set file name
      shell: bash
      run: |
        set -euo pipefail        
        ARTIFACT_BASE="${{ inputs.ksu_variant }}-${{ env.KSUVER }}-${{ inputs.kernel_version }}.$ACTUAL_SUBLEVEL-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ matrix.build_type }}"      
        echo "ARTIFACT_BASE=$ARTIFACT_BASE" >> $GITHUB_ENV
        echo "FILE_NAME=$ARTIFACT_BASE" >> $GITHUB_ENV

    - name: Clone & Apply SUSFS Patches for KernelSU Variants
      shell: bash
      run: |
        set -euo pipefail
        SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
        cd susfs4ksu
        TARGET="${{ inputs.android_version }}-${{ inputs.kernel_version }}"
        COMMIT=""
        case "${{ inputs.ksu_variant }}" in
          WKSU)
            SUSFS_VERSION="1.5.12"
            case "$TARGET" in 
              android12-5.10) COMMIT="8a76ba240d1f7315352b49d97d854a4b166e5b47" ;;
              android13-5.10) COMMIT="e5c9eabfc6dcfc677d11f46ce1d5ff786de60a92" ;;
              android13-5.15) COMMIT="babf6be195576f09aae79650d47abf6a76e8a21b" ;;
              android14-5.15) COMMIT="19f339e804ba9aebd9c6d735b965e2b9396c73ae" ;;
              android14-6.1) COMMIT="a162e2469d0b472545e5e46457eee171c0975fb0" ;;
              android15-6.6) COMMIT="f450ec00bf592d080f59b01ff6f9242456c9a427" ;;
            esac
            git checkout "$COMMIT"
            ;;
          Next)
            SUSFS_VERSION="2.0.0"
            ;;
          KSU|SukiSU|MKSU|RKSU|KowXU)
            SUSFS_VERSION="2.0.0"
            echo "Not Needed"
            ;;
        esac

        case "${{ inputs.ksu_variant }}" in
          WKSU)
            cd "$KERNEL_ROOT/Wild_KSU"
            ;;
          Next)
            echo "Applying Next-specific SUSFS patches"
            cd "$KERNEL_ROOT/KernelSU-Next"
            ;;
          KSU)
            cd "$KERNEL_ROOT/KernelSU"        
            cp -v "$KERNEL_PATCHES/ksu/20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch" ./
            patch -p1 --forward < 20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch || true
            ;;
          KowXU)
            cd "$KERNEL_ROOT/KernelSU"           
            cp -v "$KERNEL_PATCHES/kowsu/20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch" ./
            patch -p1 --forward < 20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch || true
            ;;
          SukiSU)
            cd "$KERNEL_ROOT/KernelSU"  
            # Your KSU-specific code goes here
            ;;
          MKSU)      
            cd "$KERNEL_ROOT/KernelSU"           
            cp -v "$KERNEL_PATCHES/mksu/20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch" ./
            patch -p1 --forward < 20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch || true
            ;;
          RKSU)      
            cd "$KERNEL_ROOT/KernelSU"           
            cp -v "$KERNEL_PATCHES/mksu/20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch" ./
            patch -p1 --forward < 20-KernelSU-Spoof-LKM-mode-to-suppress-manager-warning.patch || true          
            ;;
        esac

    - name: Apply Module Check Bypass
      if: ${{ matrix.build_type == 'Bypass' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" || "${{ inputs.kernel_version }}" == "6.12" ]]; then
          TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"
        else
          TARGET_FILE="$KERNEL_ROOT/common/kernel/module.c"
        fi

        echo "Applying bypass to $TARGET_FILE"
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        if grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "SUCCESS: Module check bypass verified"
        else
          echo "FAILED: Module check bypass not found"
          exit 1
        fi

    - name: Configure Kernel Options
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        cat >> "${{ env.DEFCONFIG }}" << 'EOF'
        # Kprobes (required for KernelSU)
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y

        # KernelSU Configuration
        CONFIG_KSU=y
        CONFIG_KSU_DEBUG=n

        # Mountify Support
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        
        # Networking Configuration
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        
        # BBR TCP Congestion Control
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_NET_SCH_FQ_CODEL=y
        CONFIG_TCP_CONG_BIC=n
        CONFIG_TCP_CONG_WESTWOOD=n
        CONFIG_TCP_CONG_HTCP=n
        
        # IPSet Support
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=65534
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPMARK=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_IPMAC=y
        CONFIG_IP_SET_HASH_MAC=y
        CONFIG_IP_SET_HASH_NETPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_IP_SET_LIST_SET=y

        # CAKE Queue Discipline
        CONFIG_NET_SCH_CAKE=y
        
        # Build Optimization
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n
        CONFIG_OPTIMIZE_INLINING=y
        CONFIG_FRAME_WARN=0
        CONFIG_TRACEPOINTS=y
        EOF

        # Remove check_defconfig based on version
        if [[ "${{ inputs.android_version }}" == "android16" && "${{ inputs.kernel_version }}" == "6.12" ]]; then
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
        else
          sed -i 's/check_defconfig//' ./common/build.config.gki
        fi

    - name: Configure KSU
      if: ${{ inputs.ksu_variant == 'KSU' }}
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        cat >> "${{ env.DEFCONFIG }}" << 'EOF'
        # KSU Support
        CONFIG_KSU_KPROBES_HOOK=n
        CONFIG_KSU_ALLOWLIST_WORKAROUND=n
        CONFIG_KSU_LSM_SECURITY_HOOKS=y
        EOF

    - name: Configure MKSU
      if: ${{ inputs.ksu_variant == 'MKSU' }}
