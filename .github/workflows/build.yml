name: Kernel Build Process
permissions:
  contents: write
  actions: write 

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string

jobs:
  build-gki:
    name: "${{ inputs.kernelsu_variant }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ matrix.apply_bypass }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        apply_bypass: ["normal", "bypass"]

    steps:
      - name: Check Initial Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Initial Total Disk Space in GB ====="
          df -BG
          
      - name: Download Apache Arrow's util_free_space.sh
        shell: bash
        run: |
          set -euo pipefail
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Setup Additional SWAP
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Current Memory Status ====="
          free -h
          echo "===== Current SWAP Status ====="
          swapon --show || true
          
          echo "===== Setting up 15GB SWAP file ====="
          sudo swapoff -a || true
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 1 /swapfile
          
          echo "===== Configuring SWAP parameters ====="
          echo 'vm.swappiness=1' | sudo tee -a /etc/sysctl.conf
          echo 'vm.vfs_cache_pressure=50' | sudo tee -a /etc/sysctl.conf
          echo 'vm.overcommit_memory=1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          
          echo "===== New Memory Status ====="
          free -h
          echo "===== New SWAP Status ====="
          swapon --show
          
      - name: Check Disk Space After Cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Total Disk Space After Cleanup in GB ====="
          df -BG

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libdw-dev pahole
          sudo apt-get clean
          echo "✅ Dependencies installed"
          echo "::endgroup::"
          
      - name: Set CONFIG Environment Variable
        shell: bash
        run: |
          set -euo pipefail
          # Set CONFIG dynamically based on inputs values
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Setup Build Environment
        shell: bash
        run: |
          set -euo pipefail
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-2025
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools &
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg &
          wait
          
          echo "AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool" >> $GITHUB_ENV
          echo "MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py" >> $GITHUB_ENV
          echo "UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py" >> $GITHUB_ENV
          echo "BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin:$PATH" >> $GITHUB_ENV
          
          mkdir -p ./git-repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ./git-repo/repo
          chmod a+rx ./git-repo/repo
          echo "REPO=$GITHUB_WORKSPACE/./git-repo/repo" >> $GITHUB_ENV

      - name: Set boot sign key
        shell: bash
        env:
          BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
        run: |
          set -euo pipefail
          if [ ! -z "$BOOT_SIGN_KEY" ]; then
            echo "$BOOT_SIGN_KEY" > ./kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          fi

      - name: Clone AnyKernel3 and Other Dependencies
        shell: bash
        run: |
          set -euo pipefail
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          
          git clone https://github.com/TheFloresto/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          git clone https://github.com/TheFloresto/kernel_patches.git -b main
          git clone https://github.com/ShirkNeko/SukiSU_patch.git -b main       
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"

      - name: Initialize and Sync Kernel Source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CONFIG"
          cd "$CONFIG"
          
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          
          $REPO init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16
          
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi
          
          $REPO --trace sync -c -j$(nproc --all) --no-tags --fail-fast

      - name: Clean Up ABI Protected Exports
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Clean up ABI protected exports"
          cd "$CONFIG"
          
          # Remove ABI protected export files
          echo "Removing ABI protected export files..."
          rm -f common/android/abi_gki_protected_exports_* || true
          
          # Also remove from BUILD.bazel if it exists
          if [ -f common/BUILD.bazel ]; then
            echo "Cleaning BUILD.bazel..."
            perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' common/BUILD.bazel 2>/dev/null || true
          fi
          
          echo "✅ ABI protected exports cleaned"
          echo "::endgroup::"
          
      - name: Check Directory Space Usage
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Total Disk Space After Kernel Download in GB ====="
          df -BG
          
          echo "===== Directory Space Usage in GB ====="
          du -BG -d 1 | sort -nr
          
          echo "===== $CONFIG Directory Space Usage in GB ====="
          cd "$CONFIG"
          du -BG -d 2 | sort -nr

      - name: Extract Actual Sublevel
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          
          if [ -f "Makefile" ]; then
            ACTUAL_SUBLEVEL=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
            
            if [ -n "$ACTUAL_SUBLEVEL" ]; then
              echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
              echo "Extracted ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL; no directory changes performed."
            else
              echo "Warning: SUBLEVEL not found in Makefile; continuing with inputs.sub_level."
            fi
          fi

      - name: Detect Clang Toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Detect Clang"
          cd "$CONFIG"
          
          # Check for prebuilt clang in kernel source
          CLANG_FOUND=false
          for base in prebuilts prebuilts-master; do
            [ -d "$base/clang/host/linux-x86" ] || continue
            latest=$(ls -d "$base"/clang/host/linux-x86/clang-r*/ 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
              CLANG_BIN="$latest/bin"
              CLANG_FOUND=true
              break
            fi
          done
          
          # Fallback to system clang if not found
          if ! $CLANG_FOUND && command -v clang >/dev/null 2>&1; then
            CLANG_BIN="$(dirname "$(command -v clang)")"
            CLANG_FOUND=true
            echo "Using system clang."
          fi
          
          $CLANG_FOUND || { echo "::error::No clang toolchain found"; exit 1; }
          echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
          
          CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
          echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
          echo "✅ Detected Clang: $CLANG_VERSION"
          echo "::endgroup::"

      - name: Derive Clang Short Version
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Derive Clang fingerprint"
          
          short="$("${CLANG_BIN_PATH}/clang" --version | sed -n '1s/.*clang-r\([0-9.]\+\).*/\1/p')"
          
          if [ -z "$short" ]; then
            short="$("${CLANG_BIN_PATH}/clang" --version | sha256sum | cut -c1-8)"
            echo "⚠️ Could not extract clang-r version, using hash: $short"
          else
            echo "✅ Clang version fingerprint: $short"
          fi
          
          echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"
          
          CLANG_FULL_VERSION="$("${CLANG_BIN_PATH}/clang" --version | head -n1)"
          echo "CLANG_FULL_VERSION=$CLANG_FULL_VERSION" >> "$GITHUB_ENV"
          
          echo "Full Clang version: $CLANG_FULL_VERSION"
          echo "::endgroup::"

      - name: Setup ccache Environment
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Configure ccache environment"
          
          CACHE_DIR="$HOME/.ccache"
          echo "CCACHE_DIR=$CACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          
          mkdir -p "$CACHE_DIR"
          
          echo "Cache configuration:"
          echo "  Directory: $CACHE_DIR"
          echo "  Max size: 2G"
          echo "  Android: ${{ inputs.android_version }}"
          echo "  Kernel: ${{ inputs.kernel_version }}.$ACTUAL_SUBLEVEL"
          echo "  Clang: ${CLANG_VERSION_SHORT:-unknown}"
          echo "::endgroup::"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gki-v3-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ env.ACTUAL_SUBLEVEL }}-${{ env.CLANG_VERSION_SHORT }}
          restore-keys: |
            ccache-gki-v3-${{ inputs.android_version }}-${{ inputs.kernel_version }}-
            ccache-gki-v3-${{ inputs.android_version }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Configure ccache for maximum performance"
          
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE="2G"
          
          ccache -M "$CCACHE_MAXSIZE"
          
          export CCACHE_COMPILERCHECK="content"
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          export CCACHE_NOHASHDIR="true"
          
          ccache -o compression=true
          ccache -o compression_level=3
          ccache -o direct_mode=true
          ccache -o hash_dir=false
          ccache -o file_clone=true
          ccache -o inode_cache=true
          ccache -o umask=002
          
          if ccache --help 2>&1 | grep -q 'depend_mode'; then
            ccache -o depend_mode=true
          fi
          
          ccache -o sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale
          
          export CCACHE_IGNOREOPTIONS="--sysroot*"
          
          {
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_IGNOREOPTIONS=$CCACHE_IGNOREOPTIONS"
          } >> "$GITHUB_ENV"
          
          echo "✅ ccache configured for production"
          echo ""
          
          if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "✅ Restored cache found"
            echo ""
            echo "Pre-build cache statistics:"
            ccache -s | head -n 20
          else
            echo "⚠️ No existing cache - building from scratch"
          fi
          
          echo "::endgroup::"

      - name: Apply glibc 2.38 Compatibility Fix
        shell: bash
        run: |
          set -euo pipefail
          # Use ACTUAL_SUBLEVEL for LTS builds, otherwise use the input sub_level
          
          if ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $ACTUAL_SUBLEVEL <= 186 ))) || 
              ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 119 ))) || 
              ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 110 ))) || 
              ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "6.1" ]] && (( $ACTUAL_SUBLEVEL <= 43 ))); then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}') 
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then 
              cd $CONFIG/common/
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
              if ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $ACTUAL_SUBLEVEL <= 186 ))) || 
                  ([[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 119 ))) || 
                  ([[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( $ACTUAL_SUBLEVEL <= 110 ))); then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
              # Полный патч для resolve_btfids
              cat > tools/bpf/resolve_btfids/resolve_btfids_glibc_fix.patch << 'EOF'
--- a/tools/bpf/resolve_btfids/resolve_btfids.c
+++ b/tools/bpf/resolve_btfids/resolve_btfids.c
@@ -123,6 +123,7 @@ static int parse_syms_cb(void *data, const char *name, Elf64_Sym *sym)
 	if (!sym->st_value)
 		return 0;

+	fprintf(stderr, "DEBUG: Processing symbol %s\n", name); // Debug
 	if (sym->st_shndx == SHN_UNDEF || sym->st_shndx == SHN_ABS)
 		return 0;

 	if (ELF64_ST_TYPE(sym->st_info) != STT_FUNC &&
 	    ELF64_ST_TYPE(sym->st_info) != STT_OBJECT)
 		return 0;

 	/* Ignore .L symbols */
 	if (name[0] == '.')
 		return 0;

 	return add_symbol(data, name, sym->st_value, sym->st_size);
 }
EOF
              patch -p1 < tools/bpf/resolve_btfids/resolve_btfids_glibc_fix.patch || true  # Fallback если не применяется
           
              echo "PAHOLE_FLAGS=--skip_encoding_btf_vars --skip_encoding_btf_type_tag --skip_encoding_btf_decl_tag --btf_dump_no_prefix --btf_vars" >> $GITHUB_ENV
            fi
          fi 

      - name: Fix Less Then 6.6.50 Builds
        if: inputs.android_version == 'android15' && inputs.kernel_version == '6.6'
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
              sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi

      - name: Apply ptrace patch for older kernels
        if: fromJSON(inputs.kernel_version) < 5.16
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          patch -p1 -F 3 < "../../kernel_patches/gki_ptrace.patch"

      - name: Determine the branch for KernelSU
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.kernelsu_branch }}" in
            "Stable")
              if [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
                echo "BRANCH=-s susfs-main" >> $GITHUB_ENV
              else
                echo "BRANCH=-" >> $GITHUB_ENV
              fi
              ;;
            "Dev")
              if [[ "${{ inputs.kernelsu_variant }}" =~ ^(KSU|MKSU)$ ]]; then
                echo "BRANCH=-s main" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "NEXT" ]]; then
                echo "BRANCH=-s next" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "WKSU" ]]; then
                echo "BRANCH=-s wild" >> $GITHUB_ENV
              elif [[ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]]; then
                echo "BRANCH=-s susfs-test" >> $GITHUB_ENV
              fi
              ;;
            "Other")
              if [[ -n "${{ inputs.kernelsu_branch_other }}" ]]; then
                echo "BRANCH=-s ${{ inputs.kernelsu_branch_other }}" >> $GITHUB_ENV
              else
                echo "Error: Custom branch not provided for 'Other'" >&2
                exit 1
              fi
              ;;
          esac

      - name: Add KernelSU
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
      
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Adding WKSU..."
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "KSU")
              echo "Adding KernelSU Official..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "NEXT")
              echo "Adding KernelSU Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
            "SukiSU")
              echo "Adding KernelSU SukiSU..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash ${{ env.BRANCH }}       
              ;;
            "MKSU")
              echo "Adding KernelSU MKSU..."
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash ${{ env.BRANCH }}
              ;;
          esac
          
      - name: Getting KernelSU Version
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Getting WKSU version..."
              cd ./Wild_KSU
              BASE_VERSION=10200
              ;;
            "KSU")
              echo "Getting Official KernelSU version..."
              cd ./KernelSU
              BASE_VERSION=10200
              ;;
            "NEXT")
              echo "Getting NEXT version..."
              cd ./KernelSU-Next
              BASE_VERSION=10200
              ;;
            "SukiSU")
              echo "Getting SukiSU version... "
              git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
              cd SukiSU-Ultra/kernel
              BASE_VERSION=10700  
              ;;
            "MKSU")
              echo "Getting MKSU version..."   
              cd ./KernelSU
              BASE_VERSION=10200           
              ;;
          esac
          COMMIT_COUNT=$(/usr/bin/git rev-list --count HEAD)
          echo "Commits: $COMMIT_COUNT"
          KSU_VERSION=$(expr $COMMIT_COUNT "+" $BASE_VERSION)
          echo "KSUVER=$KSU_VERSION"
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

      - name: Apply SUSFS Patches for KernelSU Variants
        shell: bash
        run: |
          set -eo pipefail
          cd "$CONFIG"
          
          # Apply compatibility fixes
          SUSFS_VERSION="1.5.12"

          cp -v ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp -v ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          # Apply core SUSFS patches
          cp -v ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cd common

          # Pre-SUSFS sed safeguards removed; moved below core patch

          # Apply SUSFS core patch
          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true

          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Applying SUSFS patches for WKSU..."
              cd ../Wild_KSU
              cp -v ../../kernel_patches/next/0001-Susfs-1.5.9.patch ./
              patch -p1 --forward < 0001-Susfs-1.5.9.patch      

              cp -v ../../kernel_patches/next/0001-james.patch ./
              patch -p1 --forward < 0001-james.patch 
              ;;
            "KSU")
              echo "Applying SUSFS patches for Official KernelSU..."
              cd ../KernelSU
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true          
              ;;
            "NEXT")
              echo "Applying SUSFS patches for KernelSU Next..."           
              # Post-SUSFS sed safeguards for task_mmu.c 'goto show_pad' handling
              if ( ( [[ "${{ inputs.android_version }}" == "android12" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $ACTUAL_SUBLEVEL <= 209 )) ) \
               || ( [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && [[ "${{ inputs.os_patch_level }}" != "2024-05" ]] && (( $ACTUAL_SUBLEVEL <= 209 )) ) \
               || ( [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && [[ "${{ inputs.os_patch_level }}" != "2024-05" ]] && (( $ACTUAL_SUBLEVEL <= 148 )) ) \
               || ( [[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && [[ "${{ inputs.os_patch_level }}" != "2024-05" ]] && (( $ACTUAL_SUBLEVEL <= 148 )) ) \
               || ( [[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "6.1" ]] && [[ "${{ inputs.os_patch_level }}" != "2024-05" ]] && (( $ACTUAL_SUBLEVEL <= 75 )) ) ); then
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
             fi

              # Apply additional SUSFS patches for Android 13 5.15 compatibility
              if [[ "${{ inputs.android_version }}" == "android13" ]] && [[ "${{ inputs.kernel_version }}" == "5.15" ]] && (( ${{ inputs.sub_level }} <= 41 )); then
                cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_fdinfo.c.patch ./
                patch -p1 < fix_fdinfo.c.patch || true
                cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_namespace.c.patch ./
                patch -p1 < fix_namespace.c.patch || true
                cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_open.c.patch ./
                patch -p1 < fix_open.c.patch || true
                sed -i 's/i_uid_into_mnt(i_user_ns(inode), inode)/i_uid_into_mnt(inode->i_sb->s_user_ns, inode)/g' fs/susfs.c
              fi

              # Use ACTUAL_SUBLEVEL for LTS or actual kernel sublevel if available
              if ( [[ "${{ inputs.android_version }}" == "android12" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $ACTUAL_SUBLEVEL <= 43 )) ) \
               || ( [[ "${{ inputs.android_version }}" == "android14" ]] && [[ "${{ inputs.kernel_version }}" == "6.1" ]] && (( $ACTUAL_SUBLEVEL >= 145 )) ) \
               || ( [[ "${{ inputs.android_version }}" == "android15" ]] && [[ "${{ inputs.kernel_version }}" == "6.6" ]] && (( $ACTUAL_SUBLEVEL >= 98 )) ); then
               cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/1_fix_base.c.patch ./
               patch -p1 < 1_fix_base.c.patch || true
              fi

              if [[ "${{ inputs.android_version }}" == "android12" ]] && [[ "${{ inputs.kernel_version }}" == "5.10" ]] && (( $ACTUAL_SUBLEVEL <= 43 )); then
                cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/2_fix_base.c.patch ./
                patch -p1 < 2_fix_base.c.patch || true
              fi

             if ( [[ "${{ inputs.android_version }}" == "android15" ]] && [[ "${{ inputs.kernel_version }}" == "6.6" ]] && (( $ACTUAL_SUBLEVEL <= 58 )) ); then
                cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_task_mmu.c.patch ./
                patch -p1 < fix_task_mmu.c.patch || true
             fi

              # Apply KSU integration patches
              cd ../KernelSU-Next
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch .
              patch -p1 < 10_enable_susfs_for_ksu.patch || true
          
              cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_core_hook.c.patch ./
              patch -p1 < fix_core_hook.c.patch

              cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_sucompat.c.patch ./
              patch -p1 < fix_sucompat.c.patch

              cp -v ../../kernel_patches/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_kernel_compat.c.patch ./
              patch -p1 < fix_kernel_compat.c.patch

              cp -v ../../kernel_patches/next/0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch ./
              patch -p1 --forward < 0001-add-only-WKSU-and-MKSU-managers-and-KSUN.patch     
              ;;
            "SukiSU")
              echo "Applying SUSFS patches for SukiSU..."
              cd ../KernelSU              
              ;;
            "MKSU")
              echo "Applying SUSFS patches for MKSU..."
              cd ../KernelSU
              cp -v ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
              patch -p1 --forward < 10_enable_susfs_for_ksu.patch || true          
              ;;
          esac

      - name: Apply Hooks Patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG/common"
          case "${{ inputs.kernelsu_variant }}" in
            "WKSU")
              echo "Applying hooks for WKSU..."
              cp -v ../../kernel_patches/next/60_scope-minimized_manual_hooks.patch ./
              patch -p1 --forward -F 3 < 60_scope-minimized_manual_hooks.patch
              ;;
            "KSU")
              echo "Applying hooks for Official KernelSU..."
              cp -v ../../kernel_patches/sultan/ksu_hooks.patch ./
              patch -p1 --forward -F 3 < ksu_hooks.patch
              ;;
            "NEXT")
              echo "Applying hooks for KernelSU-Next..."
              cp -v ../../kernel_patches/next/scope_min_manual_hooks_v1.4.patch ./
              patch -p1 --forward -F 3 < scope_min_manual_hooks_v1.4.patch
              ;;
            "SukiSU")
              echo "Applying hooks for SukiSU..."          
              cp -v ../../kernel_patches/suki/scope_min_manual_hooks_v1.6.patch ./
              patch -p1 --forward -F 3 < scope_min_manual_hooks_v1.6.patch
              ;;
            "MKSU")
              echo "Applying hooks for MKSU..."
              cp -v ../../kernel_patches/sultan/ksu_hooks.patch ./
              patch -p1 --forward -F 3 < ksu_hooks.patch             
              ;;
          esac 

      - name: Scan and collect patch rejects
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_DIR="$CONFIG"
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"
          # Find all .rej files under the configuration directory
          mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              # Relative path from $CONFIG
              REL="${REJ#"$CONFIG_DIR"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"
              # Copy the associated original file alongside the .rej
              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
                mkdir -p "$(dirname "$ORIG_DEST")"
                cp "$ORIG" "$ORIG_DEST"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Add BBG
        shell: bash
        run: |
          set -euo pipefail
          cd "$CONFIG"
          echo "Adding BBG..."
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' common/security/Kconfig

      - name: Apply Module Check Bypass
        if: ${{ matrix.apply_bypass == 'bypass' }}
