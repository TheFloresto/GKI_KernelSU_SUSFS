name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      ksu_variant:
        required: true
        type: string
      ksu_commit:
        required: false
        type: string
      susfs_enabled:
        required: false
        type: boolean
        default: true

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Build Summary
      run: |
        echo "========================================"
        echo "       Kernel Build Summary"
        echo "========================================"
        echo "Android Version : ${{ inputs.android_version }}"
        echo "Kernel Version  : ${{ inputs.kernel_version }}"
        echo "Sub Level       : ${{ inputs.sub_level }}"
        echo "Patch Level     : ${{ inputs.os_patch_level }}"
        echo "KSU Variant     : ${{ inputs.ksu_variant }}"
        echo "KSU Commit      : ${{ inputs.ksu_commit || 'Default' }}"
        echo "SUSFS Enabled   : ${{ inputs.susfs_enabled }}"
        echo "Variant         : ${{ inputs.variant || 'Standard' }}"
        echo "========================================"

    - name: Maximize Build Space
      run: |
        curl -Ls https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh | bash

    - name: Setup Build Environment
      run: |
        CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
        KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
        mkdir -p "$KERNEL_ROOT"

        cat >> $GITHUB_ENV << EOF
        DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
        CONFIG=$CONFIG
        KERNEL_ROOT=$KERNEL_ROOT
        SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
        KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
        ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
        REPO=$GITHUB_WORKSPACE/git-repo/repo
        CCACHE_DIR=$HOME/.ccache
        EOF
        
        mkdir -p "$GITHUB_WORKSPACE/git-repo"
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
        chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
        echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

    - name: Clone AnyKernel3 and Other Dependencies
      run: |
        ANYKERNEL_BRANCH="gki-2.0"

        # Random delay to avoid rate limiting
        DELAY=$((1 + RANDOM % 10))
        echo "Sleeping for $DELAY seconds..."
        sleep $DELAY

        git clone https://github.com/TheFloresto/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
        rm -rf AnyKernel3/.git
        git clone https://github.com/TheFloresto/kernel_patches.git

    - name: Initialize and Sync Kernel Source
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"

        repo init -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16

        REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
        DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
        if grep -q deprecated <<< $REMOTE_BRANCH; then
          sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
        fi

        repo --trace sync -j$(nproc --all) --fail-fast

    - name: Extract Sublevel and Set File Name
      run: |
        ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
        if [ -f "$KERNEL_ROOT/common/Makefile" ]; then
          EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
          [ -n "$EXTRACTED" ] && ACTUAL_SUBLEVEL="$EXTRACTED"
        fi

        ARTIFACT_BASE="${{ inputs.kernel_version }}.$ACTUAL_SUBLEVEL-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
        echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
        echo "ARTIFACT_BASE=$ARTIFACT_BASE" >> $GITHUB_ENV
        echo "FILE_NAME=$ARTIFACT_BASE" >> $GITHUB_ENV

    - name: Apply glibc 2.38 Compatibility Fix
      run: |
        if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 186 ]] || 
           [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 119 ]] || 
           [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 110 ]] || 
           [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $ACTUAL_SUBLEVEL -le 43 ]]; then
          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}') 
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then 
            cd "$KERNEL_ROOT/common"
            sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
            if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 186 ]] || 
               [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 119 ]] || 
               [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "5.15" && $ACTUAL_SUBLEVEL -le 110 ]]; then
              sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
            fi
          fi
        fi 

    - name: Fix Less Then 6.6.50 Builds
      if: inputs.android_version == 'android15' && inputs.kernel_version == '6.6'
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
        fi

    - name: Apply ptrace patch for older kernels
      if: fromJSON(inputs.kernel_version) < 5.16 && false
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        patch -p1 -F 3 < "$KERNEL_PATCHES/gki_ptrace.patch"

    - name: Detect Clang Toolchain
      run: |
        set -euo pipefail
        echo "::group::Detect Clang"
        KP="$KERNEL_ROOT"
        CLANG_FOUND=false
        for base in "$KP/prebuilts" "$KP/prebuilts-master"; do
          [ -d "$base/clang/host/linux-x86" ] || continue
          latest=$(ls -d "$base"/clang/host/linux-x86/clang-r*/ 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
            CLANG_BIN="$latest/bin"
            CLANG_FOUND=true
            break
          fi
        done
        if ! $CLANG_FOUND && command -v clang >/dev/null 2>&1; then
          CLANG_BIN="$(dirname "$(command -v clang)")"
          CLANG_FOUND=true
          echo "Using system clang."
        fi
        $CLANG_FOUND || { echo "::error::No clang toolchain found"; exit 1; }
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
        echo "✅ Detected Clang: $CLANG_VERSION"
        echo "::endgroup::"

    - name: Setup CCache
      run: |
        mkdir -p "$CCACHE_DIR"
        export CCACHE_COMPRESS=true
        export CCACHE_COMPRESSLEVEL=6
        export CCACHE_MAXSIZE=50G
        export CCACHE_SLOPPINESS="include_file_ctime,include_file_mtime,time_macros"
        ccache -M 50G
        echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
        echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=50G" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=include_file_ctime,include_file_mtime,time_macros" >> $GITHUB_ENV

    - name: Add KernelSU Variant
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        case "${{ inputs.ksu_variant }}" in
          WKSU)
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
            fi
            ;;
          Next)
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            elif [ "${{ inputs.ksu_commit }}" == "wild" ]; then
              curl -LSs "https://raw.githubusercontent.com/WildKernels/KernelSU-Next/wild/kernel/setup.sh" | bash -s wild
            elif [ "${{ inputs.ksu_commit }}" == "pershoot" ]; then
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -
              sed -i '/ifneq (\$(CONFIG_KPROBES),y)/i $(warning KBUILD CHECK: KSU=$(CONFIG_KSU) KSU_SUSFS=$(CONFIG_KSU_SUSFS) KPROBES=$(CONFIG_KPROBES))' KernelSU-Next/kernel/Kbuild
            else
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -
            fi
            ;;
          KSU)
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            fi
            ;;
          RKSU)
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main
            fi
            ;;
          MKSU)
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main
            fi
            ;;
          Sukisu)
            if [ -n "${{ inputs.ksu_commit }}" ]; then
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
            else
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
            fi
            ;;
        esac

    - name: Clone & Apply SUSFS Patches for KernelSU Variants
      run: |
        SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
        cd susfs4ksu
        TARGET="${{ inputs.android_version }}-${{ inputs.kernel_version }}"
        COMMIT=""
        case "${{ inputs.ksu_variant }}" in
          WKSU)
            SUSFS_VERSION="1.5.12"
            case "$TARGET" in 
              android12-5.10) COMMIT="8a76ba240d1f7315352b49d97d854a4b166e5b47" ;;
              android13-5.10) COMMIT="e5c9eabfc6dcfc677d11f46ce1d5ff786de60a92" ;;
              android13-5.15) COMMIT="babf6be195576f09aae79650d47abf6a76e8a21b" ;;
              android14-5.15) COMMIT="19f339e804ba9aebd9c6d735b965e2b9396c73ae" ;;
              android14-6.1) COMMIT="a162e2469d0b472545e5e46457eee171c0975fb0" ;;
              android15-6.6) COMMIT="f450ec00bf592d080f59b01ff6f9242456c9a427" ;;
            esac
            git checkout "$COMMIT"
            ;;
          Next)
            SUSFS_VERSION="2.0.0"
            ;;
          KSU|RKSU|MKSU|Sukisu)
            SUSFS_VERSION="2.0.0"
            echo "Not Needed"
            ;;
        esac

        cp "$SUSFS4KSU/kernel_patches/fs/"* "$KERNEL_ROOT/common/fs/"
        cp "$SUSFS4KSU/kernel_patches/include/linux/"* "$KERNEL_ROOT/common/include/linux/"

        cd "$KERNEL_ROOT/common"
        PATCH_FILE="50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch"
        cp "$SUSFS4KSU/kernel_patches/$PATCH_FILE" ./
        patch -p1 < "$PATCH_FILE" || true

        case "${{ inputs.ksu_variant }}" in
          WKSU)
            cd "$KERNEL_ROOT/Wild_KSU"
            cp "$SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" .
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
            cp "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_core_hook.c.patch" ./
            patch -p1 < fix_core_hook.c.patch
            cp "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_sucompat.c.patch" ./
            patch -p1 < fix_sucompat.c.patch
            cp "$KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_kernel_compat.c.patch" ./
            patch -p1 < fix_kernel_compat.c.patch
            ;;
          Next)
            cd "$KERNEL_ROOT/KernelSU-Next"
            cd "$KERNEL_ROOT/common"
            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 43 ]]; then
              cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_base.c.patch ./
              patch -p1 < fix_base.c.patch
            fi
            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" ]] && [[ $ACTUAL_SUBLEVEL -le 117 ]]; then
              cp $KERNEL_PATCHES/ksu/susfs_fix_patches/v${SUSFS_VERSION}/fix_fdinfo.c.patch ./
              patch -p1 < fix_fdinfo.c.patch
            fi
            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 209 ]]; then
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
            ;;
          KSU|RKSU|MKSU)
            cd "$KERNEL_ROOT/KernelSU"
            cp "$SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" .
            patch -p1 < 10_enable_susfs_for_ksu.patch
            ;;
        esac

        case "${{ inputs.ksu_variant }}" in
          KSU|RKSU|MKSU)
            cd "$KERNEL_ROOT/common"
            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 209 ]] ||
               [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 209 ]] ||
               [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 148 ]] ||
               [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "5.15" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 148 ]] ||
               [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && "${{ inputs.os_patch_level }}" != "2024-05" && $ACTUAL_SUBLEVEL -le 75 ]]; then
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi

            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 43 ]] ||
               [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $ACTUAL_SUBLEVEL -ge 145 ]] ||
               [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" && $ACTUAL_SUBLEVEL -ge 98 ]]; then
              cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/1_fix_base.c.patch ./
              patch -p1 < 1_fix_base.c.patch
            fi

            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" && $ACTUAL_SUBLEVEL -le 43 ]]; then
              cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/2_fix_base.c.patch ./
              patch -p1 < 2_fix_base.c.patch || true
            fi

            if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" && $ACTUAL_SUBLEVEL -le 58 ]]; then
              cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/fix_task_mmu.c.patch ./
              patch -p1 < fix_task_mmu.c.patch || true
            fi

            if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" ]] && [[ ${{ inputs.sub_level }} -le 41 ]]; then
              cp $KERNEL_PATCHES/ksu/susfs_fix_patches/v${SUSFS_VERSION}/fix_fdinfo.c.patch ./
              patch -p1 < fix_fdinfo.c.patch || true
              cp $KERNEL_PATCHES/ksu/susfs_fix_patches/v${SUSFS_VERSION}/fix_namespace.c.patch ./
              patch -p1 < fix_namespace.c.patch || true
              cp $KERNEL_PATCHES/ksu/susfs_fix_patches/v${SUSFS_VERSION}/fix_open.c.patch ./
              patch -p1 < fix_open.c.patch || true
              sed -i 's/i_uid_into_mnt(i_user_ns(inode), inode)/i_uid_into_mnt(inode->i_sb->s_user_ns, inode)/g' fs/susfs.c
            fi
            ;;
        esac

    - name: Apply Hooks Patches
      if: ${{ inputs.ksu_variant == 'WKSU' }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        cp "$KERNEL_PATCHES/wild/hooks/scope_min_manual_hooks_v1.4.patch" ./
        patch -p1 -F 3 < scope_min_manual_hooks_v1.4.patch

    - name: Apply Module Check Bypass
      if: ${{ inputs.variant == 'Bypass' }}
      run: |
        if [[ "${{ inputs.kernel_version }}" == "6.1" || "${{ inputs.kernel_version }}" == "6.6" || "${{ inputs.kernel_version }}" == "6.12" ]]; then
          TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"
        else
          TARGET_FILE="$KERNEL_ROOT/common/kernel/module.c"
        fi

        echo "Applying bypass to $TARGET_FILE"
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        if grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "SUCCESS: Module check bypass verified in $TARGET_FILE"
        else
          echo "FAILED: Module check bypass not found in $TARGET_FILE"
          grep -A 5 "bad_version:" "$TARGET_FILE" || true
          exit 1
        fi

    - name: Fix WiFi and Bluetooth on Samsung 6.6 GKI devices
      if: ${{ ( inputs.kernel_version == '6.6' ) }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        SYMBOL_LIST=android/abi_gki_aarch64_galaxy
        echo "kdp_set_cred_non_rcu" >> $SYMBOL_LIST
        echo "kdp_usecount_dec_and_test" >> $SYMBOL_LIST
        echo "kdp_usecount_inc" >> $SYMBOL_LIST

        PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
        if patch -p1 --dry-run < "$PATCH"; then
          patch -p1 --no-backup-if-mismatch < $PATCH
        fi

        cp "$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c" drivers/min_kdp.c
        echo "obj-y += min_kdp.o" >> drivers/Makefile

    - name: Fix WiFi and Bluetooth on Xiaomi 6.6 GKI devices
      if: ${{ ( inputs.kernel_version == '6.6' ) }}
      working-directory: ${{ env.KERNEL_ROOT }}/common
      run: |
        SYMBOL_LIST=android/abi_gki_aarch64_xiaomi
        echo "device_find_any_child" >> $SYMBOL_LIST

    - name: Configure Kernel Options
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        cat >> "${{ env.DEFCONFIG }}" << 'EOF'
        # KernelSU Configuration
        CONFIG_KSU=y
        
        CONFIG_KSU_SUSFS=y
        
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y

        # Mountify Support
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        
        # Networking Configuration
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        
        # BBR TCP Congestion Control
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_NET_SCH_FQ_CODEL=y
        CONFIG_TCP_CONG_BIC=n
        CONFIG_TCP_CONG_WESTWOOD=n
        CONFIG_TCP_CONG_HTCP=n
        
        # IPSet Support
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=65534
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPMARK=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_IPMAC=y
        CONFIG_IP_SET_HASH_MAC=y
        CONFIG_IP_SET_HASH_NETPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_IP_SET_LIST_SET=y
        CONFIG_NET_SCH_CAKE=y   
        
        EOF

        echo "Checking if configs were applied..."
        if grep -q "CONFIG_KSU=y" "${{ env.DEFCONFIG }}" && grep -q "CONFIG_KSU_SUSFS=y" "${{ env.DEFCONFIG }}"; then
          echo "SUCCESS: KSU configs verified in ${{ env.DEFCONFIG }}"
        else
          echo "FAILED: KSU configs missing in ${{ env.DEFCONFIG }}"
          # print last 50 lines to see what happened
          tail -n 50 "${{ env.DEFCONFIG }}"
          exit 1
        fi

        # Remove check_defconfig
        if [[ "${{ inputs.android_version }}" == "android16" && "${{ inputs.kernel_version }}" == "6.12" ]]; then
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          awk '/name = "kernel_aarch64"/,/^\)/ {if(/check_defconfig = "disabled"/) found=1} END{if(found) print "SUCCESS: check_defconfig = \"disabled\" is in the kernel_aarch64 block"; else print "FAILED: NOT in the kernel_aarch64 block"}' common/BUILD.bazel
        else
          sed -i 's/check_defconfig//' ./common/build.config.gki
        fi

    - name: Set Build Identity and Kernel Name
      run: |
        cd $KERNEL_ROOT/common
        
        # Set static build identity
        export KBUILD_BUILD_USER="TheFloresto-labs"
        export KBUILD_BUILD_HOST="ubuntu-build"
        export KBUILD_BUILD_TIMESTAMP="Sun Jun 15 14:56:02 UTC 2025"
        
        echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" >> $GITHUB_ENV
        echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> $GITHUB_ENV
        
        # Configure git for commit
        git config --global user.name "deepongi"
        git config --global user.email "zzitoz@gmail.com"
        
        # Change Kernel Name to @NoFloresto
        if [[ "${{ inputs.kernel_version }}" == "5."* ]] || [[ "${{ inputs.kernel_version }}" == "6.1" ]]; then
          if [ "${{ inputs.variant }}" == "Bypass" ]; then
            perl -i -0777 -pe 's/(.*)echo "\$res"/$1echo "\$res-@NoFloresto-Bypass"/s' ./scripts/setlocalversion
          else
            perl -i -0777 -pe 's/(.*)echo "\$res"/$1echo "\$res-@NoFloresto"/s' ./scripts/setlocalversion
          fi
        else
          if [ "${{ inputs.variant }}" == "Bypass" ]; then
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\${KERNELVERSION}\${file_localversion}\${config_localversion}\${LOCALVERSION}-@NoFloresto-Bypass\${scm_version}"/s' ./scripts/setlocalversion
          else
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\${KERNELVERSION}\${file_localversion}\${config_localversion}\${LOCALVERSION}-@NoFloresto\${scm_version}"/s' ./scripts/setlocalversion
          fi
        fi
        
        # Remove Dirty Flag
        sed -i 's/-dirty//' ./scripts/setlocalversion
        
        # Remove ABI Exports and Error
        rm -rf ./android/abi_gki_protected_exports_* || true
        
        git add .
        git commit -m "NoFloresto: Clean Dirty Flag and Set Identity" || true

    - name: Append ashmem exports if missing
      if: ${{ inputs.android_version == 'android16' && inputs.kernel_version == '6.12' }}
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        FILE=common/drivers/staging/android/ashmem.c
        if [[ -f "$FILE" ]] && ! grep -q 'is_ashmem_file' "$FILE"; then
        cat >>"$FILE" <<'EOF'
        bool is_ashmem_file(struct file *file) { return false; }
        int ashmem_area_name(struct file *file, char *name) { return 0; }
        long ashmem_area_size(struct file *file) { return 0; }
        struct file *ashmem_area_vmfile(struct file *file) { return NULL; }
        EXPORT_SYMBOL_GPL(is_ashmem_file);
        EXPORT_SYMBOL_GPL(ashmem_area_name);
        EXPORT_SYMBOL_GPL(ashmem_area_size);
        EXPORT_SYMBOL_GPL(ashmem_area_vmfile);
        EOF
        fi

        if [ -f common/drivers/android/binder/Makefile ]; then
          perl -i -0777 -pe 's/\$\(\s*CONFIG_ANDROID_BINDER_IPC_RUST\s*\)/m/' common/drivers/android/binder/Makefile
          perl -i -pe 's/^rust_binder-\$\([^)]+\)\s*:=/rust_binder-y :=/' common/drivers/android/binder/Makefile
          cat common/drivers/android/Makefile
          cat common/drivers/android/binder/Makefile
          rustup set profile minimal
          rustup update nightly
          rustup default nightly
          rustup target add aarch64-unknown-none
        else
          perl -i -0777 -pe 's/\$\(\s*CONFIG_ANDROID_BINDER_IPC_RUST\s*\)/m/' common/drivers/android/Makefile
          cat common/drivers/android/Makefile
        fi

    - name: Build Kernel with Clang/Make
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -ex
        
        cd common
        
        # Set up build environment variables
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        
        # Use detected clang with ccache
        export PATH="/usr/lib/ccache:${CLANG_BIN_PATH}:$PATH"
        export CC="ccache clang"
        export CXX="ccache clang++"
        export LD=ld.lld
        export HOSTLD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export READELF=llvm-readelf
        export STRIP=llvm-strip
        
        # Dynamic MAKE_JOBS calculation (memory-aware)
        CORES=$(nproc)
        MEMORY_GB=$(free -g | awk '/^Mem:/{print $2}')
        MAX_JOBS=$(( (MEMORY_GB - 2) / 2 ))
        if [ $MAX_JOBS -lt $CORES ]; then
          MAKE_JOBS=$MAX_JOBS
          echo "⚠️  Limited by RAM: Using $MAKE_JOBS jobs (have $CORES cores, ${MEMORY_GB}GB RAM)"
        else
          MAKE_JOBS=$CORES
          echo "✅ Using $MAKE_JOBS jobs ($CORES cores available, ${MEMORY_GB}GB RAM)"
        fi
        [ $MAKE_JOBS -lt 1 ] && MAKE_JOBS=1
        
        echo "🔧 Build configuration:"
        echo "  - ARCH: $ARCH"
        echo "  - CC: $CC"
        echo "  - LLVM: 1"
        echo "  - LLVM_IAS: 1"
        echo "  - LD: ld.lld"
        echo "  - MAKE_JOBS: $MAKE_JOBS"
        echo "  - CCache: $CCACHE_DIR"
        
        START_TIME=$(date +%s)
        
        # Build configuration
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld gki_defconfig
        
        # Build kernel
        make -j$MAKE_JOBS \
          O=out \
          ARCH=arm64 \
          CC="$CC" \
          LLVM=1 \
          LLVM_IAS=1 \
          LD=ld.lld \
          HOSTLD=ld.lld \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          2>&1 | tee build.log
        
        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - START_TIME))
        BUILD_MINS=$((BUILD_TIME / 60))
        BUILD_SECS=$((BUILD_TIME % 60))
        
        echo "BUILD_TIME=${BUILD_MINS}m ${BUILD_SECS}s" >> $GITHUB_ENV
        echo "MAKE_JOBS=$MAKE_JOBS" >> $GITHUB_ENV
        
        # Verify Image exists
        if [ ! -f "out/arch/arm64/boot/Image" ]; then
          echo "::error::Kernel Image not found!"
          exit 1
        fi
        
        echo "✅ Build completed successfully in ${BUILD_MINS}m ${BUILD_SECS}s"

    - name: Show CCache Statistics
      if: always()
      run: |
        echo "📊 CCache Statistics:"
        ccache -s

    - name: Prepare AnyKernel3 Zip
      run: |
        # Copy Image from build location
        if [ -f "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" ]; then
          cp "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" "$ANYKERNEL3/Image"
          cp "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" "./${{ env.FILE_NAME }}-Image"
          gzip -n -k -f -9 "./${{ env.FILE_NAME }}-Image"
        else
          echo "Error: Image file not found in expected location"
          exit 1
        fi

    - name: Scan and collect patch rejects
      if: ${{ always() }}
      run: |
        set -e
        CONFIG_DIR="$KERNEL_ROOT"
        REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
        mkdir -p "$REJECTS_DIR"
        mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
        REJ_COUNT=${#REJS[@]}
        echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
        echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
        if [ "$REJ_COUNT" -gt 0 ]; then
          for REJ in "${REJS[@]}"; do
            REL="${REJ#"$CONFIG_DIR"/}"
            DEST="$REJECTS_DIR/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$REJ" "$DEST"
            ORIG="${REJ%.rej}"
            if [ -f "$ORIG" ]; then
              ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
              mkdir -p "$(dirname "$ORIG_DEST")"
              cp "$ORIG" "$ORIG_DEST"
            fi
            echo "$REL" >> "$REJECTS_DIR/index.txt"
          done
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-AK3
        path: ./AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9

    - name: Upload Misc Files
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-Misc
        path: |
          ${{ env.FILE_NAME }}-*
          patch-rejects/**
        if-no-files-found: ignore
        compression-level: 9

# End of workflow
