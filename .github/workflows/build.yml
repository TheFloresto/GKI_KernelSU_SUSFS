        CONFIG_KSU_LSM_SECURITY_HOOKS=y
        EOF

    - name: Append ashmem exports if missing
      if: ${{ inputs.android_version == 'android16' && inputs.kernel_version == '6.12' }}
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -euo pipefail
        FILE=common/drivers/staging/android/ashmem.c
        if [[ -f "$FILE" ]] && ! grep -q 'is_ashmem_file' "$FILE"; then
        cat >>"$FILE" <<'EOF'
        bool is_ashmem_file(struct file *file) { return false; }
        int ashmem_area_name(struct file *file, char *name) { return 0; }
        long ashmem_area_size(struct file *file) { return 0; }
        struct file *ashmem_area_vmfile(struct file *file) { return NULL; }
        EXPORT_SYMBOL_GPL(is_ashmem_file);
        EXPORT_SYMBOL_GPL(ashmem_area_name);
        EXPORT_SYMBOL_GPL(ashmem_area_size);
        EXPORT_SYMBOL_GPL(ashmem_area_vmfile);
        EOF
        fi

    - name: Customize Kernel Branding
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_ROOT/common"
        CUSTOM_LOCALVERSION="-@NoFloresto"
        echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"
        
        # Change kernel name based on version
        if [[ "${{ inputs.kernel_version }}" == "5."* ]] || [[ "${{ inputs.kernel_version }}" == "6.1" ]]; then
          perl -i -0777 -pe 's/(.*)echo "\$res"/$1echo "\$res-@NoFloresto"/s' ./scripts/setlocalversion
        else
          perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\${KERNELVERSION}\${file_localversion}\${config_localversion}\${LOCALVERSION}-@NoFloresto\${scm_version}"/s' ./scripts/setlocalversion
        fi
        
        # Remove Dirty Flag
        sed -i 's/-dirty//' ./scripts/setlocalversion
        
        # Remove Abi Exports
        rm -rf ./android/abi_gki_protected_exports_* || true
        perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//' ./BUILD.bazel || true
        
        git config --global user.name "deepongi"
        git config --global user.email "zzitoz@gmail.com"
        git add .
        git commit -m "TheFloresto: Clean Dirty Flag"

    - name: Build Kernel
      shell: bash
      working-directory: ${{ env.KERNEL_ROOT }}/common
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel with ccache optimization"
        
        : > .scmversion
        
        export COMMIT_TIMESTAMP=$(date -u)
        export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
        export KBUILD_BUILD_TIMESTAMP="${{ env.BUILD_TIMESTAMP }}"
        export KBUILD_BUILD_USER="${{ env.BUILD_USER }}"
        export KBUILD_BUILD_HOST="${{ env.BUILD_HOST }}"
        export KBUILD_BUILD_VERSION=1
        
        WORKSPACE="${GITHUB_WORKSPACE}"
        MAP="-fdebug-prefix-map=${WORKSPACE}=."
        MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
        FPMAP="-ffile-prefix-map=${WORKSPACE}=."
        
        export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument"
        export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"
        
        export LLVM=1 LLVM_IAS=1
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm 
        export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        
        export CC="ccache clang"
        export CXX="ccache clang++"
        export HOSTCC="ccache clang"
        export HOSTCXX="ccache clang++"
        
        export PATH="/usr/lib/ccache:${CLANG_BIN_PATH}:${KERNEL_ROOT}/prebuilts/kernel-build-tools/linux-x86/bin/:${KERNEL_ROOT}/prebuilts/kernel-build-tools/linux_musl-x86/bin/:${PATH}"
        
        echo "============================================"
        echo "🔧 Build Configuration"
        echo "============================================"
        echo "Kernel: ${{ inputs.kernel_version }}.${{ env.ACTUAL_SUBLEVEL }}"
        echo "Threads: $(nproc --all)"
        echo "Optimization: O2 with LTO thin"
        echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"
        echo "User: $KBUILD_BUILD_USER"
        echo "Host: $KBUILD_BUILD_HOST"
        echo "ccache: ENABLED"
        echo "============================================"
        
        OUT=out
        mkdir -p "$OUT"
        
        make O="$OUT" gki_defconfig
        
        # Set LOCALVERSION
        scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}"
        scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO
        
        # Force O2 optimization
        scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE
        scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
        
        # Enable LTO thin
        scripts/config --file "$OUT/.config" -e LTO_CLANG
        scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN
        scripts/config --file "$OUT/.config" -d LTO_CLANG_NONE
        scripts/config --file "$OUT/.config" -d LTO_CLANG_FULL
        
        make O="$OUT" olddefconfig
        
        KCFLAGS="$KCFLAGS -Wno-error -pipe -fno-stack-protector -O2"
        KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"
        
        BUILD_START=$(date +%s)
        set -o pipefail
        
        make -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" 2>&1 | tee build.log
        
        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - BUILD_START))
        
        echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
        
        IMG="$OUT/arch/arm64/boot/Image"
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image missing"
          tail -n 100 build.log || true
          exit 1
        fi
        
        IMG_SIZE=$(stat -c%s "$IMG")
        
        echo "============================================"
        echo "✅ Build Completed Successfully"
        echo "============================================"
        echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        echo ""
        echo "📊 ccache Statistics:"
        ccache -s
        echo "============================================"
        echo "::endgroup::"

    - name: Prepare AnyKernel3
      shell: bash
      run: |
        set -euo pipefail
        if [ -f "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" ]; then
          cp "$KERNEL_ROOT/common/out/arch/arm64/boot/Image" "$ANYKERNEL3/Image"
        else
          echo "Error: Image file not found"
          exit 1
        fi

    - name: Create Bootimgs Folder and Copy Images
      shell: bash
      run: |
        set -euo pipefail
        mkdir bootimgs
        SRC_DIR="$KERNEL_ROOT/common/out"
        
        cp "$SRC_DIR/arch/arm64/boot/Image" ./bootimgs/
        lz4 -f -l -9 ./bootimgs/Image ./bootimgs/Image.lz4
        
        cp ./bootimgs/Image "./${{ env.FILE_NAME }}-Image"
        cp ./bootimgs/Image.lz4 "./${{ env.FILE_NAME }}-Image.lz4"
        
        gzip -n -k -f -9 "./${{ env.FILE_NAME }}-Image"
        gzip -n -k -f -9 ./bootimgs/Image

    - name: Build Boot Images
      shell: bash
      working-directory: bootimgs
      run: |
        set -euo pipefail
        RAMDISK_ARGS=""
        
        if [[ "${{ inputs.android_version }}" == "android12" ]]; then
          GKI_URL="https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_r1.zip"
          FALLBACK_URL="https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip"
          
          if curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null | grep -q 200; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi
          
          unzip -q gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"
          RAMDISK_ARGS="--ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level ${{ inputs.os_patch_level }}"
        fi
        
        for suffix in "" ".gz" ".lz4"; do
          kernel="Image${suffix}"
          output="boot${suffix//./-}.img"
          [ -z "$suffix" ] && output="boot.img"
          
          $MKBOOTIMG --header_version 4 --kernel "$kernel" --output "$output" $RAMDISK_ARGS
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) \
            --image "$output" --algorithm SHA256_RSA2048 --key "$BOOT_SIGN_KEY_PATH"
          cp "./$output" "$GITHUB_WORKSPACE/${{ env.FILE_NAME }}-$output"
        done

    - name: Collect Build Stats
      id: collect_stats
      shell: bash
      run: |
        set -euo pipefail
        IMG="$KERNEL_ROOT/common/out/arch/arm64/boot/Image"
        
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image not found"
          exit 1
        fi
        
        if ! file "$IMG" | grep -qi 'ARM64'; then
          echo "::error::Image is not ARM64 format"
          exit 1
        fi
        
        IMG_SIZE=$(stat -c %s "$IMG")
        MIN_SIZE=6102400
        if [ "$IMG_SIZE" -lt "$MIN_SIZE" ]; then
          echo "::error::Image size too small"
          exit 1
        fi
        
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        
        WARNINGS_COUNT="0"
        if [ -f "$KERNEL_ROOT/common/build.log" ]; then
          WARNINGS_COUNT="$(grep -ciE '\bwarning:' "$KERNEL_ROOT/common/build.log" || true)"
        fi
        
        echo "warnings_count=$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"
        echo "image_sha256=$IMG_SHA256" >> "$GITHUB_OUTPUT"
        echo "build_time=${BUILD_TIME:-0}" >> "$GITHUB_OUTPUT"
        
        echo "✅ Validation passed:"
        echo "   - Warnings: $WARNINGS_COUNT"
        echo "   - Image size: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        echo "   - SHA256: $IMG_SHA256"

    - name: Scan and collect patch rejects
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$KERNEL_ROOT"
        REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
        mkdir -p "$REJECTS_DIR"
        
        mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
        REJ_COUNT=${#REJS[@]}
        echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV
        
        if [ "$REJ_COUNT" -gt 0 ]; then
          for REJ in "${REJS[@]}"; do
            REL="${REJ#"$CONFIG_DIR"/}"
            DEST="$REJECTS_DIR/$REL"
            mkdir -p "$(dirname "$DEST")"
            cp "$REJ" "$DEST"
            
            ORIG="${REJ%.rej}"
            if [ -f "$ORIG" ]; then
              ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
              mkdir -p "$(dirname "$ORIG_DEST")"
              cp "$ORIG" "$ORIG_DEST"
            fi
            echo "$REL" >> "$REJECTS_DIR/index.txt"
          done
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-AK3
        path: ./AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9

    - name: Upload Misc Files
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-Misc
        path: |
          ${{ env.FILE_NAME }}-*
          patch-rejects/**
        if-no-files-found: ignore
        compression-level: 9

    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-logs
        path: |
          ${{ env.KERNEL_ROOT }}/common/build.log
          ${{ env.KERNEL_ROOT }}/common/out/.config
        if-no-files-found: ignore
        compression-level: 9
        retention-days: 7

     # End of workflow
