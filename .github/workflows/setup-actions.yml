name: Setup Action Files

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/setup-actions.yml'

permissions:
  contents: write

jobs:
  setup-actions:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create KSU variant action files
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // --- wksu ---
          fs.mkdirSync('.github/actions/wksu', { recursive: true });
          fs.writeFileSync('.github/actions/wksu/action.yml', `name: Setup Wild KSU
description: Download and configure Wild KSU with version tracking
inputs:
  ksu_commit:
    description: "KSU Commit"
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Download Wild KSU
      shell: bash
      working-directory: \${{ github.workspace }}/kernel
      run: |
        curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/stable/kernel/setup.sh" | bash -s \${{ inputs.ksu_commit }}

    - name: Enable KernelSU Config
      shell: bash
      working-directory: \${{ github.workspace }}/kernel
      run: |
        cat >> "\${{ github.workspace }}/thefloresto.fragment" << 'FRAG'
        # KernelSU Configuration
        CONFIG_KSU=y
        CONFIG_KSU_DEBUG=n
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_KSU_KPROBES_HOOK=n
        CONFIG_KSU_LSM_SECURITY_HOOKS=y
        FRAG

    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: \${{ github.workspace }}/kernel/Wild_KSU
      run: |
        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV
`);
          console.log('Created .github/actions/wksu/action.yml');

          // --- next ---
          fs.mkdirSync('.github/actions/next', { recursive: true });
          fs.writeFileSync('.github/actions/next/action.yml', `name: Setup KernelSU Next
