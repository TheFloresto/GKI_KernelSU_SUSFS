name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options: [ Actions, Pre-Release, Release ]
        default: Actions
      ksu_variant:
        description: "KernelSU Variant"
        type: choice
        options: [ KSU, WKSU, Next, MKSU, RKSU, KowXU, Sukisu]
        default: WKSU
      ksu_commit:
        description: "KSU Commit (optional)"
        type: string
        default: ""
        required: false
      build_bypass:
        description: "Build Bypass"
        type: boolean
        default: false
      # Build Selection
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_10:
        description: "Android 13 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_5_15:
        description: "Android 14 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      build_lts:
        description: "Build All LTS Kernels"
        type: boolean
        default: false

jobs:
  build-a12-5-10:
    if: inputs.build_a12_5_10
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  build-a13-5-10:
    if: inputs.build_a13_5_10
    uses: ./.github/workflows/kernel-a13-5-10.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  build-a13-5-15:
    if: inputs.build_a13_5_15
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  build-a14-5-15:
    if: inputs.build_a14_5_15
    uses: ./.github/workflows/kernel-a14-5-15.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  build-a14-6-1:
    if: inputs.build_a14_6_1
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  build-a15-6-6:
    if: inputs.build_a15_6_6
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  build-a16-6-12:
    if: inputs.build_a16_6_12
    uses: ./.github/workflows/kernel-a16-612.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  build-lts:
    if: inputs.build_lts
    uses: ./.github/workflows/kernel-lts.yml
    secrets: inherit
    with:
      ksu_variant: ${{ inputs.ksu_variant }}
      ksu_commit: ${{ inputs.ksu_commit }}
      build_bypass: ${{ inputs.build_bypass }}

  rej:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build-a12-5-10
      - build-a13-5-10
      - build-a13-5-15
      - build-a14-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
      - build-lts
    steps:
      - name: Download Misc Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./downloaded-artifacts
          pattern: '*-Normal-Misc'

      - name: Process Reject Artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aio-rejects
          
          # Iterate over Misc artifacts in downloaded-artifacts
          for dir in ./downloaded-artifacts/*-Normal-Misc; do
            # Ensure it is a directory
            [ -d "$dir" ] || continue
            
            dirname=$(basename "$dir")
            echo "Processing $dirname..."
            
            # Check for patch-rejects folder
            if [ -d "$dir/patch-rejects" ]; then
              echo "Found patch-rejects in $dirname"
              
              # Get original name (remove -Misc suffix)
              original_name=${dirname%-Misc}
              
              # Move and rename patch-rejects to aio-rejects/original_name
              mv "$dir/patch-rejects" "aio-rejects/$original_name"
            else
              echo "No patch-rejects found in $dirname"
            fi
          done
          
          # Zip and upload if we found anything
          if [ "$(ls -A aio-rejects)" ]; then
            echo "Creating AIO-REJ.zip..."
            cd aio-rejects
            zip -r -q -9 ../AIO-REJ.zip .
            cd ..
          else
            echo "No rejects found to upload."
          fi

      - name: Upload AIO-REJ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    if: inputs.release_type != 'Actions'
    needs:
      - build-a12-5-10
      - build-a13-5-10
      - build-a13-5-15
      - build-a14-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12

    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      RELEASE_NAME: "!!TESTING!! GKI Kernels With ${{ inputs.ksu_variant }} & SUSFS v2.0.0 !!TESTING!!"
      RELEASE_BODY: ""
      TARGET_REPO: NerestKernels/GKI_KernelSU_SUSFS
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit hashes and generate commit URLs
        shell: bash
        run: |
          set -euo pipefail
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_10"]="gki-android13-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_5_15"]="gki-android14-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
          )
          
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "$branch_name Commit: $COMMIT_HASH"
              echo "$branch_name Commit URL: $COMMIT_URL"
              
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      - name: Get KernelSU variant refs and links
        shell: bash
        run: |
          set -euo pipefail
          
          case "${{ inputs.ksu_variant }}" in
            "WKSU")
              KSU_REF=$(git ls-remote "https://github.com/WildKernels/Wild_KSU.git" refs/heads/wild | awk '{print $1}')
              KSU_URL="https://github.com/WildKernels/Wild_KSU/commit/$KSU_REF"
              ;;
            "Next")
              KSU_REF=$(git ls-remote "https://github.com/KernelSU-Next/KernelSU-Next.git" refs/heads/dev | awk '{print $1}')
              KSU_URL="https://github.com/KernelSU-Next/KernelSU-Next/commit/$KSU_REF"
              ;;
            "MKSU")
              KSU_REF=$(git ls-remote "https://github.com/MollySophia/KernelSU.git" refs/heads/main | awk '{print $1}')
              KSU_URL="https://github.com/MollySophia/KernelSU/commit/$KSU_REF"
              ;;
            "KSU")
              KSU_REF=$(git ls-remote "https://github.com/tiann/KernelSU.git" refs/heads/main | awk '{print $1}')
              KSU_URL="https://github.com/tiann/KernelSU/commit/$KSU_REF"
              ;;
            "RKSU")
              KSU_REF=$(git ls-remote "https://github.com/rsuntk/KernelSU.git" refs/heads/main | awk '{print $1}')
              KSU_URL="https://github.com/rsuntk/KernelSU/commit/$KSU_REF"             
              ;;
            "KowXU")
              KSU_REF=$(git ls-remote "https://github.com/KOWX712/KernelSU.git" refs/heads/master | awk '{print $1}')
              KSU_URL="https://github.com/KOWX712/KernelSU/commit/$KSU_REF"           
              ;;
            "Sukisu")
              KSU_REF=$(git ls-remote "https://github.com/Ylarod/KernelSU.git" refs/heads/main | awk '{print $1}')
              KSU_URL="https://github.com/Ylarod/KernelSU/commit/$KSU_REF"
              ;;
            *)
              echo "ERROR: Unknown KSU variant: ${{ inputs.ksu_variant }}"
              exit 1
              ;;
          esac
          
          if [[ -z "$KSU_REF" ]]; then
            echo "ERROR: Failed to get KSU_REF for variant ${{ inputs.ksu_variant }}"
            exit 1
          fi
          
          echo "KSU Variant: ${{ inputs.ksu_variant }}"
          echo "KSU_REF: $KSU_REF"
          echo "KSU_URL: $KSU_URL"
          
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV
          
          BBG_REF=$(git ls-remote "https://github.com/vc-teahouse/Baseband-guard.git" refs/heads/main | awk '{print $1}')
          BBG_URL="https://github.com/vc-teahouse/Baseband-guard/commit/$BBG_REF"
          
          if [[ -z "$BBG_REF" ]]; then
            echo "ERROR: Failed to get BBG_REF"
            exit 1
          fi
          
          echo "BBG_REF: $BBG_REF"
          echo "BBG_URL: $BBG_URL"
          
          echo "BBG_REF=$BBG_REF" >> $GITHUB_ENV
          echo "BBG_URL=$BBG_URL" >> $GITHUB_ENV

      - name: Generate New Tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        if: inputs.release_type != 'Actions'
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh api repos/${{ env.TARGET_REPO }}/tags --jq '.[0].name' 2>/dev/null || echo "")
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Set release body
        shell: bash
        run: |
          set -euo pipefail
          cat << 'EOF' > release_body.md
          
          !!THIS RELEASE IS A TESTING RELEASE!!
          
          **IMPORTANT DISCLAIMER**
          This software is provided for testing and educational purposes only. Use at your own risk.
          The developers are not responsible for any damage, data loss, or issues that may occur.
          Please ensure you have proper backups before installation.
          
          🔹 Normal 
          - Default kernel configuration 
          - Standard kernel module loading behavior 
          - Recommended for most users 
          
          🔹 Bypass 
          - Includes module check bypass modifications 
          - What are kernel modules? Kernel modules are pieces of code that can be loaded into the kernel at runtime to extend functionality (like device drivers, filesystem support, etc.). These are different from KernelSU/Magisk modules. 
          - The Problem: Sometimes when installing a custom kernel, the device tries to load a kernel module that fails due to version mismatches, missing dependencies, or signature verification issues. This can cause boot failures or device instability. 
          - The Solution: This version changes one line from false to true to force load the kernel module, bypassing the failure check that would normally prevent loading.
          
          Features:
          -> ${{ inputs.ksu_variant }} KSU
          -> SUSFS ඞ v2.0.0
          -> Hybrid Root Hooks
          -> Ptrace Patch Support for Older Kernels (<5.16)
          -> IPSet Support for Advanced Network Filtering
          -> Wireguard Support
          -> BBR v1 Support
          -> BBG: https://github.com/vc-teahouse/Baseband-guard
          
          🔹 BBG (Baseband-guard)
          - A lightweight LSM (Linux Security Module) for Android kernel
          - Blocks unauthorized writes to critical partitions/device nodes
          - Prevents malicious tampering with baseband and boot chain
          - Kernel-level protection via LSM hooks
          - Reduces risk of soft-brick/hard-brick issues
          
          Kernel Flasher:
          -> https://github.com/fatalcoder524/KernelFlasher/
          
          Managers:
          -> WKSU: [Github](https://github.com/WildKernels/Wild_KSU) [Telegram](https://t.me/WildKernels)
          -> NEXT: [Github](https://github.com/KernelSU-Next/KernelSU-Next) [Telegram](https://t.me/ksunext_ci)
          -> Official KSU: [Github](https://github.com/tiann/KernelSU) [Telegram](https://t.me/KernelSU_group)
          -> MKSU: [Github](https://github.com/MollySophia/KernelSU) [Telegram](https://t.me/mksu_ci)
          -> RKSU: [Github](https://github.com/rsuntk/KernelSU) [Telegram](https://t.me/rsuntk)
          -> KowXU: [Github](https://github.com/KOWX712/KernelSU) [Telegram](https://t.me/kowchannel)
          -> Sukisu: [Github](https://github.com/Ylarod/KernelSU) [Telegram](https://t.me/Sukiksu)
          
          Commit Hashes (at the time of release):
          -> ${{ inputs.ksu_variant }}: [${{ env.KSU_REF }}](${{ env.KSU_URL }})
          
          -> Baseband-guard: [${{ env.BBG_REF }}](${{ env.BBG_URL }})
          
          Module: 
          -> https://github.com/sidex15/ksu_module_susfs
          
          !!THIS RELEASE IS A TESTING RELEASE!!
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.RELEASE_TOKEN }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: ""
          name: ${{ env.RELEASE_NAME }}
          body_path: release_body.md

      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./downloaded-artifacts
          pattern: '*-AK3'

      - name: Upload Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          anykernel_dirs=(./downloaded-artifacts/*-AK3/)
          
          if [ ${#anykernel_dirs[@]} -eq 0 ]; then
            echo "No AK3 artifact directories found; skipping upload."
            exit 0
          fi
          
          echo "Found ${#anykernel_dirs[@]} artifacts to process"
          
          # Create all ZIPs in parallel
          for dir in "${anykernel_dirs[@]}"; do
            artifact_name=$(basename "$dir")
            echo "Creating ZIP for $artifact_name..."
            (cd "$dir" && zip -r -q -9 "$GITHUB_WORKSPACE/${artifact_name}.zip" ./*) &
          done          
          wait
          
          # Upload all ZIPs
          for dir in "${anykernel_dirs[@]}"; do
            artifact_name=$(basename "$dir")
            echo "Uploading ${artifact_name}.zip..."
            gh release upload "${{ env.NEW_TAG }}" "${artifact_name}.zip" \
              --repo ${{ env.TARGET_REPO }} \
              --clobber
          done
          
      - name: Send Telegram Notification
        if: inputs.release_type != 'Actions'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TYPE_TEXT=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            RELEASE_TYPE_TEXT="🧪 Pre-Release"
          else
            RELEASE_TYPE_TEXT="🚀 Release"
          fi
          
          MESSAGE="🌽 *New Kernel ${RELEASE_TYPE_TEXT} Uploaded*
          
          🛑 *Variant:* \`${{ inputs.ksu_variant }}\`
          📦 *Repository:* [NerestKernels/GKI\_KernelSU\_SUSFS](https://github.com/${{ env.TARGET_REPO }})
          ✏️ *Commit:* [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          🔗 [View GitHub Release](https://github.com/${{ env.TARGET_REPO }}/releases/tag/${{ env.NEW_TAG }})"
          
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_thread_id="${{ secrets.TELEGRAM_TOPIC_ID_GKI }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"

  notify-actions:
    runs-on: ubuntu-latest
    if: inputs.release_type == 'Actions'
    env:
      TARGET_REPO: NerestKernels/GKI_KernelSU_SUSFS
    steps:
      - name: Send Telegram Notification
        shell: bash
        run: |
          set -euo pipefail
          
          MESSAGE="🌽 *New Kernel Actions Build Finished*
          
          🛑 *Variant:* \`${{ inputs.ksu_variant }}\`
          📦 *Repository:* [NerestKernels/GKI\_KernelSU\_SUSFS](https://github.com/${{ env.TARGET_REPO }})
          ✏️ *Commit:* [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          🔗 [View Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_thread_id="${{ secrets.TELEGRAM_TOPIC_ID_GKI }}" \
            -d parse_mode="Markdown" \
            -d text="$MESSAGE"
