name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      kernel_build_version:
        description: "Kernel Version"
        type: choice
        options:
          - All
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
        default: All
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - KSUN+SUSFS+BBG+NET+DS
          - KSUN+SUSFS+BBG
          - KSUN+SUSFS+NET
          - KSUN+SUSFS+DS
          - KSUN+SUSFS
          - KSUN+BBG
          - KSUN+NET
          - KSUN+DS
          - KSUN
          - NONE
          - FULL
        default: FULL
      ksu_variant:
        description: "KSU Variant"
        type: choice
        options:
          - Next
          - KSU
          - MKSU
          - KowSU
          - ReSukiSU
          - WKSU
        default: Next        
      use_repo:
        description: "Use repo for downloading kernel source"
        type: boolean
        default: true
      use_latest_commits:
        description: "Use branch tip for KernelSU and SUSFS instead of pinned commits"
        type: boolean
        default: true
      test_release_notes:
        description: "Test release notes only"
        type: boolean
        default: false

jobs:
  build-android12-5-10:
    if: ${{ !inputs.test_release_notes && (inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android12-5.10') }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android12-5.10.json
      feature_set: ${{ inputs.feature_set || 'FULL' }}
      ksu_variant: ${{ inputs.ksu_variant || 'Next' }}      
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit

  build-android13-5-10:
    if: ${{ !inputs.test_release_notes && (inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android13-5.10') }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android13-5.10.json
      feature_set: ${{ inputs.feature_set || 'FULL' }}
      ksu_variant: ${{ inputs.ksu_variant || 'Next' }}      
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit

  build-android13-5-15:
    if: ${{ !inputs.test_release_notes && (inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android13-5.15') }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android13-5.15.json
      feature_set: ${{ inputs.feature_set || 'FULL' }}
      ksu_variant: ${{ inputs.ksu_variant || 'Next' }}     
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit

  build-android14-5-15:
    if: ${{ !inputs.test_release_notes && (inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android14-5.15') }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android14-5.15.json
      feature_set: ${{ inputs.feature_set || 'FULL' }}
      ksu_variant: ${{ inputs.ksu_variant || 'Next' }}      
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit

  build-android14-6-1:
    if: ${{ !inputs.test_release_notes && (inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android14-6.1') }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android14-6.1.json
      feature_set: ${{ inputs.feature_set || 'FULL' }}
      ksu_variant: ${{ inputs.ksu_variant || 'Next' }}      
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit

  build-android15-6-6:
    if: ${{ !inputs.test_release_notes && (inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android15-6.6') }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android15-6.6.json
      feature_set: ${{ inputs.feature_set || 'FULL' }}
      ksu_variant: ${{ inputs.ksu_variant || 'Next' }}      
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit

  build-android16-6-12:
    if: ${{ !inputs.test_release_notes && (inputs.kernel_build_version == 'All' || inputs.kernel_build_version == 'android16-6.12') }}
    uses: ./.github/workflows/prepare.yml
    with:
      config_file: .github/config/android16-6.12.json
      feature_set: ${{ inputs.feature_set || 'FULL' }}
      ksu_variant: ${{ inputs.ksu_variant || 'Next' }}      
      use_repo: ${{ inputs.use_repo }}
      use_latest_commits: ${{ inputs.use_latest_commits }}
    secrets: inherit

  rej:
    if: ${{ !inputs.test_release_notes && always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs:
    - build-android12-5-10
    - build-android13-5-10
    - build-android13-5-15
    - build-android14-5-15
    - build-android14-6-1
    - build-android15-6-6
    - build-android16-6-12

    steps:
    - name: Download Misc Artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./downloaded-artifacts
        pattern: '*-Rejects'
        merge-multiple: false

    - name: Process Reject Artifacts
      run: |
        mkdir -p aio-rejects

        # Iterate over Rejects artifacts in downloaded-artifacts
        for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue

            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            source_dir="$dir"

            if [ -d "$dir/patch-rejects" ]; then
              source_dir="$dir/patch-rejects"
            fi

            mapfile -t rej_files < <(find "$source_dir" -type f -name '*.rej' | sort)
            filtered_rej_files=()
            for rej_file in "${rej_files[@]}"; do
              rel_rej="${rej_file#${source_dir}/}"
              rel_name="$(basename "$rel_rej")"
              if [ "$rel_rej" = "common/mm/rmap.c.rej" ] || [ "$rel_name" = "i2c-nomadik.c.rej" ]; then
                echo "Skipping $rel_rej because it is an ignored reject file"
                continue
              fi
              filtered_rej_files+=("$rej_file")
            done

            if [ "${#filtered_rej_files[@]}" -eq 0 ]; then
              echo "Skipping $dirname because it only contains ignored reject files"
              continue
            fi

            mkdir -p "aio-rejects/$original_name"

            if [ -d "$dir/patch-rejects" ]; then
              cp -r "$dir/patch-rejects/." "aio-rejects/$original_name/"
            else
              cp -r "$dir/." "aio-rejects/$original_name/"
            fi

            find "aio-rejects/$original_name" -type f -name 'i2c-nomadik.c.rej' -delete
        done

        if [ "$(ls -A aio-rejects)" ]; then
            cd aio-rejects
            zip -r -q -9 ../AIO-REJ.zip .
            cd ..
        else
            echo "No rejects found to upload."
        fi

    - name: Rejects Summary
      run: |
        echo "Reject artifacts were collected locally only and are not uploaded." >> "$GITHUB_STEP_SUMMARY"

    - name: Upload AIO-REJ Artifact
      uses: actions/upload-artifact@v7
      with:
        name: AIO-REJ
        path: AIO-REJ.zip
        if-no-files-found: ignore

  release-preview:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_release_notes == true }}
    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_REPO: NerestKernels/GKI_KernelSU_SUSFS
      RELEASE_NOTES: .github/config/RELEASE_NOTES.md
      COMMITS_JSON: .github/config/commits.json
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract KernelSU Version Info
      id: ksu_version
      env:
        COMMITS_JSON_PATH: ${{ env.COMMITS_JSON }}
      run: |
        set -euo pipefail

        KSU_VARIANT="${{ inputs.ksu_variant }}"
        BASE_VERSION=30000

        case "$KSU_VARIANT" in
          Next)
            KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
            KSU_BRANCH="dev"
            JSON_KEY=".kernelsu.dev"
            ;;
          KSU)
            KSU_REPO="https://github.com/tiann/KernelSU.git"
            KSU_BRANCH="main"
            JSON_KEY=".ksu.main"
            ;;
          MKSU)
            KSU_REPO="https://github.com/5ec1cff/KernelSU.git"
            KSU_BRANCH="main"
            JSON_KEY=".mksu.main"
            ;;
          KowSU)
            KSU_REPO="https://github.com/KOWX712/KernelSU-Next.git"
            KSU_BRANCH="master"
            JSON_KEY=".kowsu.master"
            ;;
          ReSukiSU)
            KSU_REPO="https://github.com/ReSukiSU/ReSukiSU.git"
            KSU_BRANCH="main"
            JSON_KEY=".resukisu.main"
            BASE_VERSION=33275
            ;;
          WKSU)
            KSU_REPO="https://github.com/WildKernels/Wild_KSU.git"
            KSU_BRANCH="stable"
            JSON_KEY=".wksu.stable"
            ;;
          *)
            echo "Unknown ksu_variant: $KSU_VARIANT" >&2
            exit 1
            ;;
        esac

        if [ "${{ inputs.use_latest_commits }}" = "true" ]; then
          echo "Cloning $KSU_VARIANT from branch tip: $KSU_BRANCH"
          git clone --branch "$KSU_BRANCH" "$KSU_REPO" /tmp/ksu-source
        else
          echo "Cloning $KSU_VARIANT with deep history for pinned commit"
          git clone "$KSU_REPO" /tmp/ksu-source
        fi

        cd /tmp/ksu-source

        if [ "${{ inputs.use_latest_commits }}" = "true" ]; then
          KSU_COMMIT=$(git rev-parse HEAD)
        else
          KSU_COMMIT=$(jq -er "$JSON_KEY" "$COMMITS_JSON_PATH" 2>/dev/null || git rev-parse HEAD)
          echo "Checking out pinned commit: $KSU_COMMIT"
          git fetch --depth=50 origin "$KSU_COMMIT"
          git checkout "$KSU_COMMIT"
        fi

        COMMITS_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "no-tag")

        echo "KSU Variant: $KSU_VARIANT"
        echo "KSU Version: $KSU_VERSION"
        echo "KSU Git Tag: $KSU_GIT_TAG"

        echo "KSU_VARIANT=$KSU_VARIANT" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV

    - name: Set release body
      run: |
        set -e

        RELEASE_NOTES_PATH="$RELEASE_NOTES"
        : > release_body.md

        python3 .github/scripts/render_release_body.py "$RELEASE_NOTES_PATH" > release_body.md

    - name: Publish release notes preview
      run: |
        {
          echo "## Release Notes Preview"
          echo
          cat release_body.md
        } >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && (inputs.release_type == 'Pre-Release' || inputs.release_type == 'Release') }}
    permissions:
      contents: write
    needs:
    - build-android12-5-10
    - build-android13-5-10
    - build-android13-5-15
    - build-android14-5-15
    - build-android14-6-1
    - build-android15-6-6
    - build-android16-6-12

    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_REPO: NerestKernels/GKI_KernelSU_SUSFS
      RELEASE_NOTES: .github/config/RELEASE_NOTES.md
      COMMITS_JSON: .github/config/commits.json
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
    - name: Validate Selected Builds
      run: |
        set -euo pipefail

        failed=0
        current_type="${{ inputs.kernel_build_version }}"

        check_selected() {
          local target="$1"
          local job_name="$2"
          local result="$3"
          
          if [[ "$current_type" == "all" || "$current_type" == "$target" ]]; then
            if [[ "$result" != "success" ]]; then
              echo "Required job $job_name did not succeed (result: $result)"
              failed=1
            fi
          fi
        }

        check_selected "android12-5.10" "build-android12-5-10" "${{ needs.build-android12-5-10.result }}"
        check_selected "android13-5.10" "build-android13-5-10" "${{ needs.build-android13-5-10.result }}"
        check_selected "android13-5.15" "build-android13-5-15" "${{ needs.build-android13-5-15.result }}"
        check_selected "android14-5.15" "build-android14-5-15" "${{ needs.build-android14-5-15.result }}"
        check_selected "android14-6.1" "build-android14-6-1" "${{ needs.build-android14-6-1.result }}"
        check_selected "android15-6.6" "build-android15-6-6" "${{ needs.build-android15-6-6.result }}"
        check_selected "android16-6.12" "build-android16-6-12" "${{ needs.build-android16-6-12.result }}"

        if [[ "$failed" -ne 0 ]]; then
          exit 1
        fi

    - name: Free Disk Space
      if: true
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"
        testing: false

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        
    - name: Generate New Tag
      id: tag
      if: inputs.release_type != 'Action'
      run: |
        mapfile -t RELEASE_TAGS < <(gh api --paginate "repos/${{ env.RELEASE_REPO }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^r[0-9]+$' || true)

        LATEST_REV=0
        for TAG in "${RELEASE_TAGS[@]}"; do
          REV="${TAG#r}"
          if [[ "$REV" =~ ^[0-9]+$ && "$REV" -gt "$LATEST_REV" ]]; then
            LATEST_REV="$REV"
          fi
        done

        if [[ "$LATEST_REV" -gt 0 ]]; then
          NEW_TAG="r$((LATEST_REV + 1))"
        else
          NEW_TAG="r1"
        fi

        if [[ ${#RELEASE_TAGS[@]} -gt 0 ]]; then
          echo "Latest r-tag in ${{ env.RELEASE_REPO }}: r${LATEST_REV}"
        else
          echo "No existing r-tags found in ${{ env.RELEASE_REPO }}; starting at r1"
        fi
        echo "New tag: $NEW_TAG"
        echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
        echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

    - name: Set Release Title
      id: release_meta
      run: |
        set -euo pipefail

        if [[ "${NEW_TAG}" =~ ^r([0-9]+)$ ]]; then
          REV_NUM="${BASH_REMATCH[1]}"
          release_title="Nerest Kernels for GKI2 Devices 5.10+ Release ${REV_NUM}"
        else
          release_title="Nerest Kernels for GKI2 Devices 5.10+ Release ${NEW_TAG}"
        fi

        echo "release_title=$release_title" >> "$GITHUB_OUTPUT"

    - name: Extract KernelSU Version Info
      id: ksu_version
      env:
        COMMITS_JSON_PATH: ${{ env.COMMITS_JSON }}
      run: |
        set -euo pipefail

        KSU_VARIANT="${{ inputs.ksu_variant }}"
        BASE_VERSION=30000

        case "$KSU_VARIANT" in
          Next)
            KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
            KSU_BRANCH="dev"
            JSON_KEY=".kernelsu.dev"
            ;;
          KSU)
            KSU_REPO="https://github.com/tiann/KernelSU.git"
            KSU_BRANCH="main"
            JSON_KEY=".ksu.main"
            ;;
          MKSU)
            KSU_REPO="https://github.com/5ec1cff/KernelSU.git"
            KSU_BRANCH="main"
            JSON_KEY=".mksu.main"
            ;;
          KowSU)
            KSU_REPO="https://github.com/KOWX712/KernelSU-Next.git"
            KSU_BRANCH="master"
            JSON_KEY=".kowsu.master"
            ;;
          ReSukiSU)
            KSU_REPO="https://github.com/ReSukiSU/ReSukiSU.git"
            KSU_BRANCH="main"
            JSON_KEY=".resukisu.main"
            BASE_VERSION=33275
            ;;
          WKSU)
            KSU_REPO="https://github.com/WildKernels/Wild_KSU.git"
            KSU_BRANCH="stable"
            JSON_KEY=".wksu.stable"
            ;;
          *)
            echo "Unknown ksu_variant: $KSU_VARIANT" >&2
            exit 1
            ;;
        esac

        if [ "${{ inputs.use_latest_commits }}" = "true" ]; then
          echo "Cloning $KSU_VARIANT from branch tip: $KSU_BRANCH"
          git clone --branch "$KSU_BRANCH" "$KSU_REPO" /tmp/ksu-source
        else
          echo "Cloning $KSU_VARIANT with deep history for pinned commit"
          git clone "$KSU_REPO" /tmp/ksu-source
        fi

        cd /tmp/ksu-source

        if [ "${{ inputs.use_latest_commits }}" = "true" ]; then
          KSU_COMMIT=$(git rev-parse HEAD)
        else
          KSU_COMMIT=$(jq -er "$JSON_KEY" "$COMMITS_JSON_PATH" 2>/dev/null || git rev-parse HEAD)
          echo "Checking out pinned commit: $KSU_COMMIT"
          git fetch --depth=50 origin "$KSU_COMMIT"
          git checkout "$KSU_COMMIT"
        fi

        COMMITS_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "no-tag")

        echo "KSU Variant: $KSU_VARIANT"
        echo "KSU Version: $KSU_VERSION"
        echo "KSU Git Tag: $KSU_GIT_TAG"

        echo "KSU_VARIANT=$KSU_VARIANT" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV

    - name: Set release body
      run: |
        set -e

        RELEASE_NOTES_PATH="$RELEASE_NOTES"
        : > release_body.md

        python3 .github/scripts/render_release_body.py "$RELEASE_NOTES_PATH" > release_body.md

    - name: Publish release notes preview
      run: |
        {
          echo "## Release Notes Preview"
          echo
          cat release_body.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Download AnyKernel3 Artifacts
      uses: actions/download-artifact@v7
      with:
        path: release-assets
        pattern: '*-AK3'
        merge-multiple: false

    - name: Zip AnyKernel3 for Release
      run: |
        set -e
        shopt -s nullglob

        for dir in release-assets/*-AK3; do
          zip_name="${dir}.zip"
          rm -f "$zip_name"
          cd "$dir"
          zip -r -q -9 "../$(basename "$zip_name")" .
          cd - >/dev/null
        done

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        repository: ${{ env.RELEASE_REPO }}
        token: ${{ secrets.RELEASE_TOKEN || github.token }}
        tag_name: ${{ steps.tag.outputs.new_tag }}
        name: ${{ steps.release_meta.outputs.release_title }}
        body_path: release_body.md
        draft: false
        prerelease: ${{ inputs.release_type == 'Pre-Release' }}
        files: |
          release-assets/**/*.zip
          release-assets/**/*-boot*.img
