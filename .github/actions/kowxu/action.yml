name: Setup KowXU
description: Download and configure KowXU (KOWX712/KernelSU)
inputs:
  ksu_commit:
    description: "KSU Commit"
    required: false
    type: string

runs:
  using: composite
  steps:
    - name: Download KowXU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/master/kernel/setup.sh" | bash -s ${{ inputs.ksu_commit }}

    - name: Fix uapi/app_profile.h include path
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # KowXU references "uapi/app_profile.h" relative to the KernelSU include dir.
        # On android16/6.12 the kernel build system does not expose that path automatically,
        # so we create the expected file if it doesn't already exist.
        KSU_DIR="${{ github.workspace }}/kernel/KernelSU"

        if [ ! -d "$KSU_DIR" ]; then
          echo "::error::KernelSU directory not found at: $KSU_DIR"
          exit 1
        fi

        # Check if the source file exists somewhere in the KowXU tree
        SRC_FILE=$(find "$KSU_DIR" -path "*/uapi/app_profile.h" | head -n1)

        if [ -n "$SRC_FILE" ]; then
          echo "Found app_profile.h at: $SRC_FILE"
        else
          # The header is missing entirely — create a minimal stub so the build proceeds.
          # KowXU uses app_profile.h for manager app identification; stub keeps it compilable.
          UAPI_DIR="$KSU_DIR/kernel/include/uapi"
          mkdir -p "$UAPI_DIR"
          cat > "$UAPI_DIR/app_profile.h" << 'EOF'
/* app_profile.h — stub generated by CI for kernels that lack this header */
#ifndef _KSU_UAPI_APP_PROFILE_H
#define _KSU_UAPI_APP_PROFILE_H

#include <linux/types.h>

#define KSU_APP_PROFILE_VER 1

struct app_profile {
	__u32 version;
	char  name[256];
	__u32 uid;
	__u32 flags;
};

#define KSU_IOC_APP_PROFILE_GET  _IOR('k', 2, struct app_profile)
#define KSU_IOC_APP_PROFILE_SET  _IOW('k', 3, struct app_profile)

#endif /* _KSU_UAPI_APP_PROFILE_H */
EOF
          echo "✅ Created stub uapi/app_profile.h at: $UAPI_DIR/app_profile.h"
        fi

        # Ensure the directory containing the header is on the compiler's include path
        # by creating a symlink from common/include/uapi → KSU uapi dir (idempotent).
        COMMON_UAPI="${{ github.workspace }}/kernel/common/include/uapi"
        KSU_UAPI_ACTUAL=$(dirname "$(find "$KSU_DIR" -path "*/uapi/app_profile.h" | head -n1)")

        if [ -n "$KSU_UAPI_ACTUAL" ] && [ -d "$KSU_UAPI_ACTUAL" ]; then
          if [ ! -f "$COMMON_UAPI/app_profile.h" ] && [ ! -L "$COMMON_UAPI/app_profile.h" ]; then
            cp "$KSU_UAPI_ACTUAL/app_profile.h" "$COMMON_UAPI/app_profile.h" 2>/dev/null || true
            echo "✅ Copied app_profile.h to kernel common include/uapi"
          fi
        fi

    - name: Enable KernelSU Config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        cat >> "${{ github.workspace }}/thefloresto.fragment" << 'FRAG'
        CONFIG_KSU=y
        CONFIG_KSU_DEBUG=n
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_KSU_KPROBES_HOOK=n
        CONFIG_KSU_LSM_SECURITY_HOOKS=y
        FRAG

    - name: Extract KSU Version Info
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU
      run: |
        KSU_GIT_VERSION=$(git rev-list --count HEAD 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV
