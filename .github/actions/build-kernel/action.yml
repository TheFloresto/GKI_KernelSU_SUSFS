name: 'Build Kernel'
description: 'Builds all kernel versions using direct Makefile targets with ZyCromerZ'
inputs:
  bypass:
    description: 'Whether to add the bypass hack or not'
    required: true
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  ksu_variant:
    description: 'KSU Variant name for logs'
    required: false
    default: 'default'
  clean:
    description: 'Run make clean before building to ensure a fresh build'
    required: false
    default: 'true'
  make_jobs_override:
    description: 'Override CPU threads count for build (auto or number)'
    required: false
    default: 'auto'

runs:
  using: composite
  steps:
    - name: 'Activate Bypass'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [ "${{ inputs.bypass }}" = "true" ]; then
          if [[ ${{ inputs.version }} == "android14-6.1" || ${{ inputs.version }} == "android15-6.6" || ${{ inputs.version }} == "android16-6.12" ]]; then
            TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module/version.c"
          else
            TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module.c"
          fi

          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

          if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
            echo "Patch failed! 'return 1;' not found at bad_version:"
            grep -A 10 "bad_version:" "$TARGET_FILE" || true
            exit 1
          fi
        else
          echo "Bypass hack not applied as per input parameter."
        fi

    - name: 'Install Build Dependencies'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Install dependencies"
        sudo apt-get -o Acquire::Retries=3 update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          git curl ca-certificates build-essential clang lld llvm llvm-dev flex bison \
          libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
          libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
        sudo apt-get clean
        echo "✅ Dependencies installed"
        echo "::endgroup::"        

    - name: 'Setup ZyCromerZ Clang and Env'
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Downloading and extracting ZyCromerZ Clang"
        mkdir -p "$GITHUB_WORKSPACE/zycromerz-clang"
        cd "$GITHUB_WORKSPACE/zycromerz-clang"
        
        ASSET_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url' | head -n 1)
        
        if [ -z "$ASSET_URL" ]; then
          echo "::error::Не удалось найти .tar.gz архив через API релизов."
          exit 1
        fi
        
        echo "Downloading from: $ASSET_URL"
        wget -qO clang.tar.gz "$ASSET_URL"
        tar -xf clang.tar.gz
        rm clang.tar.gz
        echo "::endgroup::"

        CLANG_DIR="$GITHUB_WORKSPACE/zycromerz-clang"

        if [ ! -x "$CLANG_DIR/bin/clang" ]; then
          echo "::error::ZyCromerZ Clang install failed at $CLANG_DIR"
          ls -la "$CLANG_DIR" || true
          exit 1
        fi

        echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
        echo "CLANG_BIN_PATH=$CLANG_DIR/bin" >> "$GITHUB_ENV"

        CLANG_VER=$("$CLANG_DIR/bin/clang" --version | grep -oP 'version \K[0-9.]+' | head -n1)
        echo "CLANG_VERSION=$CLANG_VER" >> "$GITHUB_ENV"
        echo "KERNEL_ROOT=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"

        echo "ARM64_TOOLCHAIN=aarch64-linux-gnu-" >> "$GITHUB_ENV"
        echo "ARM32_TOOLCHAIN=arm-linux-gnueabi-" >> "$GITHUB_ENV"

    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        KSU_VARIANT: ${{ inputs.ksu_variant }}
        CLEAN_BUILD: ${{ inputs.clean }}
        MAKE_JOBS_OVERRIDE: ${{ inputs.make_jobs_override }}
        CLANG_BIN: ${{ env.CLANG_BIN_PATH }}
        ARM64_TOOLCHAIN: ${{ env.ARM64_TOOLCHAIN }}
        ARM32_TOOLCHAIN: ${{ env.ARM32_TOOLCHAIN }}
      run: |
        set -euo pipefail
        mkdir -p logs
        LOG_FILE="$GITHUB_WORKSPACE/logs/build-${KSU_VARIANT}.log"
        exec > >(tee -a "$LOG_FILE") 2>&1

        summarize_build_failure() {
          if [ ! -f "$LOG_FILE" ]; then
            return 0
          fi
          echo "::group::Build failure summary (${KSU_VARIANT})"
          echo "📄 Last 200 lines of $LOG_FILE"
          tail -n 200 "$LOG_FILE" || true
          echo
          echo "🔎 Matching error signatures"
          grep -nE 'error:|fatal error:|undefined reference|No rule to make target|FAILED:' "$LOG_FILE" | tail -n 80 || echo "No common error signature matched."
          echo "::endgroup::"
        }

        trap 'status=$?; if [ "$status" -ne 0 ]; then summarize_build_failure; fi; exit "$status"' EXIT

        cd kernel
        export ARCH=arm64
        export PATH="${CLANG_BIN}:/usr/lib/ccache:$PATH"
        export CROSS_COMPILE="${ARM64_TOOLCHAIN}"
        export CROSS_COMPILE_COMPAT="${ARM32_TOOLCHAIN}"
        export CCACHE_DIR="${LOG_FILE%/*}/.ccache"
        export CC="ccache ${CLANG_BIN}/clang"
        export CXX="ccache ${CLANG_BIN}/clang++"
        export HOSTCC="ccache ${CLANG_BIN}/clang"
        export HOSTCXX="ccache ${CLANG_BIN}/clang++"
        export LD="${CLANG_BIN}/ld.lld"
        export HOSTLD="${CLANG_BIN}/ld.lld"
        export AR="${CLANG_BIN}/llvm-ar"
        export HOSTAR="${CLANG_BIN}/llvm-ar"
        export NM="${CLANG_BIN}/llvm-nm"
        export OBJCOPY="${CLANG_BIN}/llvm-objcopy"
        export OBJDUMP="${CLANG_BIN}/llvm-objdump"
        export READELF="${CLANG_BIN}/llvm-readelf"
        export STRIP="${CLANG_BIN}/llvm-strip"
        export CLANG_TRIPLE="aarch64-linux-gnu-"

        if [ "${MAKE_JOBS_OVERRIDE}" = "auto" ]; then
          MAKE_JOBS="${BUILD_JOBS:-$(nproc)}"
        else
          MAKE_JOBS="${MAKE_JOBS_OVERRIDE}"
        fi
        export TMPDIR="/tmp"
        export TEMP="$TMPDIR"
        export TMP="$TMPDIR"
        export MAKEFLAGS="-j${MAKE_JOBS} -l$((MAKE_JOBS + 1))"
        START_TIME=$SECONDS

        # КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Очистка дерева ДО генерации конфигов
        if [ "${CLEAN_BUILD}" = "true" ]; then
          echo "🧹 Running make clean..."
          rm -rf out/
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 clean
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 mrproper
        fi

        # Генерируем .config на основе gki_defconfig
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
          READELF="$READELF" STRIP="$STRIP" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
          HOSTLD="$HOSTLD" HOSTAR="$HOSTAR" CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
          O=out gki_defconfig

        # Вшиваем флаги оптимизации/LTO
        cat << 'EOF' >> out/.config
        CONFIG_LTO_CLANG_THIN=y
        CONFIG_LTO_CLANG_FULL=n
        CONFIG_DEBUG_INFO=y
        CONFIG_DEBUG_INFO_BTF=y
        CONFIG_DEBUG_INFO_REDUCED=n
        CONFIG_DEBUG_INFO_COMPRESSED_NONE=y
        EOF

        make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
          READELF="$READELF" STRIP="$STRIP" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
          HOSTLD="$HOSTLD" HOSTAR="$HOSTAR" CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
          O=out syncconfig

        if grep -q '^CONFIG_SECURITY_SELINUX=y$' out/.config; then
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
            READELF="$READELF" STRIP="$STRIP" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" HOSTAR="$HOSTAR" CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            O=out security/selinux/
        fi

        echo "::group::Config Validation"
        if ! grep -q '^CONFIG_KSU=y' out/.config; then
          echo "::error::CONFIG_KSU=y не найден в итоговом конфиге!"
          exit 1
        fi
        echo "Config validation passed"
        echo "::endgroup::"

        # Запускаем компиляцию (старый блок удаления отсюда убран)
        make -j$MAKE_JOBS O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" \
          READELF="$READELF" STRIP="$STRIP" HOSTCC="$HOSTCC" HOSTCXX="$HOSTCXX" \
          HOSTLD="$HOSTLD" HOSTAR="$HOSTAR" CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
          HOSTCFLAGS="-Wno-incompatible-pointer-types-discards-qualifiers" \
          all

        trap - EXIT

        if [ -n "${GITHUB_ENV:-}" ]; then
          echo "BUILD_TIME=$((SECONDS - START_TIME))s" >> "$GITHUB_ENV"
        fi
        ccache -s | grep -E "(Cacheable calls|Hits|Misses|Hit rate|cache size)" || true

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        
        if [ -f "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image" ]; then
          echo "Found Image at kernel/out/arch/arm64/boot/Image"
          if [ "${{ inputs.bypass }}" = "true" ]; then
            cp "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image" "${{ github.workspace }}/AnyKernel3/Bypass-Image"
          else
            cp "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image" "${{ github.workspace }}/AnyKernel3/Image"
            echo "Kernel Version:"
            strings "${{ github.workspace }}/kernel/out/arch/arm64/boot/Image" | grep -m1 "^Linux version " || true
          fi
          exit 0
        fi

        echo "::error::Бинарник ядра (Image) не найден в out/arch/arm64/boot/!"
        exit 1

    - name: 'Patch AnyKernel3 for Bypass Hack'
      shell: bash
      if: ${{ inputs.bypass == 'true' }}
      working-directory: ${{ github.workspace }}/AnyKernel3
      run: |
        set -euo pipefail
        cp "${{ github.action_path }}/patches/bypass.patch" "${{ github.workspace }}/AnyKernel3/bypass.patch"
        patch -p1 < bypass.patch
