name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  bypass:
    description: 'Whether to add the bypass hack or not'
    required: true
  kernel_version:
    required: true
  sublevel:
    required: true
  os_patch_level:
    required: true    
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true   
  android_version:
    description: 'android version'
    required: true   
  ksu_variant:
    required: true

runs:
  using: composite
  steps:
    - name: 'Activate Bypass'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [ "${{ inputs.bypass }}" = "true" ]; then
          if [[ ${{ inputs.version }} == "android14-6.1" || ${{ inputs.version }} == "android15-6.6" || ${{ inputs.version }} == "android16-6.12" ]]; then
            TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module/version.c"
          else
            TARGET_FILE="${{ github.workspace }}/kernel/common/kernel/module.c"
          fi

          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

          if ! grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
            echo "Patch failed! 'return 1;' not found at bad_version:"
            grep -A 10 "bad_version:" "$TARGET_FILE" || true
            exit 1
          fi
        else
          echo "Bypass hack not applied as per input parameter."
        fi

    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config
  
    - name: 'Install Build Dependencies'
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Install dependencies"
        sudo apt-get -o Acquire::Retries=3 update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          git curl ca-certificates build-essential clang lld llvm llvm-dev flex bison \
          libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
          libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
        sudo apt-get clean
        echo "✅ Dependencies installed"
        echo "::endgroup::"        

    - name: 'Setup ZyCromerZ Clang and Env'
      if: true
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Downloading and extracting ZyCromerZ Clang"
        mkdir -p "$GITHUB_WORKSPACE/zycromerz-clang"
        cd "$GITHUB_WORKSPACE/zycromerz-clang"
        
        # Обходим лимиты API GitHub, получая прямую ссылку из HTML-страницы релиза
        ASSET_PATH=$(curl -sL https://github.com/ZyCromerZ/Clang/releases/expanded_assets/23.0.0git-20260130-release | grep -oP 'href="\K[^"]+\.tar\.gz' | head -n 1)
        
        if [ -z "$ASSET_PATH" ]; then
          echo "::error::Не удалось найти .tar.gz архив на странице релиза."
          exit 1
        fi
        
        ASSET_URL="https://github.com$ASSET_PATH"
        echo "Downloading from: $ASSET_URL"
        
        wget -qO clang.tar.gz "$ASSET_URL"
        tar -xf clang.tar.gz
        rm clang.tar.gz
        echo "::endgroup::"

        CLANG_DIR="$GITHUB_WORKSPACE/zycromerz-clang"

        # Проверка, что бинарник на месте
        if [ ! -x "$CLANG_DIR/bin/clang" ]; then
          echo "::error::ZyCromerZ Clang install failed or layout unexpected at $CLANG_DIR"
          ls -la "$CLANG_DIR" || true
          exit 1
        fi

        echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
        echo "CLANG_BIN_PATH=$CLANG_DIR/bin" >> "$GITHUB_ENV"

        CLANG_VER=$("$CLANG_DIR/bin/clang" --version | grep -oP 'version \K[0-9.]+' | head -n1)
        echo "CLANG_VERSION=$CLANG_VER" >> "$GITHUB_ENV"
        echo "KERNEL_ROOT=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"
        echo "FRAGMENT=$GITHUB_WORKSPACE/thefloresto.fragment" >> "$GITHUB_ENV"

        "$CLANG_DIR/bin/clang" --version | head -2

    - name: Customize Kernel Branding
      shell: bash
      run: |
        set -euo pipefail
        echo "Customize Kernel Branding"
        
        ANDROID_VER="${{ inputs.android_version }}" 
        
        CUSTOM_LOCALVERSION="-${ANDROID_VER}-TheFloresto"
        
        echo "CUSTOM_LOCALVERSION=${CUSTOM_LOCALVERSION}" >> "$GITHUB_ENV"
                
        echo "Branding set to: $CUSTOM_LOCALVERSION"
        
    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel with ccache optimization"

        KERNEL_ROOT="${KERNEL_ROOT:-$GITHUB_WORKSPACE/kernel}"
        FRAGMENT="${FRAGMENT:-$GITHUB_WORKSPACE/thefloresto.fragment}"

        cd "$KERNEL_ROOT/common"
        : > "$KERNEL_ROOT/common/.scmversion"

        export PYTHONWARNINGS="${PYTHONWARNINGS}"

        echo "Getting last commit timestamp from kernel source..."
        COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
        COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

        WORKSPACE="${GITHUB_WORKSPACE}"
        MAP="-fdebug-prefix-map=${WORKSPACE}=."
        MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
        FPMAP="-ffile-prefix-map=${WORKSPACE}=."

        export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
        export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"

        export LLVM=1 LLVM_IAS=1
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

        if [ -x "$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/pahole" ]; then
          export PAHOLE="$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/pahole"
        else
          export PAHOLE="$(which pahole || true)"
        fi
        echo "Using pahole: $PAHOLE ($($PAHOLE --version 2>/dev/null || echo 'unknown version'))"

        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
        export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

        set +u
        source "$KERNEL_ROOT/build/kernel/_setup_env.sh" 2>/dev/null || true
        set -u

        export LDCACHE_DIR="$GITHUB_WORKSPACE/lto_cache"
        mkdir -p "$LDCACHE_DIR"
        echo '#!/bin/bash' > "$KERNEL_ROOT/common/ld-wrapper"
        echo 'ld.lld "$@" --thinlto-cache-dir=$LDCACHE_DIR --thinlto-jobs=$(nproc --all)' >> "$KERNEL_ROOT/common/ld-wrapper"
        chmod +x "$KERNEL_ROOT/common/ld-wrapper"

        export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
        export KBUILD_BUILD_TIMESTAMP="${KBUILD_BUILD_TIMESTAMP:-$(date -u -d "@$COMMIT_TIMESTAMP" '+%a %b %e %H:%M:%S UTC %Y')}"
        export KBUILD_BUILD_USER="${BUILD_USER:-thefloresto-labs}"
        export KBUILD_BUILD_HOST="${BUILD_HOST:-ubuntu-build}"
        export KBUILD_BUILD_VERSION=1

        echo "Build timestamp: $KBUILD_BUILD_TIMESTAMP (from commit $COMMIT_HASH)"
        echo "SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"

        export CC="ccache clang"
        export CXX="ccache clang++"
        export HOSTCC="ccache clang"
        export HOSTCXX="ccache clang++"

        export PATH="/usr/lib/ccache:${CLANG_BIN_PATH:-}:${KERNEL_ROOT}/prebuilts/kernel-build-tools/linux-x86/bin/:${KERNEL_ROOT}/prebuilts/kernel-build-tools/linux_musl-x86/bin/:${PATH}"

        OUT=out
        mkdir -p "$OUT"

        echo "============================================"
        echo "Compiler & ccache Verification"
        echo "which clang: $(which clang)"
        echo "CC: $CC"
        echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
        ccache -s || true
        echo "============================================"

        make LD="$KERNEL_ROOT/common/ld-wrapper" HOSTLD="$KERNEL_ROOT/common/ld-wrapper" O="$OUT" gki_defconfig

        if [ -f "$FRAGMENT" ]; then
          ./scripts/kconfig/merge_config.sh -m -O "$OUT" "$OUT/.config" "$FRAGMENT"
        else
          echo "::warning::Fragment not found at $FRAGMENT, skipping merge_config"
        fi

        LOCAL_LOCALVERSION="${CUSTOM_LOCALVERSION:--TheFloresto}"
        if [ -n "${LOCAL_LOCALVERSION:-}" ]; then
          scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${LOCAL_LOCALVERSION}"
          scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
          sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion || true
        fi

        scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE
        scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
        
        KCFLAGS_EXTRA="-O2"

        scripts/config --file "$OUT/.config" -e LTO_CLANG
        scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN
        scripts/config --file "$OUT/.config" -d LTO_CLANG_NONE
        scripts/config --file "$OUT/.config" -d LTO_CLANG_FULL

        make LD="$KERNEL_ROOT/common/ld-wrapper" HOSTLD="$KERNEL_ROOT/common/ld-wrapper" O="$OUT" olddefconfig

        KCFLAGS="$KCFLAGS -Wno-error -pipe -fno-stack-protector -Wno-strict-prototypes -Wno-deprecated-non-prototype ${KCFLAGS_EXTRA}"
        KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"

        echo "============================================"
        echo "Build Configuration"
        echo "Kernel: ${KERNEL_VERSION:-?}.${SUBLEVEL:-?}"
        echo "Android: ${ANDROID_VERSION:-?}"
        echo "Variant: ${INPUT_VARIANT:-unknown}"
        echo "ksu_variant: ${INPUT_KSU_VARIANT:-unknown}"
        echo "============================================"

        BUILD_START=$(date +%s)
        make LD="$KERNEL_ROOT/common/ld-wrapper" HOSTLD="$KERNEL_ROOT/common/ld-wrapper" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" 2>&1 | tee build.log

        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - BUILD_START))
        echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

        IMG="$PWD/$OUT/arch/arm64/boot/Image"
        
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image missing"
          echo "::group::Last 100 lines of build log"
          tail -n 100 build.log || echo "Build log not available"
          echo "::endgroup::"
          exit 1
        fi

        echo "IMG=$IMG" >> "$GITHUB_ENV"

        IMG_SIZE=$(stat -c%s "$IMG")
        echo "============================================"
        echo "Build Completed Successfully"
        echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"

        echo ""
        echo "ccache Post-Build Statistics"
        echo "============================================"
        ccache -s
        echo "============================================"
        echo "::endgroup::"

    - name: 'Check name'
      shell: bash
      run: |
        set -euo pipefail
        KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)
        echo "Kernel Uname: $KERNEL_UNAME"
        echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        
        if [ -f "$IMG" ]; then
          echo "Found Image at $IMG"
          if [[ ${{ inputs.bypass }} == "true" ]]; then
            cp "$IMG" "${{ github.workspace }}/AnyKernel3/Bypass-Image"
          else
            cp "$IMG" "${{ github.workspace }}/AnyKernel3/Image"
            echo "Kernel Version:"
            strings "$IMG" | grep -m1 "^Linux version "
          fi
          exit 0
        fi

        echo "::error::Image not found at $IMG"
        exit 1

    - name: 'Patch AnyKernel3 for Bypass Hack'
      shell: bash
      if: ${{ inputs.bypass == 'true' }}
      working-directory: ${{ github.workspace }}/AnyKernel3
      run: |
        set -euo pipefail
        cp ${{ github.action_path }}/patches/bypass.patch "${{ github.workspace }}/AnyKernel3/bypass.patch"
        patch -p1 < bypass.patch
