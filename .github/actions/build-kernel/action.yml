name: 'Build Kernel'
description: 'Build kernel directly with greenforce clang via make (all GKI versions)'

runs:
  using: composite
  steps:
  - name: 'Install Build Dependencies'
    shell: bash
    run: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        flex bison libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
        libxml2-utils rsync unzip dwarves bc dos2unix kmod libdw-dev elfutils \
        cpio python3 ccache lld llvm
      ccache --version | head -1 || true

  - name: 'Setup Greenforce Clang'
    shell: bash
    working-directory: ${{ github.workspace }}
    run: |
      set -euo pipefail

      CLANG_DIR="/home/runner/greenforce-clang"

      if [ ! -x "$CLANG_DIR/bin/clang" ]; then
        rm -rf "$CLANG_DIR"
        mkdir -p "$CLANG_DIR"

        # Greenforce ships a single-branch repo containing prebuilt toolchain binaries.
        # Shallow clone to keep CI fast.
        git clone --depth=1 https://github.com/greenforce-project/greenforce_clang "$CLANG_DIR" \
          || (rm -rf "$CLANG_DIR" && git clone --depth=1 https://github.com/greenforce-project/greenforce_clang.git "$CLANG_DIR")
      fi

      if [ ! -x "$CLANG_DIR/bin/clang" ]; then
        echo "::error::greenforce clang clone failed or layout unexpected"
        ls -la "$CLANG_DIR" || true
        exit 1
      fi

      echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
      echo "GREENFORCE_CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      "$CLANG_DIR/bin/clang" --version | head -2

  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail

      export KBUILD_BUILD_USER="${BUILD_USER:-thefloresto-labs}"
      export KBUILD_BUILD_HOST="${BUILD_HOST:-ubuntu-build}"
      echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER" >> "$GITHUB_ENV"
      echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" >> "$GITHUB_ENV"

      GKI_KCONFIG_FRAGMENT_PATH="${{ github.workspace }}/thefloresto.fragment"
      CLANG_BIN="${GREENFORCE_CLANG_DIR}/bin"
      export PATH="$CLANG_BIN:$PATH"

      # Wrap compiler with ccache if available (cache-setup configures buckets/dirs).
      if command -v ccache >/dev/null 2>&1; then
        CC_CMD="ccache clang"
        HOSTCC_CMD="ccache clang"
        HOSTCXX_CMD="ccache clang++"
      else
        CC_CMD="clang"
        HOSTCC_CMD="clang"
        HOSTCXX_CMD="clang++"
      fi

      MAKE_ARGS=(
        O=out
        ARCH=arm64
        LLVM=1
        LLVM_IAS=1
        CC="$CC_CMD"
        HOSTCC="$HOSTCC_CMD"
        HOSTCXX="$HOSTCXX_CMD"
        LD=ld.lld
        AR=llvm-ar
        NM=llvm-nm
        OBJCOPY=llvm-objcopy
        OBJDUMP=llvm-objdump
        STRIP=llvm-strip
        READELF=llvm-readelf
        HOSTAR=llvm-ar
        HOSTLD=ld.lld
      )

      mkdir -p out

      make "${MAKE_ARGS[@]}" gki_defconfig

      if [ -f "$GKI_KCONFIG_FRAGMENT_PATH" ]; then
        scripts/kconfig/merge_config.sh -m -O out out/.config "$GKI_KCONFIG_FRAGMENT_PATH"
        make "${MAKE_ARGS[@]}" olddefconfig
      fi

      # Force ThinLTO if not already set by fragment
      if ! grep -q '^CONFIG_LTO_CLANG_THIN=y' out/.config; then
        scripts/config --file out/.config \
          -d LTO_NONE \
          -e LTO_CLANG_THIN
        make "${MAKE_ARGS[@]}" olddefconfig
      fi

      make "${MAKE_ARGS[@]}" -j"$(nproc)" Image Image.lz4

  - name: 'Print Kernel Uname'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail

      IMG=""
      for candidate in \
        common/out/arch/arm64/boot/Image \
        out/*/dist/Image \
        bazel-bin/common/kernel_aarch64/Image \
        out/arch/arm64/boot/Image; do
        for f in $candidate; do
          if [ -f "$f" ]; then
            IMG="$f"
            break 2
          fi
        done
      done

      if [ -z "$IMG" ]; then
        echo "::warning::Kernel Image not found for KERNEL_UNAME extraction"
        exit 0
      fi

      KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)
      echo "Kernel Uname: $KERNEL_UNAME"
      echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
