name: 'Build Kernel'
description: 'Builds kernel using the clang-based toolchain (build.sh or make with LLVM)'

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        FRAGMENT="$GITHUB_WORKSPACE/thefloresto.fragment"

        if [ -f "build/build.sh" ]; then
          SKIP_MRPROPER=1 \
            GKI_DEFCONFIG_FRAGMENT="$FRAGMENT" \
            BUILD_CONFIG=common/build.config.gki.aarch64 \
            LLVM=1 LLVM_IAS=1 \
            build/build.sh
        else
          OUT_DIR="out/${ANDROID_VERSION}-${KERNEL_VERSION}"
          mkdir -p "$OUT_DIR"

          cp -f "$FRAGMENT" "common/arch/arm64/configs/thefloresto.fragment"
          KCONFIG_CONFIG="$OUT_DIR/.config" \
            scripts/kconfig/merge_config.sh -O "$OUT_DIR" \
              common/arch/arm64/configs/gki_defconfig \
              common/arch/arm64/configs/thefloresto.fragment

          make -C common \
            O="$GITHUB_WORKSPACE/kernel/$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld \
            -j"$(nproc)" \
            Image Image.lz4
        fi
