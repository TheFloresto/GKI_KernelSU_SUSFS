name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'

runs:
  using: composite
  steps:
  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail

      export KBUILD_BUILD_USER="${BUILD_USER:-thefloresto-labs}"
      export KBUILD_BUILD_HOST="${BUILD_HOST:-ubuntu-build}"
      echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER" >> "$GITHUB_ENV"
      echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST" >> "$GITHUB_ENV"

      GKI_KCONFIG_FRAGMENT_PATH="${{ github.workspace }}/thefloresto.fragment"
      GKI_DEFCONFIG_WRAPPER_PATH="${{ github.workspace }}/thefloresto.wrap.sh"

      cat > "${GKI_DEFCONFIG_WRAPPER_PATH}" <<EOF
      append_cmd POST_DEFCONFIG_CMDS 'if [ -f "${GKI_KCONFIG_FRAGMENT_PATH}" ]; then \${KERNEL_DIR}/scripts/kconfig/merge_config.sh -m -O \${OUT_DIR} \${OUT_DIR}/.config "${GKI_KCONFIG_FRAGMENT_PATH}"; fi && (cd \${KERNEL_DIR} && make O=\${OUT_DIR} olddefconfig)'
      EOF

      # Override expensive GKI build.sh artifact defaults we do not need in CI.
      GKI_BUILD_CONFIG_FRAGMENT_PATH="${{ github.workspace }}/gki_build_overrides.fragment"
      cat > "${GKI_BUILD_CONFIG_FRAGMENT_PATH}" <<'EOF'
      BUILD_GKI_ARTIFACTS=
      BUILD_GKI_CERTIFICATION_TOOLS=0
      BUILD_SYSTEM_DLKM=0

      # Skip heavy packaging steps we don't need in CI
      SKIP_VENDOR_BOOT=1
      SKIP_EXT_MODULES=1
      SKIP_CP_KERNEL_HDR=1
      SKIP_MRPROPER=1
      EOF

      if [ -f "build/build.sh" ]; then
        #SKIP_MRPROPER=1 \
        LTO=thin \
        GKI_DEFCONFIG_FRAGMENT="${GKI_DEFCONFIG_WRAPPER_PATH}" \
        GKI_BUILD_CONFIG_FRAGMENT="${GKI_BUILD_CONFIG_FRAGMENT_PATH}" \
        BUILD_CONFIG=common/build.config.gki.aarch64 \
        build/build.sh -j"$(nproc)" \
        CC="$CC" \
        CXX="$CXX" \
        HOSTCC="$HOSTCC" \
        HOSTCXX="$HOSTCXX" \
        LD="$LD" \
        HOSTLD="$HOSTLD"
      else
        cp "${{ github.workspace }}/thefloresto.fragment" common/arch/arm64/configs/thefloresto.fragment
        tools/bazel build \
          --linkopt="--thinlto-cache-dir=/home/runner/.ld_cache" \
          --config=fast \
          --defconfig_fragment=//common:arch/arm64/configs/thefloresto.fragment \
          --disk_cache="$BAZEL_CACHE_DIR" \
          //common:kernel_aarch64
      fi

  - name: 'Print Kernel Uname'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail

      IMG=""
      for candidate in \
        out/*/dist/Image \
        bazel-bin/common/kernel_aarch64/Image \
        common/out/arch/arm64/boot/Image \
        out/arch/arm64/boot/Image; do
        for f in $candidate; do
          if [ -f "$f" ]; then
            IMG="$f"
            break 2
          fi
        done
      done

      if [ -z "$IMG" ]; then
        echo "::warning::Kernel Image not found for KERNEL_UNAME extraction"
        exit 0
      fi

      KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1 || true)
      echo "Kernel Uname: $KERNEL_UNAME"
      echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
