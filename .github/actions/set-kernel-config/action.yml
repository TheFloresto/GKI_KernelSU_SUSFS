name: 'Set Kernel Config'
description: 'Patch gki_defconfig directly (add or modify entries)'

inputs:
  config_list:
    required: false
    description: "Kernel config lines as a string"
    default: ""
  fragment_file:
    required: false
    description: "Path to a fragment file with configs"
    default: ""

runs:
  using: composite
  steps:
    - name: Patch gki_defconfig
      shell: bash
      run: |
        set -euo pipefail

        # Проверяем правильный путь к дефконфигу в структуре исходников Google
        if [ -f "${{ github.workspace }}/kernel/arch/arm64/configs/gki_defconfig" ]; then
          DEFCONFIG="${{ github.workspace }}/kernel/arch/arm64/configs/gki_defconfig"
        elif [ -f "${{ github.workspace }}/kernel/common/arch/arm64/configs/gki_defconfig" ]; then
          DEFCONFIG="${{ github.workspace }}/kernel/common/arch/arm64/configs/gki_defconfig"
        else
          echo "::error::gki_defconfig не найден ни в kernel/, ни в kernel/common/"
          exit 1
        fi

        echo "Using defconfig target: $DEFCONFIG"

        apply_line() {
          local line="$1"
          line="$(echo "$line" | xargs)"

          # Пропускаем пустые строки и комментарии
          [[ -z "$line" || "$line" == \#* ]] && return

          local key value
          if [[ "$line" == *"="* ]]; then
            key="${line%%=*}"
            value="${line#*=}"
          else
            key="$line"
            value="y"
          fi

          echo "Configuring: $key=$value"

          if grep -q "^$key=" "$DEFCONFIG"; then
            sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
          elif grep -q "^# $key is not set" "$DEFCONFIG"; then
            sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
          else
            echo "$key=$value" >> "$DEFCONFIG"
          fi
        }

        # 1. Сначала обрабатываем явный список из строки inputs.config_list
        if [ -n "${{ inputs.config_list }}" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            apply_line "$line"
          done <<< "${{ inputs.config_list }}"
        fi

        # 2. Затем обрабатываем файл фрагмента, если он существует и передан
        if [ -n "${{ inputs.fragment_file }}" ] && [ -f "${{ inputs.fragment_file }}" ]; then
          echo "Processing fragment file: ${{ inputs.fragment_file }}"
          while IFS= read -r line || [ -n "$line" ]; do
            apply_line "$line"
          done < "${{ inputs.fragment_file }}"
        fi
