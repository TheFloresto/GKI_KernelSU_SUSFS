name: 'Prepare AnyKernel3'
description: 'Copies built Image into AnyKernel3 folder'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        KERNEL_OUT_DIR="$GITHUB_WORKSPACE/kernel/out/$ANDROID_VERSION-$KERNEL_VERSION"
        COMMON_OUT_DIR="$GITHUB_WORKSPACE/kernel/common/out"

        if [ -f "$KERNEL_OUT_DIR/dist/Image" ]; then
          cp "$KERNEL_OUT_DIR/dist/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"
          exit 0
        fi

        if [ -f "$KERNEL_OUT_DIR/arch/arm64/boot/Image" ]; then
          cp "$KERNEL_OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"
          exit 0
        fi

        if [ -f "$COMMON_OUT_DIR/arch/arm64/boot/Image" ]; then
          cp "$COMMON_OUT_DIR/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/AnyKernel3/Image"
          exit 0
        fi

        echo "Error: could not locate built kernel Image under $KERNEL_OUT_DIR or $COMMON_OUT_DIR"
        exit 1
