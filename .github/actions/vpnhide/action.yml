name: 'Setup VPNHide'
description: 'Clones the VPNHide backend repository, applies patches and configures built-in modules'
inputs:
  version:
    description: 'Kernel version (e.g., android15-6.6)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Clone VPNHide Backend Repository
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/soranerai/vpnhide_next_backend.git vpnhide_backend

    - name: Apply VPNHide Patches
      shell: bash
      run: |
        set -euo pipefail
        # Run the apply.sh script targeting the common kernel folder
        bash vpnhide_backend/kpatch/scripts/apply.sh "${{ github.workspace }}/kernel/common" "${{ inputs.version }}"

    - name: Configure VPNHide
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail

        # 1. Append CONFIG_VPNHIDE to gki_defconfig
        CFG_FILE="arch/arm64/configs/gki_defconfig"
        if ! grep -q "CONFIG_VPNHIDE" "$CFG_FILE"; then
          echo "Appending CONFIG_VPNHIDE=y to $CFG_FILE..."
          echo "CONFIG_VPNHIDE=y" >> "$CFG_FILE"
        fi

        # 2. Disable check_defconfig in BUILD.bazel if present
        BUILD_BAZEL="BUILD.bazel"
        if [ -f "$BUILD_BAZEL" ]; then
          sed -i '/check_defconfig =/d' "$BUILD_BAZEL"
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' "$BUILD_BAZEL"
          echo "Disabled check_defconfig in BUILD.bazel"
        fi

    - name: Cleanup Backend Repository
      shell: bash
      run: |
        rm -rf vpnhide_backend
