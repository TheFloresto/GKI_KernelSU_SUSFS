name: Fetch Latest Commits
description: "Fetches the latest commit hashes for the selected KernelSU variant, AnyKernel3, Kernel Patches, SUSFS, and BBG"
inputs:
  ksu_commit:
    description: "Optional: Specific KernelSU ref/commit to use"
    required: false
    default: ""
  ksu_variant:
    description: "KernelSU Variant (Next, KSU, MKSU, KowSU, ReSukiSU, WKSU)"
    required: false
    default: "Next"
outputs:
  ksu_commit:
    description: "Resolved KSU Commit"
    value: ${{ steps.commits.outputs.ksu_commit }}
  ksu_tag:
    description: "KSU Tag (best effort)"
    value: ${{ steps.commits.outputs.ksu_tag }}
  anykernel_commit:
    description: "AnyKernel3 Commit"
    value: ${{ steps.commits.outputs.anykernel_commit }}
  patches_commit:
    description: "Kernel Patches Commit"
    value: ${{ steps.commits.outputs.patches_commit }}
  susfs_commit:
    description: "SUSFS Commit (Map)"
    value: ${{ steps.commits.outputs.susfs_commit }}
  bbg_commit:
    description: "BBG Commit"
    value: ${{ steps.commits.outputs.bbg_commit }}

runs:
  using: "composite"
  steps:
    - name: Get Latest Commits
      id: commits
      shell: bash
      run: |
        set -euo pipefail

        get_commit() {
          git ls-remote "$1" "$2" | awk '{print $1}'
        }

        get_tag_for_commit() {
          repo="$1"
          commit="$2"
          git ls-remote --tags "$repo" | awk -v c="$commit" '$1==c && $2 ~ /^refs\/tags\// {print $2}' \
            | sed -E 's#^refs/tags/##; s#\^\{\}$##' \
            | sort -V \
            | tail -n 1
        }

        VARIANT="${{ inputs.ksu_variant }}"
        [ -z "$VARIANT" ] && VARIANT="Next"

        case "$VARIANT" in
          Next)
            KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
            KSU_DEFAULT_BRANCH="dev"
            ;;
          KSU)
            KSU_REPO="https://github.com/tiann/KernelSU.git"
            KSU_DEFAULT_BRANCH="main"
            ;;
          MKSU)
            KSU_REPO="https://github.com/5ec1cff/KernelSU.git"
            KSU_DEFAULT_BRANCH="main"
            ;;
          KowSU)
            KSU_REPO="https://github.com/KOWX712/KernelSU.git"
            KSU_DEFAULT_BRANCH="master"
            ;;
          ReSukiSU)
            KSU_REPO="https://github.com/ShirkNeko/SukiSU-Ultra.git"
            KSU_DEFAULT_BRANCH="main"
            ;;
          WKSU)
            KSU_REPO="https://github.com/WildKernels/Wild_KSU.git"
            KSU_DEFAULT_BRANCH="stable"
            ;;
          *)
            echo "Unknown ksu_variant: $VARIANT"
            exit 1
            ;;
        esac

        echo "KSU variant: $VARIANT (repo=$KSU_REPO, default=$KSU_DEFAULT_BRANCH)"

        if [ -n "${{ inputs.ksu_commit }}" ]; then
          input_ref="${{ inputs.ksu_commit }}"
          resolved_commit="$(get_commit "$KSU_REPO" "$input_ref")"
          if [ -z "$resolved_commit" ]; then
            resolved_commit="$(get_commit "$KSU_REPO" "refs/heads/$input_ref")"
          fi
          if [ -z "$resolved_commit" ]; then
            resolved_commit="$(get_commit "$KSU_REPO" "refs/tags/$input_ref")"
          fi
          if [ -n "$resolved_commit" ]; then
            ksu_commit="$resolved_commit"
          else
            ksu_commit="$input_ref"
          fi
          echo "Using provided KSU commit: $ksu_commit"
        else
          ksu_commit=$(get_commit "$KSU_REPO" "refs/heads/$KSU_DEFAULT_BRANCH")
          echo "KSU ($VARIANT): $ksu_commit"
        fi
        echo "ksu_commit=$ksu_commit" >> $GITHUB_OUTPUT

        KSU_TAG="$(get_tag_for_commit "$KSU_REPO" "$ksu_commit")"
        echo "KSU Tag: ${KSU_TAG:-None}"
        echo "ksu_tag=$KSU_TAG" >> $GITHUB_OUTPUT

        # AnyKernel3
        AK3_COMMIT=$(get_commit "https://github.com/TheFloresto/AnyKernel3.git" "refs/heads/gki-2.0")
        echo "AnyKernel3: $AK3_COMMIT"
        echo "anykernel_commit=$AK3_COMMIT" >> $GITHUB_OUTPUT

        # Kernel Patches
        PATCHES_COMMIT=$(get_commit "https://github.com/WildKernels/kernel_patches.git" "HEAD")
        echo "Kernel Patches: $PATCHES_COMMIT"
        echo "patches_commit=$PATCHES_COMMIT" >> $GITHUB_OUTPUT

        # SUSFS (using gitlab) - Fetch all relevant branches
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
        echo "Fetching SUSFS commits for all branches..."

        BRANCHES=(
          "gki-android12-5.10"
          "gki-android13-5.10"
          "gki-android13-5.15"
          "gki-android14-5.15"
          "gki-android14-6.1"
          "gki-android15-6.6"
          "gki-android16-6.12"
        )

        SUSFS_MAP=""
        for branch in "${BRANCHES[@]}"; do
          COMMIT=$(get_commit "$SUSFS_REPO" "refs/heads/$branch")
          if [ -n "$COMMIT" ]; then
             echo "  $branch: $COMMIT"
             if [ -z "$SUSFS_MAP" ]; then
               SUSFS_MAP="$branch:$COMMIT"
             else
               SUSFS_MAP="$SUSFS_MAP,$branch:$COMMIT"
             fi
          else
             echo "  $branch: Not found"
          fi
        done

        echo "susfs_commit=$SUSFS_MAP" >> $GITHUB_OUTPUT

        # BBG
        BBG_COMMIT=$(get_commit "https://github.com/vc-teahouse/Baseband-guard.git" "refs/heads/main")
        echo "BBG: $BBG_COMMIT"
        echo "bbg_commit=$BBG_COMMIT" >> $GITHUB_OUTPUT
