name: Fetch Latest Commits
description: "Fetches the latest commit hashes for KSU variant, AnyKernel3, Kernel Patches, and SUSFS"
inputs:
  ksu_commit:
    description: "Optional: Specific KSU commit to use"
    required: false
    default: ""
  ksu_variant:
    description: "KSU variant (WKSU, Next, KSU, MKSU, KowXU, ReSukiSU)"
    required: false
    default: "WKSU"
outputs:
  ksu_commit:
    description: "KSU Commit"
    value: ${{ steps.commits.outputs.ksu_commit }}
  anykernel_commit:
    description: "AnyKernel3 Commit"
    value: ${{ steps.commits.outputs.anykernel_commit }}
  patches_commit:
    description: "Kernel Patches Commit"
    value: ${{ steps.commits.outputs.patches_commit }}
  susfs_commit:
    description: "SUSFS Commit (Map)"
    value: ${{ steps.commits.outputs.susfs_commit }}

runs:
  using: "composite"
  steps:
    - name: Get Latest Commits
      id: commits
      shell: bash
      run: |
        get_commit() {
          git ls-remote "$1" "$2" | awk '{print $1}'
        }

        echo "Fetching latest commits for variant: ${{ inputs.ksu_variant }}"

        # Resolve KSU repo/branch by variant
        case "${{ inputs.ksu_variant }}" in
          "WKSU")     KSU_REPO="https://github.com/WildKernels/Wild_KSU.git";            KSU_REF="refs/heads/canary"     ;;
          "Next")     KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git";     KSU_REF="refs/heads/next"       ;;
          "KSU")      KSU_REPO="https://github.com/tiann/KernelSU.git";                  KSU_REF="refs/heads/main"       ;;
          "MKSU")     KSU_REPO="https://github.com/5ec1cff/KernelSU.git";                KSU_REF="refs/heads/main"       ;;
          "KowXU")    KSU_REPO="https://github.com/KOWX712/KernelSU.git";                KSU_REF="refs/heads/master"     ;;
          "ReSukiSU") KSU_REPO="https://github.com/ShirkNeko/SukiSU-Ultra.git";          KSU_REF="refs/heads/main"       ;;
          *)          KSU_REPO="https://github.com/WildKernels/Wild_KSU.git";            KSU_REF="refs/heads/canary"     ;;
        esac

        if [ -n "${{ inputs.ksu_commit }}" ]; then
          resolved=$(get_commit "$KSU_REPO" "${{ inputs.ksu_commit }}")
          ksu_commit="${resolved:-${{ inputs.ksu_commit }}}"
          echo "Using provided KSU commit: $ksu_commit"
        else
          ksu_commit=$(get_commit "$KSU_REPO" "$KSU_REF")
          echo "${{ inputs.ksu_variant }}: $ksu_commit"
        fi
        echo "ksu_commit=$ksu_commit" >> $GITHUB_OUTPUT

        # AnyKernel3
        AK3_COMMIT=$(get_commit "https://github.com/TheFloresto/AnyKernel3.git" "refs/heads/gki-2.0")
        echo "AnyKernel3: $AK3_COMMIT"
        echo "anykernel_commit=$AK3_COMMIT" >> $GITHUB_OUTPUT

        # Kernel Patches
        PATCHES_COMMIT=$(get_commit "https://github.com/TheWildJames/kernel_patches.git" "HEAD")
        echo "Kernel Patches: $PATCHES_COMMIT"
        echo "patches_commit=$PATCHES_COMMIT" >> $GITHUB_OUTPUT

        # SUSFS
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
        BRANCHES=(
          "gki-android12-5.10"
          "gki-android13-5.10"
          "gki-android13-5.15"
          "gki-android14-5.15"
          "gki-android14-6.1"
          "gki-android15-6.6"
          "gki-android16-6.12"
        )

        SUSFS_MAP=""
        for branch in "${BRANCHES[@]}"; do
          COMMIT=$(get_commit "$SUSFS_REPO" "refs/heads/$branch")
          if [ -n "$COMMIT" ]; then
            echo "  $branch: $COMMIT"
            if [ -z "$SUSFS_MAP" ]; then
              SUSFS_MAP="$branch:$COMMIT"
            else
              SUSFS_MAP="$SUSFS_MAP,$branch:$COMMIT"
            fi
          else
            echo "  $branch: Not found"
          fi
        done

        echo "susfs_commit=$SUSFS_MAP" >> $GITHUB_OUTPUT
