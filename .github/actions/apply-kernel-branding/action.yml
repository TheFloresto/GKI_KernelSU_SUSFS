name: 'Apply Kernel Branding'
description: 'Apply Nerest kernel branding to kernel version string'
inputs:
  build_type:
    description: 'Build type (Normal, Bypass, etc.)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 5.10, 6.1, 6.6)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        echo "BUILD_USER=TheFloresto-labs" >> "$GITHUB_ENV"
        echo "BUILD_HOST=ubuntu-build" >> "$GITHUB_ENV"
        echo "BUILD_TIMESTAMP=Sun Jun 15 14:56:02 UTC 2025" >> "$GITHUB_ENV
