name: 'Clean Kernel Flags'
description: 'Clean dirty flags'

runs:
  using: "composite"
  steps:
    - name: Clean Dirty Flags and ABI Exports
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Strip -dirty / -maybe-dirty markers produced by the clang/make based build.
        if [ -f "common/scripts/setlocalversion" ]; then
          sed -i 's/-dirty//' common/scripts/setlocalversion
        fi

        if [ -f "build/kernel/kleaf/impl/stamp.bzl" ]; then
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl
        fi

        # Commit changes to avoid dirty state during build
        cd ${{ github.workspace }}/kernel/common
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "TheFloresto: Clean Dirty Flag" || true
