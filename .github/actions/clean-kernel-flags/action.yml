name: 'Clean Kernel Flags'
description: 'Clean dirty flags and ABI exports to prevent build errors'

runs:
  using: "composite"
  steps:
    - name: Clean Dirty Flags and ABI Exports
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        #Remove Dirty Flag
        sed -i 's/-dirty//' ./scripts/setlocalversion
        sed -i '/# Check for uncommitted changes\./,/fi/d' ./scripts/setlocalversion
        
        #Remove Abi Exports and Error
        rm -rf android/abi_gki_protected_exports_*
        perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' BUILD.bazel
        
        # Commit changes to avoid dirty state during build
        cd ${{ github.workspace }}/kernel/common
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "TheFloresto: Clean Dirty Flag"
