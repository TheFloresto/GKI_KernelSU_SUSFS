name: Setup SUSFS for KernelSU-Next
description: Clone and apply SUSFS patches for KernelSU-Next
inputs:
  android_version:
    description: 'Android version (e.g., android15)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  os_patch_level:
    description: 'OS patch level (e.g., 2024-07)'
    required: true
  sublevel:
    description: 'Kernel sublevel'
    required: true
  susfs_commit:
    description: 'Commit map (branch:commit,branch:commit...)'
    required: false

runs:
  using: composite
  steps:
    - name: Setup SUSFS Branch
      shell: bash
      run: |
        SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
        SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"

        echo "Preparing SUSFS for branch: $SUSFS_BRANCH"

        COMMIT_MAP="${{ inputs.susfs_commit }}"
        TARGET_COMMIT=""

        if [ -n "$COMMIT_MAP" ]; then
          IFS=',' read -ra ENTRIES <<< "$COMMIT_MAP"
          for entry in "${ENTRIES[@]}"; do
            IFS=':' read -r branch commit <<< "$entry"
            if [ "$branch" == "$SUSFS_BRANCH" ]; then
              TARGET_COMMIT="$commit"
              break
            fi
          done
        fi

        if [ -n "$TARGET_COMMIT" ]; then
          echo "Found specific commit for $SUSFS_BRANCH: $TARGET_COMMIT"
          git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" susfs4ksu
          cd susfs4ksu
          git checkout "$TARGET_COMMIT"
          cd ..
        else
          echo "No specific commit found for $SUSFS_BRANCH, cloning latest..."
          git clone "$SUSFS_REPO" -b "$SUSFS_BRANCH" --depth=1 susfs4ksu
        fi

        SUSFS_VERSION="2.1.0"
        echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV

    - name: Enable KernelSU SUSFS Config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        cat >> "${{ github.workspace }}/thefloresto.fragment" << 'FRAG'
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        FRAG

    - name: Apply Base SUSFS Patches
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/fs/"* "${{ github.workspace }}/kernel/common/fs/"
        cp "${{ github.workspace }}/susfs4ksu/kernel_patches/include/linux/"* "${{ github.workspace }}/kernel/common/include/linux/"     
        
    - name: Apply KernelSU-Next Enable Patch
      shell: bash
      run: |
        set -euo pipefail
        SUSFS_VERSION="${{ env.SUSFS_VERSION }}"
        SUSFS_FOLDER="${{ github.workspace }}/susfs4ksu"
        KERNEL_PATCHES_FOLDER="${{ github.workspace }}/kernel_patches"
        PATCH_DIR="${KERNEL_PATCHES_FOLDER}/next/susfs_fix_patches/v${SUSFS_VERSION}"

        KSUN_DIR="${{ github.workspace }}/kernel/KernelSU-Next"

        if [ ! -d "$KSUN_DIR" ]; then
          echo "::error::KernelSU-Next not found at: $KSUN_DIR"
          exit 1
        fi

        cd "$KSUN_DIR"

        patch -p1 --forward < "${SUSFS_FOLDER}/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true

        for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
          patch_file="${PATCH_DIR}/fix_${file}.patch"
          if [ -f "$patch_file" ]; then
            echo "Patching file: $file with fix_${file}.patch"
            patch -p1 --forward < "$patch_file"
          else
            echo "⚠️ Skipping missing patch: fix_${file}.patch"
          fi
        done

        echo "Patching Hook Mode!"
        patch -p1 --forward < "${PATCH_DIR}/overwrite_hook_mode.patch"
        echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
        patch -p1 --forward < "${PATCH_DIR}/ksu_toolkit.patch"
        echo "Patching Multi-manager Support for SusFS kernel!"
        patch -p1 --forward < "${PATCH_DIR}/multi_manager.patch"
        echo "Patching Multi-manager sepolicy Support for SusFS kernel!"
        patch -p1 --forward < "${PATCH_DIR}/multi_sepolicy_fix.patch"
