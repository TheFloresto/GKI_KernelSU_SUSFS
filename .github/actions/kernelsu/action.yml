name: 'Setup Wild KSU'
description: 'Download and configure Wild KSU with version tracking'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12) needed for Kbuild patching'
    required: false
  use_latest_commits:
    description: 'Use the latest commit on the branch instead of the pinned commit'
    required: false
    default: true
  ksu_variant:
    description: 'KSU variant (Next, KSU, MKSU, KowSU, ReSukiSU, WKSU)'
    required: false
    default: Next    

runs:
  using: composite
  steps:
    - name: Download Wild KSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_VARIANT="${{ inputs.ksu_variant }}"
        KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
        KSU_BRANCH="dev"

        case "$KSU_VARIANT" in
          Next)
            if [ "${{ inputs.use_latest_commits }}" = "true" ]; then
              echo "Using latest KernelSU-Next from branch: $KSU_BRANCH"
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
            else
              COMMITS_JSON="${{ github.workspace }}/.github/config/commits.json"
              KSU_SETUP_COMMIT=$(jq -er '.kernelsu.dev' "$COMMITS_JSON")
              echo "Using pinned KernelSU commit: $KSU_SETUP_COMMIT"
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_SETUP_COMMIT"
              git -C KernelSU-Next/kernel checkout "$KSU_SETUP_COMMIT"
            fi       
            KSU_DIR="KernelSU-Next"
            BASE_VERSION=30000
            ;;
          KSU)
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            KSU_DIR="KernelSU"
            BASE_VERSION=30000
            ;;
          MKSU)
            curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main
            KSU_DIR="KernelSU"
            BASE_VERSION=30000
            ;;
          KowSU)
            curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU-Next/master/kernel/setup.sh" | bash -s master
            KSU_DIR="KernelSU"
            BASE_VERSION=30000
            ;;
          ReSukiSU)
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
            if [ -d "ReSukiSU" ] && [ ! -d "KernelSU" ]; then
              KSU_DIR="ReSukiSU"
            elif [ -d "SukiSU-Ultra" ] && [ ! -d "KernelSU" ]; then
              KSU_DIR="SukiSU-Ultra"
            else
              KSU_DIR="KernelSU"
            fi
            BASE_VERSION=33275
            ;;
          WKSU)
            curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/stable/kernel/setup.sh" | bash -s stable
            KSU_DIR="Wild_KSU"
            BASE_VERSION=30000
            ;;
          *)
            echo "Unknown ksu_variant: $KSU_VARIANT" >&2
            exit 1
            ;;
        esac

        echo "KSU_VARIANT=$KSU_VARIANT" >> "$GITHUB_ENV"
        echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
        echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"

        if [ ! -d "$KSU_DIR/kernel" ]; then
          echo "::warning::Expected $KSU_DIR/kernel directory not found after setup.sh; listing top-level dirs:"
          ls -1
        fi

        cd "$KSU_DIR/kernel"

        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_VERSION=$(expr "$COMMITS_COUNT" "+" "$BASE_VERSION")
        if grep -q '^KSU_VERSION_FALLBACK := 1$' Kbuild 2>/dev/null; then
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild
        fi

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
        if grep -q '^KSU_VERSION_TAG_FALLBACK := v0.0.1$' Kbuild 2>/dev/null; then
          sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild
        fi

        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

    - name: 'Fix KernelSU-Next'
      if: ${{ inputs.ksu_variant == 'Next' }}
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail
        cp ${{ github.action_path }}/patches/static.patch "${{ github.workspace }}/kernel/KernelSU-Next/static.patch"
        patch -p1 < static.patch

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
