name: Setup KSU Variant
description: Download and configure the selected KSU variant with version tracking

inputs:
  ksu_variant:
    description: 'KSU variant (Next, KSU, MKSU, KowSU, ReSukiSU, WKSU)'
    required: false
    default: Next

runs:
  using: composite
  steps:
    - name: Download KSU Variant
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        KSU_VARIANT="${{ inputs.ksu_variant }}"
        COMMITS_JSON="${{ github.workspace }}/.github/config/commits.json"

        case "$KSU_VARIANT" in
          Next)
            KSU_SETUP_COMMIT=$(jq -er '.kernelsu.dev' "$COMMITS_JSON")
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s "$KSU_SETUP_COMMIT"
            KSU_DIR="KernelSU-Next"
            BASE_VERSION=30000
            ;;
          KSU)
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
            KSU_DIR="KernelSU"
            BASE_VERSION=30000
            ;;
          MKSU)
            curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash -s main
            KSU_DIR="KernelSU"
            BASE_VERSION=30000
            ;;
          KowSU)
            curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU-Next/master/kernel/setup.sh" | bash -s master
            KSU_DIR="KernelSU"
            BASE_VERSION=30000
            ;;
          ReSukiSU)
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
            if [ -d "ReSukiSU" ] && [ ! -d "KernelSU" ]; then
              KSU_DIR="ReSukiSU"
            elif [ -d "SukiSU-Ultra" ] && [ ! -d "KernelSU" ]; then
              KSU_DIR="SukiSU-Ultra"
            else
              KSU_DIR="KernelSU"
            fi
            BASE_VERSION=33275
            ;;
          WKSU)
            curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/stable/kernel/setup.sh" | bash -s stable
            KSU_DIR="Wild_KSU"
            BASE_VERSION=30000
            ;;
          *)
            echo "Unknown ksu_variant: $KSU_VARIANT" >&2
            exit 1
            ;;
        esac

        echo "KSU_VARIANT=$KSU_VARIANT" >> "$GITHUB_ENV"
        echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
        echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"

        if [ ! -d "$KSU_DIR/kernel" ]; then
          echo "::warning::Expected $KSU_DIR/kernel directory not found after setup.sh; listing top-level dirs:"
          ls -1
        fi

        cd "$KSU_DIR/kernel"

        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_VERSION=$(expr "$COMMITS_COUNT" "+" "$BASE_VERSION")
        if grep -q '^KSU_VERSION_FALLBACK := 1$' Kbuild 2>/dev/null; then
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild
        fi

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.1")"
        if grep -q '^KSU_VERSION_TAG_FALLBACK := v0.0.1$' Kbuild 2>/dev/null; then
          sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild
        fi

        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
        echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> "$GITHUB_ENV"
        echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

    - name: Fix KSU include paths (upstream breakage workarounds)
      shell: bash
      if: ${{ inputs.version == 'android15-6.12' }}
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # KernelSU-Next dev currently has policy/allowlist.h including
        # "uapi/app_profile.h" but no policy/uapi/ directory exists in the
        # tree — the file is at policy/app_profile.h. Patch the include
        # to use the actual location. Idempotent: if upstream fixes it
        # (either by adding policy/uapi/ or correcting the include), the
        # sed becomes a no-op.
        FIXED=0
        while IFS= read -r -d '' f; do
          if grep -q '#include "uapi/app_profile\.h"' "$f"; then
            sed -i 's|#include "uapi/app_profile\.h"|#include "app_profile.h"|' "$f"
            echo "[ksu-fix] rewrote uapi/app_profile.h include in $f"
            FIXED=$((FIXED+1))
          fi
        done < <(find . -path ./common -prune -o -type f -name 'allowlist.h' -print0 2>/dev/null)

        if [ "$FIXED" -eq 0 ]; then
          echo "[ksu-fix] no allowlist.h files needed patching"
        fi

    - name: Enable KernelSU Config
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        cat >> "${{ github.workspace }}/thefloresto.fragment" << 'EOF'
        # KernelSU Configuration
        CONFIG_KSU=y
        EOF
