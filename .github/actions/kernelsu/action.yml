name: Setup Wild KSU
description: Download and configure Wild KSU with version tracking
inputs:
  ksu_branch:
    description: 'KernelSU branch or commit (empty = latest dev-susfs branch tip)'
    required: false
    default: ""
  version:
    description: 'Kernel version tag, e.g. android16-6.12 (used to scope version-specific fixes)'
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download KSU
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        # Retry transient network errors (up to 5 attempts, 5s backoff).
        # Diagnostics go to stderr so pipes to grep are not polluted.
        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }

        KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="dev-susfs"
        fi

        # Try as branch first, fall back to commit
        if retry git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
          echo "Using KernelSU-Next branch: $KSU_INPUT"
          curl -LSs --retry 5 --retry-delay 5 --retry-all-errors "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          retry git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
          git -C KernelSU-Next/kernel checkout "origin/$KSU_INPUT"
        else
          echo "Using KernelSU-Next commit: $KSU_INPUT"
          curl -LSs --retry 5 --retry-delay 5 --retry-all-errors "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          retry git -C KernelSU-Next/kernel fetch --depth=50 origin "$KSU_INPUT"
          git -C KernelSU-Next/kernel checkout "$KSU_INPUT"
        fi

        cd KernelSU-Next/kernel

        # Anchor the version to the upstream sync point (merge-base with
        # origin/<base-branch>) exactly like the official manager's
        # versionCode and pershoot's Kbuild (c0a2c5fd), so the kernel's
        # KSU_VERSION_FALLBACK matches the manager version the kernel
        # reports at runtime. Fall back to origin/main, then HEAD.
        BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD | sed 's:-.*::' 2>/dev/null)
        BASE_COMMIT=$(git merge-base HEAD refs/remotes/origin/$BASE_BRANCH 2>/dev/null || git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
        COMMITS_COUNT=$(/usr/bin/git rev-list --count $BASE_COMMIT)
        BASE_VERSION=30000
        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
        sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild

        KSU_GIT_TAG="$(git describe --tags --abbrev=0 $BASE_COMMIT 2>/dev/null || echo "v0.0.1")"
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild

    - name: 'Fix missing headers pulled in from outside kernel/ (e.g. uapi/, klog.h)'
      shell: bash
      # Only seen on android16-6.12 so far (pershoot/KernelSU-Next officially only
      # supports up to 6.6, and 6.1-6.6 builds compile the driver fine as of now).
      # Scoped here rather than left unconditional at the user's request - note this
      # means if the same upstream regression later shows up on 6.1-6.6 too, this
      # step won't catch it there; the build will just fail with the raw compiler
      # error again like before.
      if: ${{ inputs.version == 'android16-6.12' }}
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail
        # setup.sh only symlinks the "kernel/" subdirectory of the KernelSU-Next
        # repo into drivers/kernelsu. Some recent upstream commits moved shared
        # headers (e.g. the top-level uapi/app_profile.h) out of kernel/ into
        # sibling repo-root directories, which the relative #include "uapi/..."
        # inside kernel/policy/allowlist.h can no longer see once only kernel/
        # is exposed to the build. Re-link any such repo-root dirs referenced
        # by #include "X/..." from inside kernel/ back into kernel/ so they
        # resolve again, regardless of exact upstream layout.
        MISSING=0
        for inc in $(grep -rhoP '#include\s+"\K[^"]+(?=")' kernel/ 2>/dev/null | sort -u); do
          # Only care about includes that reference a subdirectory (e.g. uapi/x.h)
          case "$inc" in
            */*) : ;;
            *) continue ;;
          esac
          if [ -f "kernel/$inc" ]; then
            continue
          fi
          TOPDIR="${inc%%/*}"
          if [ -d "$TOPDIR" ] && [ ! -e "kernel/$TOPDIR" ]; then
            echo "[INFO] kernel/$inc missing but found repo-root '$TOPDIR/' - linking kernel/$TOPDIR -> ../$TOPDIR"
            ln -s "../$TOPDIR" "kernel/$TOPDIR"
          fi
        done
        # Verify every #include "..." used inside kernel/ now resolves; fail
        # loudly and early (instead of deep inside the kernel build) if not.
        for inc in $(grep -rhoP '#include\s+"\K[^"]+(?=")' kernel/ 2>/dev/null | sort -u); do
          case "$inc" in
            */*) : ;;
            *) continue ;;
          esac
          if [ ! -f "kernel/$inc" ]; then
            echo "::warning::kernel/$inc is #included from KernelSU-Next sources but does not exist anywhere in the checked-out tree. This looks like an upstream regression on the pinned KernelSU-Next branch/commit (KSU_VERSION=${KSU_VERSION:-unknown}), not a problem with this workflow. Consider pinning ksu_branch to an older known-good commit until upstream fixes it."
            MISSING=1
          fi
        done
        if [ "$MISSING" -eq 1 ]; then
          echo "KERNELSU_HEADER_GAP=true" >> "$GITHUB_ENV"
        else
          echo "KERNELSU_HEADER_GAP=false" >> "$GITHUB_ENV"
        fi
    
    - name: Extract KSU Version Info
      id: ksu-version
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        # Get the base branch name by stripping suffixes (e.g., dev-susfs -> dev)
        BASE_BRANCH=$(git rev-parse --abbrev-ref HEAD | sed 's:-.*::' 2>/dev/null)
        # Find the merge-base with the official origin branch to exclude local commits
        BASE_COMMIT=$(git merge-base HEAD refs/remotes/origin/$BASE_BRANCH 2>/dev/null || git merge-base HEAD refs/remotes/origin/main 2>/dev/null || echo HEAD)
        KSU_GIT_VERSION=$(git rev-list --count $BASE_COMMIT 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 $BASE_COMMIT 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short HEAD 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))
        
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV

    - name: 'Fix KernelSU-Next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        set -euo pipefail
        cp ${{ github.action_path }}/patches/static.patch "${{ github.workspace }}/kernel/KernelSU-Next/static.patch"
        patch -p1 < static.patch

    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y
